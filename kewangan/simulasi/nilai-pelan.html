<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Penilai Pelan · Bab 10</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#141005;--sf:#21190A;--sf2:#2B210E;--sf3:#1A1407;--bd:#3F3115;--bd2:#56431D;--tx:#FFF7E6;--mu:#D9C49A;--mu2:#A08B60;--c1:#FFC93C;--c2:#34D399;--c3:#4FD1FF;--pk:#FF7AB6;--ok:#3DDC84;--bad:#FF6B7A;
 --surface:#21190A;--border:#56431D;--text:#FFF7E6;--muted:#D9C49A;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:5px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:14.5px;padding:10px 4px;border-radius:12px}
.modes button.on{background:var(--c1);color:#2a1d00}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;line-height:1.45;font-size:15px}
.info b.t{display:block;font-size:18px;color:var(--c1);margin-bottom:2px}
.info .row{display:flex;flex-wrap:wrap;gap:2px 16px;font-weight:700}
.info .c1{color:var(--c1)}.info .c2{color:var(--c2)}.info .c3{color:var(--c3)}.info .pk{color:var(--pk)}
.info .tip{color:var(--mu);font-size:13px;margin-top:3px}
.info .eq{margin-top:5px;padding:7px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:700;font-size:14.5px}
.info .ok{color:var(--ok);font-weight:800}.info .no{color:var(--bad);font-weight:800}
.ctrl{display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:8px;align-items:center}
.line label{font-weight:800;color:var(--mu);font-size:14px;white-space:nowrap;min-width:126px}
.line label b{color:var(--tx)}
.line input[type=range]{flex:1;min-width:0;accent-color:var(--c1);height:28px}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:16px}.ctrl{grid-area:c;align-self:end}
 .info b.t{font-size:22px}.info .eq{font-size:16px}
}
@media(max-height:620px){.wrap{gap:6px;padding-top:6px}.modes button{padding:7px 3px;font-size:13.5px}.info{padding:7px 11px;font-size:13.5px}.info b.t{font-size:16px}.line input[type=range]{height:24px}}
@media(max-width:420px){.modes button{font-size:13px;padding:9px 2px}.line label{min-width:116px;font-size:13px}.info{font-size:14px}.info .eq{font-size:13.5px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(12px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#FFC93C;color:#2a1d00;border-radius:14px;padding:11px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #ffc93c44">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Pilih watak">
   <button data-p="0" class="on" role="tab">👨 Daniel</button>
   <button data-p="1" role="tab">👩 Puan Lina</button>
   <button data-p="2" role="tab">🎒 Aina</button>
  </div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" aria-label="Penilai pelan kewangan"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl"></div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),stage=document.getElementById('stage'),info=document.getElementById('info'),ctrl=document.getElementById('ctrl');
const C1='#FFC93C',C2='#34D399',C3='#4FD1FF',PK='#FF7AB6',PU='#B79CFF',MU='#D9C49A',MU2='#A08B60',TX='#FFF7E6',HALO='#1A1407',OK='#3DDC84',BAD='#FF6B7A';
const snd=n=>{if(window.FX)FX.play(n)};
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const r2=x=>Math.round((x+1e-9)*100)/100;
function rm(x){x=r2(x);const neg=x<0;x=Math.abs(x);const s=Number.isInteger(x)?grp(String(x)):(()=>{const [a,b]=x.toFixed(2).split('.');return grp(a)+'.'+b})();return(neg?'−':'')+'RM'+s}
const T=(x,y,t,c=TX,s=14,w=800,a='middle')=>`<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${c}" font-size="${s}" font-weight="${w}" text-anchor="${a}" dominant-baseline="middle" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="${HALO}" stroke-width="4" stroke-linejoin="round">${t}</text>`;
/* ---------- watak: pendapatan, perbelanjaan tetap, perbelanjaan tidak tetap [nama, nilai, minimum munasabah], matlamat ---------- */
const PER=[
 {n:'Daniel',inc:[['Gaji bersih',3200]],fix:[['Sewa bilik',800],['Ansuran motosikal',250],['Premium insurans',150]],
  vr:[['Makanan',900,600],['Utiliti & petrol',300,200],['Hiburan',400,0],['Beli dalam talian',350,0]],goal:3600,item:'komputer riba',mo:12,xmax:800,xs:50},
 {n:'Puan Lina',inc:[['Gaji bersih',4500],['Sewa rumah (pasif)',500]],fix:[['Ansuran rumah',1500],['Ansuran kereta',600]],
  vr:[['Makanan',1200,800],['Utiliti',400,250],['Hiburan',300,0],['Makan di luar',500,0]],goal:9000,item:'wang pendahuluan kereta kedua',mo:12,xmax:1000,xs:50},
 {n:'Aina',inc:[['Wang saku',300]],fix:[['Tambang bas bulanan',40]],
  vr:[['Makanan di kantin',150,100],['Kredit telefon',30,10],['Hiburan',50,0],['Makanan ringan',30,0]],goal:240,item:'kasut sukan',mo:4,xmax:200,xs:10}];
let S={p:0,v:[],mo:12,x:0,drag:null};
let G=null;
function load(i){const P=PER[i];S.p=i;S.v=P.vr.map(r=>r[1]);S.mo=P.mo;S.x=0;setCtrl();render()}
function calc(){const P=PER[S.p],I=P.inc.reduce((s,r)=>s+r[1],0)+S.x,F=P.fix.reduce((s,r)=>s+r[1],0),V=S.v.reduce((s,v)=>s+v,0),L=I-F-V,need=P.goal/S.mo;
 return{P,I,F,V,L,need,ok:L>=need-1e-9,minMo:L>0?Math.ceil(P.goal/L-1e-9):Infinity}}
function draw(){
 const w=stage.clientWidth||340,h=stage.clientHeight||360;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 const c=calc(),P=c.P,n=P.vr.length,cmpH=Math.max(96,Math.min(150,h*0.38)),top=30,rh=(h-cmpH-top-8)/n,lw=Math.min(170,Math.max(132,w*0.36)),x0=12+lw,x1=w-78;
 let g=T(12,16,'PERBELANJAAN TIDAK TETAP (seret untuk ubah)',PK,Math.min(12.5,w/32),900,'start');
 G={x0,x1,rows:[]};
 P.vr.forEach(([nm,orig,mn],i)=>{const y=top+i*rh+rh/2,mx=orig*2,bw=(x1-x0)*S.v[i]/mx,bh=Math.min(22,rh*0.6),ox=x0+(x1-x0)*orig/mx;
  g+=T(14,y,nm,TX,Math.max(12,Math.min(14,rh*0.42,(lw-10)/(nm.length*0.56))),700,'start');
  g+=`<rect x="${x0}" y="${y-bh/2}" width="${x1-x0}" height="${bh}" rx="${bh/2}" fill="#ffffff0d"/>`;
  g+=`<rect x="${x0}" y="${y-bh/2}" width="${Math.max(0,bw)}" height="${bh}" rx="${bh/2}" fill="${PK}55" stroke="${PK}" stroke-width="2"/>`;
  g+=`<line x1="${ox}" y1="${y-bh/2-4}" x2="${ox}" y2="${y+bh/2+4}" stroke="${MU}" stroke-width="2" stroke-dasharray="3 3"/>`;
  g+=`<circle cx="${x0+bw}" cy="${y}" r="${Math.min(12,bh*0.62)}" fill="${PK}" stroke="#fff" stroke-width="2.5"/>`;
  g+=T(w-8,y,rm(S.v[i]),S.v[i]<orig?C2:S.v[i]>orig?BAD:PK,Math.min(14.5,rh*0.46),800,'end');
  G.rows.push({i,y0:y-rh/2,y1:y+rh/2,mx})});
 // perbandingan: simpanan perlu vs lebihan
 const y0=h-cmpH,bx=x0,bw=x1-x0,mx=Math.max(c.need,Math.max(c.L,0),1)*1.1,bh=Math.min(26,cmpH*0.2);
 g+=`<line x1="10" y1="${y0}" x2="${w-10}" y2="${y0}" stroke="${MU2}" stroke-width="1.5" stroke-dasharray="5 5"/>`;
 const yA=y0+cmpH*0.24,yB=y0+cmpH*0.52;
 g+=T(14,yA,'Simpanan perlu',C1,13.5,800,'start')+`<rect x="${bx}" y="${yA-bh/2}" width="${bw*c.need/mx}" height="${bh}" rx="6" fill="${C1}55" stroke="${C1}" stroke-width="2"/>`+T(w-8,yA,rm(r2(c.need)),C1,13.5,800,'end');
 g+=T(14,yB,'Lebihan',C2,13.5,800,'start')+`<rect x="${bx}" y="${yB-bh/2}" width="${bw*Math.max(c.L,0)/mx}" height="${bh}" rx="6" fill="${(c.ok?C2:BAD)}55" stroke="${c.ok?C2:BAD}" stroke-width="2"/>`+T(w-8,yB,rm(c.L),c.ok?C2:BAD,13.5,800,'end');
 const nx=bx+bw*c.need/mx;g+=`<line x1="${nx}" y1="${yA-bh}" x2="${nx}" y2="${yB+bh}" stroke="${C1}" stroke-width="2" stroke-dasharray="4 4"/>`;
 g+=T(w/2,y0+cmpH*0.82,c.ok?'✓ Pelan BOLEH dilaksanakan':'✗ Pelan TIDAK boleh dilaksanakan',c.ok?OK:BAD,Math.min(17,w/22),900);
 svg.innerHTML=g}
function showInfo(){
 const c=calc(),P=c.P,gap=r2(c.need-c.L);
 let tips;
 if(c.ok)tips=`Baki selepas simpanan: ${rm(r2(c.L-c.need))} sebulan.`;
 else tips=`Kurang <b class="no">${rm(gap)}</b> sebulan. Cadangan: kurangkan perbelanjaan tidak tetap sebanyak ${rm(gap)}, tambah pendapatan, ${c.minMo<Infinity?`atau panjangkan tempoh kepada sekurang-kurangnya <b>${c.minMo} bulan</b>.`:'kerana lebihan sekarang tiada.'}`;
 info.innerHTML=`<b class="t">${P.n}: ${P.item} ${rm(P.goal)} dalam ${S.mo} bulan</b>
 <div class="eq">Lebihan = ${grp(String(c.I))} − ${grp(String(c.F))} − ${grp(String(c.V))} = <span class="${c.L>=0?'c2':'no'}">${rm(c.L)}</span><br>Simpanan perlu = ${grp(String(P.goal))} ÷ ${S.mo} = <span class="c1">${rm(r2(c.need))}</span></div>
 <div class="tip">${tips} Garis putus-putus pada bar = nilai asal.</div>`}
function setCtrl(){
 const P=PER[S.p];
 ctrl.innerHTML=`<div class="line"><label>Tempoh: <b id="vM">${S.mo} bulan</b></label><input type="range" id="sM" min="1" max="${P.mo*4}" step="1" value="${S.mo}" aria-label="Tempoh simpanan dalam bulan"></div>
 <div class="line"><label>Kerja sambilan: <b id="vX">${rm(S.x)}</b></label><input type="range" id="sX" min="0" max="${P.xmax}" step="${P.xs}" value="${S.x}" aria-label="Pendapatan tambahan sebulan"></div>`;
 const sM=document.getElementById('sM'),sX=document.getElementById('sX');
 sM.oninput=()=>{S.mo=+sM.value;document.getElementById('vM').textContent=S.mo+' bulan';render(true)};
 sX.oninput=()=>{S.x=+sX.value;document.getElementById('vX').textContent=rm(S.x);render(true)}}
let lastOk=null;
function render(chk){draw();showInfo();const ok=calc().ok;if(chk&&lastOk===false&&ok){snd('menang');if(window.FX)FX.stars(info,14)}lastOk=ok}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));snd('ketik');lastOk=null;load(+b.dataset.p)});
/* ---------- seret bar (tetikus + sentuh) ---------- */
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function setRow(p){const R=G.rows.find(r=>r.i===S.drag),st=S.p===2?5:10;let v=Math.round(((p.x-G.x0)/(G.x1-G.x0))*R.mx/st)*st;v=Math.max(0,Math.min(R.mx,v));if(v!==S.v[S.drag]){S.v[S.drag]=v;if(v%100===0)snd('detik');render(true)}}
svg.addEventListener('pointerdown',e=>{if(!G)return;const p=svgPt(e),row=G.rows.find(r=>p.y>=r.y0&&p.y<=r.y1);if(!row)return;e.preventDefault();S.drag=row.i;svg.setPointerCapture(e.pointerId);setRow(p)});
svg.addEventListener('pointermove',e=>{if(S.drag==null)return;e.preventDefault();setRow(svgPt(e))});
const end=()=>{if(S.drag==null)return;S.drag=null;const c=calc(),P=c.P;const low=P.vr.find((r,i)=>S.v[i]<r[2]);if(low)info.querySelector('.tip').insertAdjacentHTML('beforeend',` <b class="no">Awas:</b> ${low[0].toLowerCase()} di bawah ${rm(low[2])} mungkin tidak munasabah (keperluan asas).`)};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',()=>{S.drag=null});
new ResizeObserver(()=>render()).observe(stage);
load(0);
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
