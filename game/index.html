<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Game · TerokaMath</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/logo.svg">
<link rel="apple-touch-icon" href="../icons/apple-180.png">
<script>try{if(localStorage.getItem('mathmotion-mode')==='cerah')document.documentElement.classList.add('light')}catch(e){}</script>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url('../teras/fonts/inter-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700 900;font-display:swap;src:url('../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url('../teras/fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--nav:#0E1626;--surf:#131C2E;--bd:#22304A;--tx:#E6EDF7;--mu:#94A3B8;--am:#FBBF24;--on:#0B1220}
html.light{--bg:#F4F6FB;--nav:#FFFFFF;--surf:#FFFFFF;--bd:#D5DCE8;--tx:#14152B;--mu:#55607A;--am:#B45309;--on:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100vh}
button,a{font:inherit;color:inherit}
header{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;padding-top:env(safe-area-inset-top,0);background:var(--nav);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2}
.back{height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:12px;border:1px solid var(--bd);text-decoration:none;font-weight:700;font-size:15px}
.ttl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px}.ttl span{color:var(--am)}
main{max-width:1240px;margin:0 auto;padding:24px 20px 40px;display:grid;grid-template-columns:400px 1fr;gap:30px}
.lb{margin:0 0 12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:16px;font-weight:900;letter-spacing:.1em;color:var(--tx)}
.lb i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:var(--am);color:var(--on);display:inline-flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:0}
.lb span{color:var(--am);font-size:14px;letter-spacing:.06em}
.ting{display:flex;gap:8px;margin-bottom:20px}
.ting button{flex:1;height:52px;border-radius:14px;border:2px solid var(--bd);background:var(--surf);font-weight:800;font-size:18px;cursor:pointer}
.ting button.on,.bab button.on{border-color:var(--am);background:color-mix(in srgb,var(--am) 15%,transparent);color:var(--am)}
.ting button.asas{flex:1.6;font-size:17px;white-space:nowrap}
.bab{display:flex;flex-direction:column;gap:6px}
.bab button{min-height:46px;border-radius:12px;border:2px solid var(--bd);background:var(--surf);text-align:left;padding:8px 14px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;cursor:pointer}
.bab button.on{color:var(--tx)}
.bab b{width:26px;flex:none;color:var(--mu)}.bab button.on b{color:var(--am)}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g{border-radius:22px;background:var(--surf);border:2px solid var(--bd);overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.g .pic{height:118px;position:relative}
.g .pic span{position:absolute;left:12px;top:12px;height:24px;padding:0 9px;border-radius:8px;background:#0B1220CC;display:flex;align-items:center;font-weight:800;font-size:11px;letter-spacing:.08em}
.g .tx{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.g h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:22px}
.g p{margin:0;font-size:14px;line-height:1.45;color:var(--mu)}
.g .go{margin-top:auto;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#0B1220}
.g.soon{opacity:.45;pointer-events:none}.g.soon .go{background:var(--bd);color:var(--mu)}
.g.off{opacity:.5;pointer-events:none}
.hint{margin:0 0 12px;color:var(--mu);font-size:15px}
@media (max-width:860px){main{grid-template-columns:1fr}.games{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.games{grid-template-columns:1fr}.ttl{font-size:19px}}
</style>
</head>
<body>
<header><a class="back" href="../#/utama"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Laman utama</a><span class="ttl">Game <span>TerokaMath</span></span></header>
<main>
 <section>
  <p class="lb"><i>1</i>TINGKATAN</p>
  <div class="ting" id="ting"></div>
  <p class="lb"><i>2</i>BAB</p>
  <div class="bab" id="bab"></div>
 </section>
 <section>
  <p class="lb" id="gl"><i>3</i>GAME</p>
  <p class="hint" id="hint"></p>
  <div class="games" id="games"></div>
 </section>
</main>
<script src="../teras/bahasa.js"></script>
<script src="senarai.js"></script>
<script>
const GAMES=[
 {id:'lari',name:'Lari Pecut',dunia:'JALAN KAMPUNG',d:'Lari, kutip syiling dan elak halangan. Bila soalan muncul, masuk lorong jawapan betul.',col:'#FBBF24',sky:'linear-gradient(#7DD3FC 72%,#65A30D 72%)'},
 {id:'tembak',name:'Tembak Angkasa',dunia:'LANGIT KL',d:'Tembak meteor untuk markah. Bila soalan muncul, tembak asteroid jawapan betul.',col:'#A78BFA',sky:'linear-gradient(#1E1B4B 74%,#312E81 74%)'},
 {name:'Sampan Laju',dunia:'SUNGAI & BAKAU',d:'Kayuh, elak buaya, ambil pelampung jawapan.',col:'#34D399',sky:'linear-gradient(#0E7490 70%,#155E75 70%)'},
 {name:'Wau Terbang',dunia:'PANTAI TIMUR',d:'Terbangkan wau melalui cincin jawapan.',col:'#F472B6',sky:'linear-gradient(#FDBA74 70%,#FDE68A 70%)'},
 {name:'Kejar Kancil',dunia:'HUTAN HUJAN',d:'Lompat dahan dan kejar jawapan.',col:'#34D399',sky:'linear-gradient(#14532D 70%,#166534 70%)'},
 {name:'Bola Sepak',dunia:'PADANG SEKOLAH',d:'Tendang bola ke gol jawapan.',col:'#38BDF8',sky:'linear-gradient(#38BDF8 70%,#16A34A 70%)'},
 {name:'Panjat Kelapa',dunia:'KAMPUNG PANTAI',d:'Panjat pokok kelapa. Pilih dahan jawapan betul untuk terus naik.',col:'#FBBF24',sky:'linear-gradient(#67E8F9 70%,#FDE68A 70%)'},
 {name:'Roket Sains',dunia:'PELANCARAN LANGKAWI',d:'Isi bahan api dengan jawapan betul. Makin betul, makin tinggi roket terbang.',col:'#F87171',sky:'linear-gradient(#FDBA74 70%,#475569 70%)'},
 {name:'Gasing Juara',dunia:'GELANGGANG KELANTAN',d:'Jawapan betul beri gasing pusingan tambahan. Siapa paling lama?',col:'#FB923C',sky:'linear-gradient(#78350F 70%,#A16207 70%)'},
 {name:'Kereta Api Jawapan',dunia:'LANDASAN KTM',d:'Tukar landasan ke stesen yang ada jawapan betul.',col:'#60A5FA',sky:'linear-gradient(#93C5FD 70%,#57534E 70%)'},
 {name:'Penyu Pulang',dunia:'PANTAI TERENGGANU',d:'Bawa anak penyu ke laut melalui laluan jawapan betul.',col:'#2DD4BF',sky:'linear-gradient(#0EA5E9 66%,#FDE68A 66%)'},
 {name:'Pasar Malam',dunia:'GERAI MALAM',d:'Layan pelanggan dengan menyerahkan barang berlabel jawapan betul.',col:'#E879F9',sky:'linear-gradient(#1E1B4B 70%,#7C2D12 70%)'}];
const P=new URLSearchParams(location.search);
const ASAS={id:'asas',t:0,n:'',tajuk:'Kira Pantas'};
let pilih=P.get('b')==='asas'?ASAS:(SENARAI.find(s=>s.id===P.get('b'))||null), ting=pilih?pilih.t:(P.get('t')!=null&&P.get('t')!==''?+P.get('t'):1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
 document.getElementById('ting').innerHTML=[1,2,3,4,5].map(t=>`<button data-t="${t}" class="${t===ting?'on':''}" aria-pressed="${t===ting}" aria-label="Tingkatan ${t}">T${t}</button>`).join('')+`<button data-t="0" class="asas${ting===0?' on':''}" aria-pressed="${ting===0}" aria-label="Kira Pantas: tambah, tolak, darab dan bahagi">+ − × ÷</button>`;
 document.getElementById('bab').innerHTML=ting===0?'<p class="hint" style="grid-column:1/-1;margin:4px 0"><b>Kira Pantas</b>: soalan tambah, tolak, darab dan bahagi. Makin lama makin susah. Terus pilih game.</p>':SENARAI.filter(s=>s.t===ting).map(s=>`<button data-b="${s.id}" class="${pilih&&pilih.id===s.id?'on':''}" aria-pressed="${!!(pilih&&pilih.id===s.id)}"><b>${s.n}</b>${esc(s.tajuk)}</button>`).join('');
 document.getElementById('gl').innerHTML='<i>3</i>GAME'+(pilih?`<span>· ${pilih.id==='asas'?esc(pilih.tajuk):`Bab ${pilih.n} ${esc(pilih.tajuk)}`}</span>`:'');
 document.getElementById('hint').textContent=pilih?'':'Pilih bab dahulu.';
 document.getElementById('games').innerHTML=GAMES.map(g=>{const ok=g.id&&pilih;
  return `<a class="g ${g.id?(ok?'':'off'):'soon'}" ${ok?`href="main.html?b=${pilih.id}&g=${g.id}"`:'aria-disabled="true"'}>
  <div class="pic" style="background:${g.sky}"><span style="color:${g.col}">${g.dunia}</span></div>
  <div class="tx"><h3>${g.name}</h3><p>${g.d}</p><span class="go" style="${g.id?`background:${g.col}`:''}">${g.id?'Main':'Akan datang'}</span></div></a>`}).join('');
 document.querySelectorAll('#ting button').forEach(b=>b.onclick=()=>{ting=+b.dataset.t;if(ting===0){pilih=ASAS;history.replaceState(null,'','?b=asas')}else if(pilih&&pilih.t!==ting)pilih=null;draw()});
 document.querySelectorAll('#bab button').forEach(b=>b.onclick=()=>{pilih=SENARAI.find(s=>s.id===b.dataset.b);history.replaceState(null,'','?b='+pilih.id);draw();if(innerWidth<860)document.getElementById('gl').scrollIntoView({behavior:'smooth'})});
}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
</script>
</body>
</html>
