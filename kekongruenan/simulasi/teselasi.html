<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Teselasi · Bab 5</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--sf:#131C2E;--sf3:#0E1626;--bd:#22304A;--tx:#E6EDF7;--mu:#94A3B8;--tr:#38BDF8;--pk:#F472B6;--gr:#34D399;--am:#FBBF24;--pu:#A78BFA;--rd:#F87171;--grid:#1E2A40;
 font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
.wrap{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
h1{margin:0;font-size:20px;display:flex;align-items:center;gap:10px;justify-content:space-between}
h1 span{color:var(--c,var(--pk))}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:8px 12px}
.ctrl label{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex:1;min-width:200px}
.ctrl input[type=range]{flex:1;accent-color:var(--pk);height:28px}
.ctrl select{flex:1;min-width:0;width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;font-weight:700}
.btn{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;font-weight:700}
.btn.on{background:var(--c,var(--pk));color:#0B1220;border-color:transparent}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.45;min-height:56px}
.info b{color:var(--am)}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto}h1{grid-column:1/3}.stage{grid-row:2/4}.ctrl{align-content:flex-start}.info{grid-column:2}}
</style>
</head>
<body>
<div id="backAL" style="padding:calc(10px + env(safe-area-inset-top)) 12px 0;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#38BDF8;color:#0B1220;border-radius:14px;padding:10px 20px;font:900 16px Inter,system-ui,sans-serif;text-decoration:none">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap" style="--c:var(--am)">
<h1><span>Teselasi: 360° pada bucu</span><b id="sndslot"></b></h1>
<div class="stage"><svg id="sv" viewBox="-6 -6 12 12"></svg></div>
<div class="ctrl"><button class="btn" data-n="3">+ Segi tiga</button><button class="btn" data-n="4">+ Segi empat sama</button><button class="btn" data-n="5">+ Pentagon</button><button class="btn" data-n="6">+ Heksagon</button><button class="btn" data-n="8">+ Oktagon</button><button class="btn" data-n="12">+ Dodekagon</button><button class="btn" id="un">↶ Buang</button><button class="btn" id="cl">Kosongkan</button></div>
<div class="info" id="inf"></div></div>
<script>
const NS='http://www.w3.org/2000/svg';
const snd=n=>{if(window.FX)FX.play(n)};
const fm=v=>{v=Math.round(v*100)/100;if(Object.is(v,-0))v=0;return (v<0?'−':'')+Math.abs(v)};
function grid(R){let s='';for(let i=-R;i<=R;i++){s+=`<line x1="${i}" y1="${-R}" x2="${i}" y2="${R}" stroke="var(--grid)" stroke-width="${i?0.04:0.08}" ${i?'':'style="stroke:var(--mu)"'}/><line x1="${-R}" y1="${i}" x2="${R}" y2="${i}" stroke="var(--grid)" stroke-width="${i?0.04:0.08}" ${i?'':'style="stroke:var(--mu)"'}/>`}return s}
const poly=(p,c,dash)=>`<polygon points="${p.map(q=>q[0]+','+(-q[1])).join(' ')}" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-width=".12" stroke-linejoin="round" ${dash?'stroke-dasharray=".3 .2"':''}/>`;
const area=p=>Math.abs(p.reduce((s,q,i)=>{const r=p[(i+1)%p.length];return s+q[0]*r[1]-r[0]*q[1]},0))/2;

const sv=document.getElementById('sv'),COL={3:'var(--am)',4:'var(--tr)',5:'var(--rd)',6:'var(--pk)',8:'var(--gr)',12:'var(--pu)'},NM={3:'segi tiga',4:'segi empat sama',5:'pentagon',6:'heksagon',8:'oktagon',12:'dodekagon'};
const ang=n=>180*(n-2)/n;let L=[];
function draw(){let s='',a0=0;const sum=L.reduce((t,n)=>t+ang(n),0);
L.forEach(n=>{const a=ang(n)*Math.PI/180,u=2.6;const p=[[0,0]];let dir=a0,x=0,y=0;
 // bina poligon sekata bermula di bucu (0,0) dengan sisi pertama pada arah a0
 const ext=Math.PI-a;let d=a0;for(let i=0;i<n-1;i++){x+=u*Math.cos(d);y+=u*Math.sin(d);p.push([x,y]);d+=ext}
 // poligon dibina lawan arah jam; sudut di (0,0) terletak antara arah a0 dan a0+a
 s+=`<polygon points="${p.map(q=>q[0].toFixed(3)+','+(-q[1]).toFixed(3)).join(' ')}" fill="${COL[n]}" fill-opacity=".3" stroke="${COL[n]}" stroke-width=".07" stroke-linejoin="round"/>`;
 const m=a0+a/2;s+=`<text x="${(1*Math.cos(m)).toFixed(2)}" y="${(-1*Math.sin(m)).toFixed(2)}" font-size=".42" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="var(--tx)">${Math.round(ang(n)*100)/100}°</text>`;a0+=a});
s+='<circle cx="0" cy="0" r=".15" fill="var(--tx)"/>';sv.innerHTML=s;
const ok=Math.abs(sum-360)<1e-6,lebih=sum>360+1e-6;
document.getElementById('inf').innerHTML=(L.length?L.map(n=>`${fm(ang(n))}°`).join(' + ')+` = <b>${fm(sum)}°</b><br>`:'Tambah poligon sekata di sekeliling satu bucu.<br>')+(ok?'<b style="color:var(--gr)">Tepat 360°: boleh membentuk teselasi pada bucu ini!</b>':lebih?'<b style="color:var(--rd)">Lebih daripada 360°: poligon bertindih.</b>':`Baki ${fm(360-sum)}° lagi untuk mencapai 360°.`);
if(ok&&window.FX){snd('menang');FX.stars&&FX.stars(sv,12)}}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(L.reduce((t,n)=>t+ang(n),0)>360+1e-6)return;L.push(+b.dataset.n);snd('klik');draw()});
document.getElementById('un').onclick=()=>{L.pop();draw()};document.getElementById('cl').onclick=()=>{L=[];draw()};
draw();</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
</body></html>
