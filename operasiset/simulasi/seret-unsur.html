<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Seret Unsur · Bab 4</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0A0F1E;--sf:#121A2E;--sf2:#18223A;--sf3:#0E1527;--bd:#24304A;--bd2:#33405E;--tx:#E9EEF8;--mu:#A3AECB;--c1:#FB923C;--c2:#34D399;--c3:#A78BFA;--ok:#3DDC84;--bad:#FF6B7A;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:11px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:#2a1203}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tok{cursor:grab}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;line-height:1.45;font-size:14.5px}
.info .q{font-weight:700}
.info .q b{color:var(--c1)}
.cnt{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.cnt span{background:var(--sf2);border:1px solid var(--bd2);border-radius:10px;padding:4px 9px;font-weight:700;font-size:14px;white-space:nowrap}
.cnt span b{color:var(--c2)}
.msg{margin-top:6px;font-weight:700;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}.msg.tip{color:var(--mu);font-weight:400;font-size:13.5px}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{background:var(--c1);border:0;color:#2a1203;border-radius:13px;padding:12px 4px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:18px}.ctrl{grid-area:c;align-self:end;grid-template-columns:1fr}
 .cnt span{font-size:16px;padding:6px 11px}
}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.modes button{padding:8px 4px;font-size:14px}.big{padding:9px 4px}.info{padding:8px 11px;font-size:13.5px}}
@media(max-width:420px){.modes button{font-size:14px}.cnt span{font-size:13px;padding:3px 7px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#A78BFA;color:#1d1240;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #a78bfa44">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Mod">
   <button data-m="2" class="on" role="tab">Dua Set</button>
   <button data-m="3" role="tab">Tiga Set</button>
  </div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 340 340" aria-label="Gambar rajah Venn dan unsur untuk diseret"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl">
  <button class="big" id="baru">Soalan baharu</button>
  <button class="big alt" id="ulang">Ulang</button>
  <button class="big alt" id="jwp">Tunjuk jawapan</button>
 </div>
</div>
<script>
'use strict';
const LAY={L2:{w:340,h:230,c:[[128,118,80],[212,118,80]],lab:[[58,40],[282,40]]},L3:{w:340,h:286,c:[[128,110,82],[212,110,82],[170,183,82]],lab:[[60,32],[280,32],[272,262]]}};
const SC=['#38BDF8','#F472B6','#FBBF24'],TR=12,TRH=104;   // jejari token, tinggi dulang
const atomAt=(C,x,y)=>C.reduce((m,[cx,cy,r],k)=>m|((x-cx)**2+(y-cy)**2<r*r?1<<k:0),0);
const SL={};
function slots(K,a){const key=K+a;if(SL[key])return SL[key];const L=LAY[K],x1=L.w-12,y1=L.h-12,av=L.lab.concat([[26,30]]),pts=[];
 for(let y=15;y<y1;y+=3)for(let x=15;x<x1;x+=3){if(atomAt(L.c,x,y)!==a)continue;const cl=Math.min(...L.c.map(([cx,cy,r])=>Math.abs(Math.hypot(x-cx,y-cy)-r)),x-12,x1-x,y-12,y1-y);if(cl>=TR+5&&av.every(p=>Math.hypot(x-p[0],y-p[1])>TR+16))pts.push([cl,x,y])}
 pts.sort((p,q)=>q[0]-p[0]);const o=[];for(const[,x,y]of pts)if(o.every(([u,v])=>Math.hypot(x-u,y-v)>=2*TR+5))o.push([x,y]);return(SL[key]=o)}
const isP=x=>{if(x<2)return false;for(let d=2;d*d<=x;d++)if(x%d===0)return false;return true};
const PRED=[['nombor genap',x=>x%2===0],['nombor ganjil',x=>x%2===1],['gandaan 3',x=>x%3===0],['gandaan 4',x=>x%4===0],['gandaan 5',x=>x%5===0],['nombor perdana',isP],['faktor bagi 12',x=>12%x===0],['faktor bagi 18',x=>18%x===0],['faktor bagi 24',x=>24%x===0],['faktor bagi 30',x=>30%x===0],['nombor kuasa dua sempurna',x=>Number.isInteger(Math.sqrt(x))]];
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const S={n:2,K:'L2',U:[],sets:[],tok:[],sel:null,done:false,msg:'',mc:'tip'};
const svg=document.getElementById('svg'),info=document.getElementById('info');
const snd=n=>{if(window.FX)FX.play(n)};
const txt=(x,y,t,c,s=17,w=800)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="${w}" text-anchor="middle" dominant-baseline="central" font-family="Inter,Arial,sans-serif" pointer-events="none">${t}</text>`;
const NM='ABC';
function soalan(){
 for(let t=0;t<500;t++){
  const lo=1+rnd(6),U=[];for(let x=lo;x<lo+12;x++)U.push(x);
  const pr=shuf(PRED).slice(0,S.n);if(pr.some(p=>p[0]==='nombor genap')&&pr.some(p=>p[0]==='nombor ganjil'))continue;
  const sets=pr.map(([d,f])=>({d,v:U.filter(f)}));if(sets.some(s=>s.v.length<2||s.v.length>9))continue;
  const at=U.map(v=>sets.reduce((m,s,k)=>m|(s.v.includes(v)?1<<k:0),0)),cnt={};at.forEach(a=>cnt[a]=(cnt[a]||0)+1);
  if(Object.keys(cnt).some(a=>cnt[a]>slots(S.K,+a).length))continue;
  if(S.n===2&&!cnt[3])continue;
  if(S.n===3&&!(cnt[3]||cnt[5]||cnt[6]||cnt[7]))continue;
  S.U=U;S.sets=sets;S.tok=shuf(U).map(v=>({v,a:at[U.indexOf(v)],p:null,x:0,y:0}));S.sel=null;S.done=false;S.msg='Seret setiap nombor ke rantau yang betul, atau ketik nombor kemudian ketik rantau.';S.mc='tip';layoutTray();render();return}
}
const VH=()=>LAY[S.K].h;
function layoutTray(){const free=S.tok.filter(t=>t.p===null),per=Math.min(8,Math.max(6,Math.ceil(free.length/2))),gap=(340-24)/per;
 free.forEach((t,i)=>{const row=Math.floor(i/per),col=i%per;t.x=12+gap*(col+.5);t.y=VH()+30+row*40})}
function used(a){return S.tok.filter(t=>t.p!==null&&t.a===a).map(t=>t.p)}
function place(t,x,y){const L=LAY[S.K];
 if(x<12||x>L.w-12||y<12||y>L.h-12){t.p=null;S.msg='Letakkan nombor di dalam segi empat ξ.';S.mc='tip';layoutTray();return}
 const a=atomAt(L.c,x,y);
 if(a===t.a){const sl=slots(S.K,a),u=used(a);let best=-1,bd=1e9;sl.forEach((p,i)=>{if(u.includes(i))return;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=i}});
  t.p=best;t.x=sl[best][0];t.y=sl[best][1];snd('betul');S.msg=`✓ ${t.v} diletakkan dengan betul.`;S.mc='ok';
  if(window.FX)FX.stars(stagePt(t.x,t.y),6);
  if(S.tok.every(q=>q.p!==null)){S.done=true;S.msg='Hebat! Semua unsur berada di tempat yang betul.';snd('menang');if(window.FX)FX.celebrate&&FX.celebrate()}}
 else{t.p=null;snd('salah');S.msg='✗ '+sebab(t.v,a);S.mc='no'}
 layoutTray()}
function sebab(v,a){for(let k=0;k<S.n;k++){const ins=S.sets[k].v.includes(v),dr=!!(a>>k&1);
  if(ins&&!dr)return `${v} ialah ${S.sets[k].d}, jadi mesti berada di dalam ${NM[k]}.`;
  if(!ins&&dr)return `${v} bukan ${S.sets[k].d}, jadi mesti berada di luar ${NM[k]}.`}return 'Cuba lagi.'}
function stagePt(x,y){const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,s=Math.min(r.width/vb.width,r.height/vb.height),ox=r.left+(r.width-vb.width*s)/2,oy=r.top+(r.height-vb.height*s)/2;return{x:ox+x*s,y:oy+y*s}}
function n(f){return S.tok.filter(t=>t.p!==null&&f(t.a)).length}
function render(){
 const L=LAY[S.K],H=L.h+TRH;svg.setAttribute('viewBox',`0 0 340 ${H}`);
 let g=`<rect x="12" y="12" width="${L.w-24}" height="${L.h-24}" rx="8" fill="#121A2E" stroke="#A3AECB" stroke-width="2.5"/>`;
 L.c.forEach(([cx,cy,r],k)=>g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SC[k]}" fill-opacity=".06" stroke="${SC[k]}" stroke-width="3.5"/>`);
 L.lab.forEach(([x,y],k)=>g+=txt(x,y,NM[k],SC[k],22,900));g+=txt(26,30,'ξ','#A3AECB',21,900);
 g+=`<rect x="8" y="${L.h+4}" width="324" height="${TRH-8}" rx="12" fill="#18223A" stroke="#33405E" stroke-width="1.5" stroke-dasharray="6 5"/>`;
 if(!S.tok.some(t=>t.p===null))g+=txt(170,L.h+TRH/2,'Dulang kosong','#7884A3',15,700);
 S.tok.forEach((t,i)=>{const on=S.sel===i,pl=t.p!==null;
  g+=`<g class="tok" data-i="${i}" transform="translate(${t.x.toFixed(1)} ${t.y.toFixed(1)})"><circle r="${TR+7}" fill="transparent"/><circle r="${TR}" fill="${pl?'#1E3A2F':'#2A2F4A'}" stroke="${on?'#FFFFFF':pl?'#34D399':'#FB923C'}" stroke-width="${on?3.5:2.5}"/>${txt(0,0,t.v,'#E9EEF8',t.v>9?13:15,800)}</g>`});
 svg.innerHTML=g;
 const nm=NM.slice(0,S.n).split(''),list=S.sets.map((s,k)=>`${nm[k]} = {<i>x</i> : <i>x</i> ialah <b>${s.d}</b>}`).join(', ');
 let c=nm.map((x,k)=>`<span><i>n</i>(${x}) = <b>${n(a=>a>>k&1)}</b></span>`).join('');
 if(S.n===2)c+=`<span><i>n</i>(A ∩ B) = <b>${n(a=>a===3)}</b></span><span><i>n</i>(A ∪ B) = <b>${n(a=>a>0)}</b></span><span><i>n</i>((A ∪ B)′) = <b>${n(a=>a===0)}</b></span>`;
 else c+=`<span><i>n</i>(A ∩ B ∩ C) = <b>${n(a=>a===7)}</b></span><span><i>n</i>(A ∪ B ∪ C) = <b>${n(a=>a>0)}</b></span>`;
 c+=`<span>Diletak: <b>${S.tok.filter(t=>t.p!==null).length}/${S.tok.length}</b></span>`;
 let extra='';
 if(S.done&&S.n===2){const a=n(x=>x&1),b=n(x=>x&2),ab=n(x=>x===3);extra=`<div class="msg ok">Semak rumus: <i>n</i>(A ∪ B) = ${a} + ${b} − ${ab} = ${a+b-ab} ✓</div>`}
 info.innerHTML=`<div class="q">ξ = {<i>x</i> : <i>x</i> ialah integer, ${S.U[0]} ≤ <i>x</i> ≤ ${S.U[S.U.length-1]}}, ${list}</div><div class="cnt">${c}</div><div class="msg ${S.mc}">${S.msg}</div>${extra}`}
/* ---------- seret / ketik ---------- */
let drag=null;
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.tok');const p=pt(e);
 if(!g){if(S.sel!==null){const t=S.tok[S.sel];S.sel=null;if(p.y<VH()){place(t,p.x,p.y);render()}}return}
 e.preventDefault();const i=+g.dataset.i,t=S.tok[i];drag={i,dx:p.x-t.x,dy:p.y-t.y,sx:p.x,sy:p.y,moved:false,prev:t.p};
 S.tok.push(S.tok.splice(i,1)[0]);if(S.sel!==null)S.sel=null;drag.i=S.tok.length-1;render();svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=pt(e),t=S.tok[drag.i];if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>6)drag.moved=true;
 t.x=Math.max(TR,Math.min(340-TR,p.x-drag.dx));t.y=Math.max(TR,Math.min(VH()+TRH-TR,p.y-drag.dy));
 const el=svg.querySelector(`.tok[data-i="${drag.i}"]`);if(el)el.setAttribute('transform',`translate(${t.x.toFixed(1)} ${t.y.toFixed(1)})`)});
function endDrag(){if(!drag)return;const t=S.tok[drag.i];
 if(!drag.moved){S.sel=drag.i;snd('ketik');S.msg=`Ketik rantau untuk meletakkan ${t.v}.`;S.mc='tip';if(t.p!==null){const sl=slots(S.K,t.a)[t.p];t.x=sl[0];t.y=sl[1]}else layoutTray()}
 else if(t.y>VH()){t.p=null;layoutTray()}else place(t,t.x,t.y);
 drag=null;render()}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('dragstart',e=>e.preventDefault());
document.getElementById('baru').onclick=()=>{snd('langkah');soalan()};
document.getElementById('ulang').onclick=()=>{S.tok.forEach(t=>t.p=null);S.sel=null;S.done=false;S.msg='Mula semula: seret setiap nombor ke rantau yang betul.';S.mc='tip';layoutTray();snd('ketik');render()};
document.getElementById('jwp').onclick=()=>{const u={};S.tok.forEach(t=>{const sl=slots(S.K,t.a),k=u[t.a]||0;u[t.a]=k+1;t.p=k;t.x=sl[k][0];t.y=sl[k][1]});S.sel=null;S.done=true;S.msg='Inilah kedudukan semua unsur.';S.mc='tip';snd('langkah');layoutTray();render()};
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));S.n=+b.dataset.m;S.K=S.n===2?'L2':'L3';snd('ketik');soalan()});
window.addEventListener('resize',()=>render());
soalan();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
