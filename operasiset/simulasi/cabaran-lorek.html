<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cabaran Lorek · Bab 4</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0A0F1E;--sf:#121A2E;--sf2:#18223A;--sf3:#0E1527;--bd:#24304A;--bd2:#33405E;--tx:#E9EEF8;--mu:#A3AECB;--c1:#A78BFA;--c2:#34D399;--gold:#FBBF24;--ok:#3DDC84;--bad:#FF6B7A;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:11px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:#1d1240}
.lv{display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.lv button{border:0;background:none;color:var(--mu);font-weight:800;font-size:14px;padding:8px 10px;border-radius:11px}
.lv button.on{background:var(--sf2);color:var(--tx);box-shadow:inset 0 0 0 2px var(--c2)}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.atom{cursor:pointer}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:11px 14px;line-height:1.45;font-size:15px}
.info .q{font-size:16px}
.info .q b{font-size:23px;color:var(--c1);letter-spacing:.02em}
.info .tip{color:var(--mu);font-size:13.5px;margin-top:4px}
.info .ok{color:var(--ok);font-weight:800}.info .no{color:var(--bad);font-weight:800}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:12px 4px;font-weight:800;font-size:16px}
.chip.ok{border-color:var(--ok);background:#3ddc8422}.chip.no{border-color:var(--bad);background:#ff6b7a22}
.big{background:var(--c1);border:0;color:#1d1240;border-radius:13px;padding:13px 6px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
.big:disabled{opacity:.45;cursor:not-allowed}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:18px}.ctrl{grid-area:c;align-self:end}
 .info .q b{font-size:30px}.chip{font-size:18px;padding:15px 4px}
}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.modes button{padding:8px 4px;font-size:14px}.chip{padding:9px 3px;font-size:14px}.info{padding:8px 11px;font-size:14px}.big{padding:10px 4px}}
@media(max-width:420px){.modes button{font-size:14px;padding:10px 3px}.lv button{padding:8px 7px;font-size:13px}.chip{font-size:15px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#A78BFA;color:#1d1240;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #a78bfa44">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Mod">
   <button data-m="lorek" class="on" role="tab">Lorek</button>
   <button data-m="namakan" role="tab">Namakan</button>
  </div>
  <div class="lv" role="group" aria-label="Aras"><button data-l="2" class="on">2 set</button><button data-l="3">3 set</button></div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 340 230" aria-label="Gambar rajah Venn"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl"></div>
</div>
<script>
'use strict';
const LAY={L2:{w:340,h:230,c:[[128,118,80],[212,118,80]],lab:[[58,40],[282,40]]},L2s:{w:340,h:230,c:[[160,118,95],[188,128,46]],lab:[[70,40],[188,70]]},L2d:{w:340,h:230,c:[[96,118,64],[244,118,64]],lab:[[40,50],[300,50]]},
 L3:{w:340,h:286,c:[[128,110,82],[212,110,82],[170,183,82]],lab:[[60,32],[280,32],[272,262]]},L3r:{w:340,h:230,c:[[88,118,62],[170,118,62],[252,118,62]],lab:[[40,56],[170,40],[300,56]]}};
const SC=['#38BDF8','#F472B6','#FBBF24'],SHADE='#34D399';
const r1=v=>Math.round(v*10)/10;
const atomAt=(C,x,y)=>C.reduce((m,[cx,cy,r],k)=>m|((x-cx)**2+(y-cy)**2<r*r?1<<k:0),0);
function vpath(L,mask){
 const C=L.c,V=[],cuts=C.map(()=>[]);
 for(let i=0;i<C.length;i++)for(let j=i+1;j<C.length;j++){const[x1,y1,ra]=C[i],[x2,y2,rb]=C[j],d=Math.hypot(x2-x1,y2-y1);if(d>=ra+rb||d<=Math.abs(ra-rb))continue;
  const a=(ra*ra-rb*rb+d*d)/(2*d),h=Math.sqrt(ra*ra-a*a),mx=x1+a*(x2-x1)/d,my=y1+a*(y2-y1)/d;
  for(const sg of[1,-1]){const p=[mx+sg*h*(y2-y1)/d,my-sg*h*(x2-x1)/d];V.push(p);const k=V.length-1;cuts[i].push([Math.atan2(p[1]-y1,p[0]-x1),k]);cuts[j].push([Math.atan2(p[1]-y2,p[0]-x2),k])}}
 const inR=a=>mask>>a&1,others=(i,x,y)=>C.reduce((m,[cx,cy,r],k)=>m|(k!==i&&(x-cx)**2+(y-cy)**2<r*r?1<<k:0),0);
 const E=[];let d='';
 C.forEach(([cx,cy,r],i)=>{const cu=cuts[i].sort((p,q)=>p[0]-q[0]);
  if(!cu.length){const m=others(i,cx+r,cy);if(inR(m|1<<i)!==inR(m))d+=`M${cx+r} ${cy}A${r} ${r} 0 1 1 ${cx-r} ${cy}A${r} ${r} 0 1 1 ${cx+r} ${cy}Z`;return}
  cu.forEach(([t0,a],k)=>{let[t1,b]=cu[(k+1)%cu.length];if(k+1===cu.length)t1+=2*Math.PI;const tm=(t0+t1)/2,m=others(i,cx+r*Math.cos(tm),cy+r*Math.sin(tm));if(inR(m|1<<i)!==inR(m))E.push({i,a,b,big:t1-t0>Math.PI?1:0})})});
 const used=E.map(()=>false);
 E.forEach((e0,s0)=>{if(used[s0])return;const st=e0.a;let cur=st,e=s0;d+=`M${r1(V[st][0])} ${r1(V[st][1])}`;
  for(let g=0;g<40;g++){used[e]=true;const Q=E[e],f=Q.a===cur,nx=f?Q.b:Q.a,r=C[Q.i][2];d+=`A${r} ${r} 0 ${Q.big} ${f?1:0} ${r1(V[nx][0])} ${r1(V[nx][1])}`;cur=nx;if(cur===st)break;e=E.findIndex((q,k)=>!used[k]&&(q.a===cur||q.b===cur));if(e<0)break}d+='Z'});
 if(inR(0))d+=`M12 12H${L.w-12}V${L.h-12}H12Z`;
 return d}
// atom yang wujud dalam susun atur (sampel grid)
const EX={};function exist(K){if(EX[K])return EX[K];const L=LAY[K];let m=0;for(let y=14;y<L.h-12;y+=4)for(let x=14;x<L.w-12;x+=4)m|=1<<atomAt(L.c,x,y);return(EX[K]=m)}
function parse(s){const t=[...s].filter(c=>c!==' ');let i=0;
 const un=()=>{const c=t[i++];let x;if(c==='('){x=ex();i++}else x={k:'s',v:c};while(t[i]==='′'){i++;x={k:'n',a:x}}return x};
 const ex=()=>{let x=un();while(t[i]==='∩'||t[i]==='∪'){const o=t[i++];x={k:o==='∩'?'i':'u',a:x,b:un()}}return x};return ex()}
function ev(t,o){return t.k==='s'?o.s(t.v):t.k==='n'?o.n(ev(t.a,o)):(t.k==='i'?o.i:o.u)(ev(t.a,o),ev(t.b,o))}
function maskOf(e,n){const full=(1<<(1<<n))-1,set=k=>{let m=0;for(let a=0;a<1<<n;a++)if(a>>k&1)m|=1<<a;return m};return ev(parse(e),{s:v=>set('ABC'.indexOf(v)),n:x=>full&~x,i:(x,y)=>x&y,u:(x,y)=>x|y})}
const swapOp=e=>e.replace(/[∩∪]/g,c=>c==='∩'?'∪':'∩');
/* ================= soalan ================= */
const POOL={2:['A ∩ B','A ∪ B','A′','B′','(A ∩ B)′','(A ∪ B)′','A ∩ B′','A′ ∩ B','A′ ∪ B','A ∪ B′','A′ ∩ B′','A′ ∪ B′','(A ∩ B′) ∪ (A′ ∩ B)'],
 3:['A ∩ B ∩ C','A ∪ B ∪ C','(A ∩ B) ∪ C','A ∩ (B ∪ C)','(A ∪ B) ∩ C','A ∪ (B ∩ C)','(A ∪ B)′ ∩ C','A′ ∩ (B ∪ C)','(A ∩ B)′ ∩ C','(A ∪ B) ∩ C′','(A ∩ C) ∪ B','(A ∪ B ∪ C)′','A ∩ B ∩ C′','(A ∩ B) ∪ (B ∩ C)']};
const S={m:'lorek',lv:2,K:'L2',e:'',tgt:0,sel:0,done:false,opts:[],score:0,tot:0,streak:0,last:''};
const svg=document.getElementById('svg'),info=document.getElementById('info'),ctrl=document.getElementById('ctrl');
const snd=n=>{if(window.FX)FX.play(n)};
const rnd=n=>Math.floor(Math.random()*n),shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const txt=(x,y,t,c,s=21,w=900)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="${w}" text-anchor="middle" dominant-baseline="central" font-family="Inter,Arial,sans-serif" pointer-events="none">${t}</text>`;
function newQ(){
 const n=S.lv;S.K=n===2?(Math.random()<.75?'L2':Math.random()<.5?'L2s':'L2d'):(Math.random()<.8?'L3':'L3r');
 if(S.m==='namakan')S.K=n===2?'L2':'L3';
 const ex=exist(S.K);let e,m,tries=0;
 do{e=POOL[n][rnd(POOL[n].length)];m=maskOf(e,n)&ex;tries++}while((e===S.last||m===0||m===ex)&&tries<50);
 S.e=e;S.last=e;S.tgt=m;S.sel=0;S.done=false;
 if(S.m==='namakan'){const seen=new Set([m]),w=[];for(const x of shuf(POOL[n]).concat(shuf(POOL[n]).map(swapOp))){const mx=maskOf(x,n)&ex;if(!seen.has(mx)&&x!==e){seen.add(mx);w.push(x)}if(w.length===3)break}S.opts=shuf([e,...w])}
 setCtrl();render()}
function render(){
 const L=LAY[S.K],n=S.lv,ex=exist(S.K);svg.setAttribute('viewBox',`0 0 ${L.w} ${L.h}`);
 let g=`<rect x="12" y="12" width="${L.w-24}" height="${L.h-24}" rx="8" fill="#121A2E" stroke="#A3AECB" stroke-width="2.5"/>`;
 const show=S.m==='namakan'?S.tgt:S.sel;
 if(show)g+=`<path d="${vpath(L,show)}" fill-rule="evenodd" fill="${SHADE}" fill-opacity=".5"/>`;
 if(S.m==='lorek'&&S.done){const miss=S.tgt&~S.sel,extra=S.sel&~S.tgt;
  if(miss)g+=`<path d="${vpath(L,miss)}" fill-rule="evenodd" fill="#FBBF24" fill-opacity=".35" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 6"/>`;
  if(extra)g+=`<path d="${vpath(L,extra)}" fill-rule="evenodd" fill="#FF6B7A" fill-opacity=".45" stroke="#FF6B7A" stroke-width="3" stroke-dasharray="8 6"/>`}
 if(S.m==='lorek'&&!S.done)for(let a=0;a<1<<n;a++)if(ex>>a&1)g+=`<path class="atom" data-a="${a}" d="${vpath(L,1<<a)}" fill-rule="evenodd" fill="#fff" fill-opacity="0"/>`;
 L.c.forEach(([cx,cy,r],k)=>g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${SC[k]}" stroke-width="3.5" pointer-events="none"/>`);
 L.lab.forEach(([x,y],k)=>g+=txt(x,y,'ABC'[k],SC[k]));g+=txt(26,30,'ξ','#A3AECB');
 svg.innerHTML=g;
 const sc=`<div class="tip">Skor: <b style="color:#E9EEF8">${S.score}/${S.tot}</b>${S.streak>=3?' · 🔥 '+S.streak+' berturut-turut':''}</div>`;
 let h='';
 if(S.m==='lorek'){
  h=`<div class="q">Lorek rantau <b>${S.e}</b></div>`;
  if(!S.done)h+=`<div class="tip">Ketik rantau dalam rajah untuk melorek atau memadam lorekan, kemudian tekan <b>Semak</b>.${S.K==='L2s'?' (B ialah subset bagi A.)':S.K==='L2d'?' (A ∩ B = ∅.)':S.K==='L3r'?' (A ∩ C = ∅.)':''}</div>`;
  else{const ok=S.sel===S.tgt;h+=ok?`<div class="ok">✓ Betul! Lorekan anda tepat.</div>`:`<div class="no">✗ Belum tepat.</div><div class="tip"><b style="color:#FBBF24">Kuning</b>: rantau yang tertinggal · <b style="color:#FF6B7A">Merah</b>: rantau yang tidak sepatutnya dilorek.</div>`}
 }else{h=`<div class="q">Rantau berlorek mewakili set…</div>`;if(S.done)h+=S.pick===S.e?`<div class="ok">✓ Betul: ${S.e}</div>`:`<div class="no">✗ Jawapan: ${S.e}</div>`;else h+=`<div class="tip">Pilih ungkapan yang sepadan dengan rantau berlorek.</div>`}
 info.innerHTML=h+sc}
function setCtrl(){
 if(S.m==='lorek'){ctrl.innerHTML=`<button class="big" id="semak"${S.done?' disabled':''}>Semak</button><button class="big alt" id="padam"${S.done?' disabled':''}>Padam lorekan</button><button class="big alt" id="next" style="grid-column:1/-1">${S.done?'Soalan seterusnya ▶':'Langkau'}</button>`;
  document.getElementById('semak').onclick=()=>{if(S.done)return;S.done=true;S.tot++;const ok=S.sel===S.tgt;if(ok){S.score++;S.streak++;snd('betul');if(window.FX)FX.stars(document.getElementById('stage'),12)}else{S.streak=0;snd('salah')}setCtrl();render()};
  document.getElementById('padam').onclick=()=>{S.sel=0;snd('ketik');render()};
  document.getElementById('next').onclick=()=>{snd('langkah');newQ()}}
 else{ctrl.innerHTML=S.opts.map((o,i)=>`<button class="chip${S.done?(o===S.e?' ok':o===S.pick?' no':''):''}" data-o="${i}"${S.done?' disabled':''}>${o}</button>`).join('')+(S.done?`<button class="big" id="next" style="grid-column:1/-1">Soalan seterusnya ▶</button>`:'');
  ctrl.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(S.done)return;S.done=true;S.tot++;S.pick=S.opts[+b.dataset.o];if(S.pick===S.e){S.score++;S.streak++;snd('betul');if(window.FX)FX.stars(b,10)}else{S.streak=0;snd('salah')}setCtrl();render()});
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{snd('langkah');newQ()}}}
svg.addEventListener('click',e=>{if(S.m!=='lorek'||S.done)return;const p=e.target.closest('.atom');if(!p)return;S.sel^=1<<+p.dataset.a;snd('ketik');render()});
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));S.m=b.dataset.m;snd('ketik');newQ()});
document.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lv button').forEach(x=>x.classList.toggle('on',x===b));S.lv=+b.dataset.l;snd('ketik');newQ()});
newQ();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
