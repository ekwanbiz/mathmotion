<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ogif &amp; Kuartil · Bab 7</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--sf:#131C2E;--sf2:#18233A;--sf3:#0E1626;--bd:#22304A;--bd2:#2C3D5C;--tx:#E6EDF7;--mu:#94A3B8;--c1:#F472B6;--c2:#FBBF24;--gold:#FBBF24;--ok:#34D399;--bad:#F87171;
 --surface:#131C2E;--border:#2C3D5C;--text:#E6EDF7;--muted:#94A3B8;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:center}
.top h1{flex:1;margin:0;font-size:19px;font-weight:900;color:var(--c1);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:11px 14px}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-height:74px;line-height:1.5;font-size:15px}
.info b.t{display:block;font-size:18px;color:var(--c1);margin-bottom:2px}
.info .tip{color:var(--mu);font-size:13px;margin-top:4px}
.info .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700}
.info .row span b{color:var(--c2)}
.info .row span b.g{color:var(--gold)}
.info .row span b.o{color:var(--c1)}
.info .eq{margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:700}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:11px 4px;font-weight:800;font-size:15px}
.chip.on{background:var(--c1);border-color:var(--c1);color:#08121f}
.big{background:var(--c2);border:0;color:#08121f;border-radius:13px;padding:12px 6px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:18px}.ctrl{grid-area:c;align-self:end;grid-template-columns:1fr 1fr}
 .info b.t{font-size:22px}.info .eq{font-size:17px}
}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.chip{padding:8px 3px;font-size:14px}.info{padding:8px 11px;min-height:62px;font-size:14px}.info b.t{font-size:16px}.big{padding:9px 4px}.top h1{font-size:16px;padding:8px 12px}}
@media(max-width:420px){.chip,.big{font-size:13.5px}.info{font-size:14px}.top h1{font-size:16px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#F472B6;color:#08121f;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top"><h1>📈 Ogif: Kuartil &amp; Persentil</h1><span id="sndslot" style="display:flex"></span></div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 420 330" aria-label="Ogif dengan garis panduan"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl">
  <button class="chip" data-p="25">Q₁</button>
  <button class="chip" data-p="50">Median</button>
  <button class="chip" data-p="75">Q₃</button>
  <button class="chip" data-p="90">P₉₀</button>
  <button class="chip" id="bJ">Tunjuk JAK</button>
  <button class="big" id="bR">Data rawak</button>
 </div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),info=document.getElementById('info');
const TR='#38BDF8',PK='#F472B6',AM='#FBBF24',GR='#34D399',MU='#94A3B8',TX='#E6EDF7',GRID='#1E2A40',BGS='#0E1626';
const LOW=[10,20,30,40,50],W=10,K=5;
const F0=[2,8,14,10,6];
let S={f:F0.slice(),k:10,jak:false};
const X0=50,X1=404,Y0=280,Y1=26;
const xa=LOW[0]-0.5,xb=LOW[K-1]+W-0.5;
const r1=v=>Math.round(v*10)/10;
const fm=v=>{const x=Math.round(v*10)/10;return String(Object.is(x,-0)?0:x)};
const snd=n=>{if(window.FX)FX.play(n)};
const N=()=>S.f.reduce((a,b)=>a+b,0);
const cum=()=>S.f.map((_,i)=>S.f.slice(0,i+1).reduce((a,b)=>a+b,0));
const gx=v=>X0+(v-xa)/(xb-xa)*(X1-X0),gy=v=>Y0-v/N()*(Y0-Y1);
function T(x,y,t,c=TX,s=14,a='middle'){return `<text x="${r1(x)}" y="${r1(y)}" fill="${c}" font-size="${s}" font-weight="800" text-anchor="${a}" dominant-baseline="middle" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="${BGS}" stroke-width="4" stroke-linejoin="round">${t}</text>`}
const pts=()=>[[xa,0]].concat(cum().map((c,i)=>[LOW[i]+W-0.5,c]));
// nilai x pada ogif bagi kekerapan longgokan k (interpolasi linear)
function xAt(k){const P=pts();for(let i=1;i<P.length;i++){const [x0,c0]=P[i-1],[x1,c1]=P[i];if(k<=c1&&c1>c0&&k>=c0)return x0+(k-c0)/(c1-c0)*(x1-x0)}return P[P.length-1][0]}
const L=(x1,y1,x2,y2,c,w,d)=>`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:''}/>`;
function draw(){
 const n=N(),C=cum(),step=n<=24?2:n<=48?4:8;
 let g='';
 for(let v=0;v<=n;v+=step)g+=L(X0,gy(v),X1,gy(v),GRID,1.3)+T(X0-8,gy(v),v,MU,12,'end');
 [xa].concat(C.map((_,i)=>LOW[i]+W-0.5)).forEach(b=>{g+=L(gx(b),Y1,gx(b),Y0,GRID,1)+T(gx(b),Y0+16,fm(b),MU,12)});
 g+=L(X0,Y0,X1,Y0,MU,2.5)+L(X0,Y0,X0,Y1-8,MU,2.5);
 g+=T(X0+4,Y1-14,'Kekerapan longgokan',MU,12,'start')+T(X1,Y0+36,'Markah (sempadan atas)',MU,12,'end');
 if(S.jak){const a=xAt(n/4),b=xAt(3*n/4);
  g+=`<rect x="${r1(gx(a))}" y="${Y1}" width="${r1(gx(b)-gx(a))}" height="${Y0-Y1}" fill="${GR}22"/>`;
  [[n/4,a,'Q₁'],[3*n/4,b,'Q₃']].forEach(([k,x,t])=>{g+=L(X0,gy(k),gx(x),gy(k),GR,2,'6 5')+L(gx(x),gy(k),gx(x),Y0,GR,2,'6 5')+T(gx(x),Y0-12,t,GR,13)});
 }
 const P=pts();
 g+=`<path d="M${P.map(p=>r1(gx(p[0]))+' '+r1(gy(p[1]))).join(' L')}" fill="none" stroke="${PK}" stroke-width="3.5" stroke-linejoin="round"/>`;
 P.forEach(p=>g+=`<circle cx="${r1(gx(p[0]))}" cy="${r1(gy(p[1]))}" r="4.5" fill="${PK}"/>`);
 // garis panduan boleh seret
 const x=xAt(S.k),yk=gy(S.k);
 g+=L(X0,yk,gx(x),yk,AM,2.5,'7 5')+L(gx(x),yk,gx(x),Y0,AM,2.5,'7 5');
 g+=`<circle cx="${r1(gx(x))}" cy="${r1(yk)}" r="6" fill="${AM}" stroke="${BGS}" stroke-width="2"/>`;
 g+=T(gx(x)+(gx(x)>X1-60?-8:8),yk-14,fm(x),AM,14,gx(x)>X1-60?'end':'start');
 g+=`<g class="h" style="cursor:ns-resize"><rect x="${X0-46}" y="${r1(yk-22)}" width="${r1(gx(x)-X0+60)}" height="44" fill="transparent"/><circle cx="${X0}" cy="${r1(yk)}" r="12" fill="${AM}" stroke="#fff" stroke-width="3"/></g>`;
 svg.innerHTML=g;
 const p=Math.round(S.k/n*1000)/10;
 let h=`<b class="t">Seret bulatan <span style="color:#FBBF24">●</span> pada paksi mencancang</b>`;
 h+=`<div class="row"><span>Kekerapan longgokan = <b class="g">${S.k}</b></span><span>${p}% daripada ${n} murid</span></div>`;
 h+=`<div class="eq">P<sub>${fm(p)}</sub> ≈ <b style="color:${AM}">${fm(x)}</b> markah → ${p}% murid mendapat kurang daripada ${fm(x)} markah</div>`;
 if(S.jak){const a=xAt(n/4),b=xAt(3*n/4);h+=`<div class="eq" style="border-color:${GR}">Q₁ (kedudukan ¼ × ${n} = ${fm(n/4)}) ≈ ${fm(a)}, Q₃ (kedudukan ¾ × ${n} = ${fm(3*n/4)}) ≈ ${fm(b)}<br>Julat antara kuartil = ${fm(b)} − ${fm(a)} = <b style="color:${GR}">${fm(b-a)}</b></div>`}
 else h+=`<div class="tip">Kedudukan persentil ke-k = k/100 × Σf. Lukis garis mengufuk ke ogif, kemudian garis mencancang ke paksi-x untuk membaca nilainya.</div>`;
 info.innerHTML=h;
}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.k=Math.round(+b.dataset.p/100*N()*10)/10;snd('ketik');draw()});
const bJ=document.getElementById('bJ');bJ.onclick=()=>{S.jak=!S.jak;bJ.classList.toggle('on',S.jak);snd('ketik');draw()};
document.getElementById('bR').onclick=()=>{do{S.f=S.f.map(()=>1+Math.floor(Math.random()*12))}while(N()<12);S.k=Math.round(N()/2);snd('langkah');draw()};
let drag=false;
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('pointerdown',e=>{const h=e.target.closest('.h');if(!h)return;e.preventDefault();drag=true;svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=svgPt(e),n=N();const k=Math.max(0,Math.min(n,Math.round((Y0-p.y)/(Y0-Y1)*n)));if(k!==S.k){S.k=k;snd('detik');draw()}});
const end=()=>{drag=false};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('dragstart',e=>e.preventDefault());
draw();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
