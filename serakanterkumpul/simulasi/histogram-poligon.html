<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Histogram &amp; Poligon · Bab 7</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--sf:#131C2E;--sf2:#18233A;--sf3:#0E1626;--bd:#22304A;--bd2:#2C3D5C;--tx:#E6EDF7;--mu:#94A3B8;--c1:#38BDF8;--c2:#F472B6;--gold:#FBBF24;--ok:#34D399;--bad:#F87171;
 --surface:#131C2E;--border:#2C3D5C;--text:#E6EDF7;--muted:#94A3B8;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:center}
.top h1{flex:1;margin:0;font-size:19px;font-weight:900;color:var(--c1);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:11px 14px}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-height:74px;line-height:1.5;font-size:15px}
.info b.t{display:block;font-size:18px;color:var(--c1);margin-bottom:2px}
.info .tip{color:var(--mu);font-size:13px;margin-top:4px}
.info .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700}
.info .row span b{color:var(--c2)}
.info .row span b.g{color:var(--gold)}
.info .row span b.o{color:var(--c1)}
.info .eq{margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:700}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:11px 4px;font-weight:800;font-size:15px}
.chip.on{background:var(--c1);border-color:var(--c1);color:#08121f}
.big{background:var(--c2);border:0;color:#08121f;border-radius:13px;padding:12px 6px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:18px}.ctrl{grid-area:c;align-self:end;grid-template-columns:1fr 1fr}
 .info b.t{font-size:22px}.info .eq{font-size:17px}
}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.chip{padding:8px 3px;font-size:14px}.info{padding:8px 11px;min-height:62px;font-size:14px}.info b.t{font-size:16px}.big{padding:9px 4px}.top h1{font-size:16px;padding:8px 12px}}
@media(max-width:420px){.chip,.big{font-size:13.5px}.info{font-size:14px}.top h1{font-size:16px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#38BDF8;color:#08121f;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top"><h1>📊 Histogram &amp; Poligon Kekerapan</h1><span id="sndslot" style="display:flex"></span></div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 420 330" aria-label="Histogram dan poligon kekerapan"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl">
  <button class="chip on" id="bH">Histogram</button>
  <button class="chip on" id="bP">Poligon</button>
  <button class="chip" id="bM">Titik tengah</button>
  <button class="big alt" id="bS">Set semula</button>
  <button class="big" id="bR" style="grid-column:span 2">Data rawak</button>
 </div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),info=document.getElementById('info');
const TR='#38BDF8',PK='#F472B6',AM='#FBBF24',GR='#34D399',MU='#94A3B8',TX='#E6EDF7',GRID='#1E2A40',BGS='#0E1626';
const LOW=[10,20,30,40,50],W=10,K=5,FMAX=16;
const F0=[3,8,14,10,5];
let S={f:F0.slice(),hist:true,poli:true,mid:false,sel:-1};
const X0=48,X1=406,Y0=278,Y1=22;
// domain x: -0.5 .. 69.5 (termasuk kelas sifar 0–9 dan 60–69)
const xa=-0.5,xb=69.5;
const gx=v=>X0+(v-xa)/(xb-xa)*(X1-X0),gy=v=>Y0-v/FMAX*(Y0-Y1);
const r1=v=>Math.round(v*10)/10;
const fm=v=>{const x=Math.round(v*100)/100;return String(Object.is(x,-0)?0:x)};
const snd=n=>{if(window.FX)FX.play(n)};
function T(x,y,t,c=TX,s=14,a='middle'){return `<text x="${r1(x)}" y="${r1(y)}" fill="${c}" font-size="${s}" font-weight="800" text-anchor="${a}" dominant-baseline="middle" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="${BGS}" stroke-width="4" stroke-linejoin="round">${t}</text>`}
const mid=i=>LOW[i]+(W-1)/2;
function draw(){
 let g='';
 for(let v=0;v<=FMAX;v+=2){g+=`<line x1="${X0}" y1="${r1(gy(v))}" x2="${X1}" y2="${r1(gy(v))}" stroke="${GRID}" stroke-width="1.3"/>`+T(X0-8,gy(v),v,MU,12,'end')}
 g+=`<line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="${MU}" stroke-width="2.5"/><line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y1-6}" stroke="${MU}" stroke-width="2.5"/>`;
 g+=T(X0+4,Y1-12,'Kekerapan',MU,12,'start');
 // label paksi-x
 if(S.mid){[-1,0,1,2,3,4,5].forEach(i=>{const m=i<0?LOW[0]-W+4.5:i>=K?LOW[K-1]+W+4.5:mid(i);g+=T(gx(m),Y0+16,fm(m),PK,12)})}
 else{for(let i=0;i<=K;i++){const b=LOW[0]-0.5+i*W;g+=T(gx(b),Y0+16,fm(b),MU,12)}}
 g+=T(X1,Y0+36,S.mid?'Titik tengah (markah)':'Sempadan kelas (markah)',MU,12,'end');
 // bar
 for(let i=0;i<K;i++){
  const xl=gx(LOW[i]-0.5),xr=gx(LOW[i]+W-0.5),yt=gy(S.f[i]),on=S.sel===i;
  if(S.hist)g+=`<rect x="${r1(xl)}" y="${r1(yt)}" width="${r1(xr-xl)}" height="${r1(Y0-yt)}" fill="${TR}${on?'88':'55'}" stroke="${TR}" stroke-width="2.5"/>`;
  else g+=`<rect x="${r1(xl)}" y="${r1(yt)}" width="${r1(xr-xl)}" height="${r1(Y0-yt)}" fill="none" stroke="${TR}33" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  g+=T((xl+xr)/2,yt-14,S.f[i],on?AM:TX,15);
 }
 if(S.poli){
  const pts=[[LOW[0]-W+4.5,0]].concat(S.f.map((f,i)=>[mid(i),f])).concat([[LOW[K-1]+W+4.5,0]]);
  g+=`<path d="M${pts.map(p=>r1(gx(p[0]))+' '+r1(gy(p[1]))).join(' L')}" fill="none" stroke="${PK}" stroke-width="3.5" stroke-linejoin="round"/>`;
  pts.forEach(p=>g+=`<circle cx="${r1(gx(p[0]))}" cy="${r1(gy(p[1]))}" r="5" fill="${PK}" stroke="${BGS}" stroke-width="2"/>`);
 }
 // pemegang seret di atas setiap bar
 for(let i=0;i<K;i++){const cx=gx(mid(i)),cy=gy(S.f[i]);
  g+=`<g class="h" data-i="${i}" style="cursor:ns-resize"><rect x="${r1(gx(LOW[i]-0.5))}" y="${r1(cy-22)}" width="${r1(gx(W)-gx(0))}" height="44" fill="transparent"/><rect x="${r1(cx-15)}" y="${r1(cy-5)}" width="30" height="10" rx="5" fill="${AM}" stroke="#fff" stroke-width="2"/></g>`}
 svg.innerHTML=g;
 // info
 const n=S.f.reduce((a,b)=>a+b,0),sfx=S.f.reduce((a,f,i)=>a+f*mid(i),0),mx=Math.max(...S.f),mods=S.f.map((f,i)=>f===mx?`${LOW[i]} – ${LOW[i]+W-1}`:null).filter(Boolean);
 let h=`<b class="t">Seret pemegang <span style="color:#FBBF24">▬</span> untuk ubah kekerapan</b>`;
 h+=`<div class="row"><span>Σf = <b>${n}</b></span><span>Kelas mod = <b class="o">${mods.length>2?'tiada satu kelas':mods.join(', ')}</b></span>${n?`<span>Min ≈ <b class="g">${fm(sfx/n)}</b></span>`:''}</div>`;
 if(S.sel>=0){const i=S.sel;h+=`<div class="eq">Kelas ${LOW[i]} – ${LOW[i]+W-1}: sempadan ${fm(LOW[i]-0.5)} – ${fm(LOW[i]+W-0.5)}, titik tengah ${fm(mid(i))}, kekerapan ${S.f[i]}</div>`}
 h+=`<div class="tip">Histogram: lebar bar = saiz selang kelas (${W}), dari sempadan bawah ke sempadan atas. Poligon kekerapan: sambung titik (titik tengah, kekerapan) dan tambah kelas berkekerapan sifar di kedua-dua hujung.</div>`;
 info.innerHTML=h;
}
function tog(id,key){const b=document.getElementById(id);b.onclick=()=>{S[key]=!S[key];b.classList.toggle('on',S[key]);snd('ketik');draw()}}
tog('bH','hist');tog('bP','poli');tog('bM','mid');
document.getElementById('bS').onclick=()=>{S.f=F0.slice();S.sel=-1;snd('ketik');draw()};
document.getElementById('bR').onclick=()=>{S.f=S.f.map(()=>1+Math.floor(Math.random()*14));S.sel=-1;snd('langkah');draw()};
let drag=-1;
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('pointerdown',e=>{const h=e.target.closest('.h');if(!h)return;e.preventDefault();drag=+h.dataset.i;S.sel=drag;svg.setPointerCapture(e.pointerId);draw()});
svg.addEventListener('pointermove',e=>{if(drag<0)return;e.preventDefault();const p=svgPt(e);const v=Math.max(0,Math.min(FMAX-1,Math.round((Y0-p.y)/(Y0-Y1)*FMAX)));if(v!==S.f[drag]){S.f[drag]=v;snd('detik');draw()}});
const end=()=>{drag=-1};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('dragstart',e=>e.preventDefault());
draw();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
