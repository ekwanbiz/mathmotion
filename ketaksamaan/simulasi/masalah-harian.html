<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Masalah Harian · Bab 6</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--sf:#131C2E;--sf2:#1A2540;--sf3:#0E1626;--bd:#22304A;--bd2:#2E3F5E;--tx:#E6EDF7;--mu:#94A3B8;--mu2:#64748B;--c1:#FBBF24;--ok:#34D399;--bad:#F87171;
 --surface:#131C2E;--border:#2E3F5E;--text:#E6EDF7;--muted:#94A3B8;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:9px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:11px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:#2a1f00}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;line-height:1.4;font-size:14.5px}
.info .story{color:var(--mu);font-size:13.5px;margin-bottom:5px}
.info .ln{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;padding:1px 0}
.info .ln .d{color:var(--mu);font-weight:600;font-size:13px}
.info .stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:800;margin-top:5px;color:var(--c1)}
.info .goal{margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:800}
.ok{color:var(--ok);font-weight:800}.no{color:var(--bad);font-weight:800}
.btns{display:flex;gap:8px}
.big{flex:1;background:var(--c1);border:0;color:#2a1f00;border-radius:13px;padding:12px 6px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:16px}.btns{grid-area:c;align-self:end}
 .info .story{font-size:15px}.info .ln{font-size:17px}.info .ln .d{font-size:14px}
}
@media(max-height:760px){.wrap{gap:6px;padding-top:8px}.modes button{padding:8px 4px;font-size:14px}.info{padding:7px 11px}.info .story{font-size:12.5px;margin-bottom:3px}.info .ln{font-size:14px}.big{padding:9px 4px}}
@media(max-width:420px){.modes button{font-size:13px;padding:10px 2px}.info .ln .d{font-size:12px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#38BDF8;color:#03202e;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #38bdf844">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Situasi">
   <button data-s="0" class="on" role="tab">🥤 Hari Sukan</button>
   <button data-s="1" role="tab">🎂 Kedai Kek</button>
   <button data-s="2" role="tab">🚌 Rombongan</button>
  </div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" aria-label="Graf sistem ketaksamaan bagi situasi harian"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="btns"><button class="big" id="semak">Semak jawapan</button><button class="big alt" id="reg">Sorok rantau</button><button class="big alt" id="hint">Petunjuk</button></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const svg=$('svg'),stage=$('stage'),info=$('info');
const MI='−',OPH={'<':'&lt;','<=':'≤','>':'&gt;','>=':'≥'},COL=['#FBBF24','#38BDF8','#34D399','#A78BFA'],PINK='#F472B6';
const N=v=>v<0?MI+(-v):String(v);
const holds=(h,x,y)=>{const v=h.A*x+h.B*y;return h.op==='<'?v<h.C:h.op==='>'?v>h.C:h.op==='<='?v<=h.C:v>=h.C};
const lhs=(A,B)=>{const t=(k,v,f)=>!k?'':(f?(k<0?MI:''):(k<0?' '+MI+' ':' + '))+(Math.abs(k)===1?'':Math.abs(k))+v;return A?t(A,'x',true)+t(B,'y',false):t(B,'y',true)};
// h: A x + B y op C ; s = syarat dalam ayat
const SC=[
 {story:'Kelas 4 Bestari membeli <b>x</b> botol air (RM2 sebotol) dan <b>y</b> bungkus roti (RM3 sebungkus) untuk Hari Sukan.',xl:'x (botol air)',yl:'y (roti)',bx:[0,16],by:[0,12],P:{x:3,y:2},
  cs:[{A:2,B:3,C:36,op:'<=',s:'Wang tidak melebihi RM36'},{A:0,B:1,C:4,op:'>=',s:'Sekurang-kurangnya 4 bungkus roti'},{A:1,B:-1,C:0,op:'>=',t:'x ≥ y',s:'Botol air sekurang-kurangnya sama dengan roti'}],
  stat:(x,y)=>`Jumlah kos: RM${2*x+3*y}`+(36-2*x-3*y>=0?` · Baki: RM${36-2*x-3*y}`:` · Terlebih RM${2*x+3*y-36}`),
  goal:'Cari bilangan <b>maksimum</b> bungkus roti yang boleh dibeli. Seret P ke titik itu.',key:(x,y)=>y,best:'max',
  hint:'Cari titik dalam rantau berlorek yang paling <b>tinggi</b>. Ingat: x dan y mesti nombor bulat.',why:'Bilangan maksimum roti ialah 7 (7 botol air, 7 bungkus roti, kos RM35).'},
 {story:'Sebuah kedai menghasilkan <b>x</b> kek coklat (2 jam sebiji) dan <b>y</b> kek pandan (1 jam sebiji) sehari.',xl:'x (coklat)',yl:'y (pandan)',bx:[0,10],by:[0,18],P:{x:1,y:1},
  cs:[{A:2,B:1,C:16,op:'<=',s:'Masa kerja tidak melebihi 16 jam'},{A:1,B:1,C:8,op:'>=',s:'Sekurang-kurangnya 8 biji kek'},{A:1,B:0,C:2,op:'>=',s:'Sekurang-kurangnya 2 kek coklat'},{A:0,B:1,C:2,op:'>=',s:'Sekurang-kurangnya 2 kek pandan'}],
  stat:(x,y)=>`Masa: ${2*x+y} jam · Jumlah kek: ${x+y}`,
  goal:'Cari bilangan <b>maksimum</b> kek coklat yang boleh dihasilkan. Seret P ke titik itu.',key:(x,y)=>x,best:'max',
  hint:'Cari titik dalam rantau berlorek yang paling ke <b>kanan</b>.',why:'Bilangan maksimum kek coklat ialah 7 (7 kek coklat, 2 kek pandan, 16 jam).'},
 {story:'Seramai 160 orang murid menyertai rombongan. Sekolah menyewa <b>x</b> buah bas (40 tempat duduk) dan <b>y</b> buah van (10 tempat duduk).',xl:'x (bas)',yl:'y (van)',bx:[0,10],by:[0,17],P:{x:1,y:1},
  cs:[{A:40,B:10,C:160,op:'>=',s:'Tempat duduk mencukupi untuk 160 murid'},{A:1,B:1,C:8,op:'<=',s:'Pemandu yang ada: selebih-lebihnya 8 orang'},{A:1,B:0,C:1,op:'>=',s:'Sekurang-kurangnya 1 bas'}],
  stat:(x,y)=>`Tempat duduk: ${40*x+10*y} · Pemandu: ${x+y}`,
  goal:'Cari bilangan <b>minimum</b> bas yang perlu disewa. Seret P ke satu titik yang sesuai.',key:(x,y)=>-x,best:'max',
  hint:'Cari titik dalam rantau berlorek yang paling ke <b>kiri</b>.',why:'Bilangan minimum bas ialah 3 (contoh: 3 bas dan 4 van, 160 tempat duduk).'}
];
// nilai optimum (integer, sukuan pertama)
SC.forEach(s=>{let b=-1e9;for(let x=0;x<=s.bx[1];x++)for(let y=0;y<=s.by[1];y++)if(s.cs.every(h=>holds(h,x,y)))b=Math.max(b,s.key(x,y));s.opt=b});
let si=0,P={...SC[0].P},showR=true,drag=false,G=null,res=null,hint=false;
const snd=n=>{if(window.FX)FX.play(n)};
const TX=(x,y,t,col='#E6EDF7',s=14,an='middle',w=800)=>`<text x="${x}" y="${y}" fill="${col}" font-size="${s}" font-weight="${w}" text-anchor="${an}" dominant-baseline="middle" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="#0E1626" stroke-width="4" stroke-linejoin="round">${t}</text>`;
function clip(poly,h){const s=h.op[0]==='>'?-1:1,f=p=>(h.A*p[0]+h.B*p[1]-h.C)*s,o=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],fp=f(p),fq=f(q);if(fp<=1e-9)o.push(p);if((fp<-1e-9&&fq>1e-9)||(fp>1e-9&&fq<-1e-9)){const t=fp/(fp-fq);o.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}}return o}
function seg(h,S){const [x0,x1]=S.bx,[y0,y1]=S.by;if(h.B===0){const x=h.C/h.A;return[[x,y0],[x,y1]]}const p=[x0,(h.C-h.A*x0)/h.B],q=[x1,(h.C-h.A*x1)/h.B],dy=q[1]-p[1];let t0=0,t1=1;if(dy){let a=(y0-p[1])/dy,b=(y1-p[1])/dy;if(a>b)[a,b]=[b,a];t0=Math.max(0,a);t1=Math.min(1,b)}if(t1<=t0)return null;return[[p[0]+t0*(q[0]-p[0]),p[1]+t0*dy],[p[0]+t1*(q[0]-p[0]),p[1]+t1*dy]]}
function draw(){const S=SC[si],w=stage.clientWidth||300,hh=stage.clientHeight||300;svg.setAttribute('viewBox',`0 0 ${w} ${hh}`);
 const L=44,Rr=16,Tp=26,Bt=40,[x0,x1]=S.bx,[y0,y1]=S.by,ux=(w-L-Rr)/(x1-x0+.4),uy=(hh-Tp-Bt)/(y1-y0+.4);
 G={X:x=>L+(x-x0)*ux,Y:y=>hh-Bt-(y-y0)*uy,ux,uy,L,Bt,hh};const {X,Y}=G;
 let g='';const sx=x1-x0>12?2:1,sy=y1-y0>12?2:1;
 for(let x=x0;x<=x1;x++)g+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1+.3)}" stroke="#ffffff${x%sx?'0a':'14'}"/>`;
 for(let y=y0;y<=y1;y++)g+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1+.3)}" y2="${Y(y)}" stroke="#ffffff${y%sy?'0a':'14'}"/>`;
 const hs=S.cs.concat([{A:1,B:0,C:0,op:'>='},{A:0,B:1,C:0,op:'>='}]),poly=hs.reduce((p,h)=>p.length?clip(p,h):p,[[x0,y0],[x1+.3,y0],[x1+.3,y1+.3],[x0,y1+.3]]);
 if(showR&&poly.length>2)g+=`<polygon points="${poly.map(q=>X(q[0])+','+Y(q[1])).join(' ')}" fill="${PINK}" fill-opacity=".34"/>`;
 // titik integer dalam rantau
 if(showR)for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)if(S.cs.every(h=>holds(h,x,y)))g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="2.6" fill="${PINK}"/>`;
 g+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1+.3)}" y2="${Y(0)}" stroke="#94A3B8" stroke-width="2"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1+.3)}" stroke="#94A3B8" stroke-width="2"/>`;
 for(let x=x0+sx;x<=x1;x+=sx)g+=TX(X(x),Y(0)+15,x,'#64748B',12,'middle',700);
 for(let y=y0+sy;y<=y1;y+=sy)g+=TX(X(0)-8,Y(y),y,'#64748B',12,'end',700);
 g+=TX(X(0)-8,Y(0)+15,'0','#64748B',12,'end',700)+TX(X(x1),Y(0)+31,S.xl,'#94A3B8',13,'end',800)+TX(X(0)+8,Y(y1)-12,S.yl,'#94A3B8',13,'start',800);
 S.cs.forEach((h,i)=>{const s=seg(h,S);if(!s)return;g+=`<line x1="${X(s[0][0])}" y1="${Y(s[0][1])}" x2="${X(s[1][0])}" y2="${Y(s[1][1])}" stroke="${COL[i]}" stroke-width="4" stroke-linecap="round"/>`});
 const ok=S.cs.every(h=>holds(h,P.x,P.y)),pc=ok?'#34D399':'#F87171';
 g+=`<g id="hP" style="cursor:grab"><circle cx="${X(P.x)}" cy="${Y(P.y)}" r="24" fill="transparent"/><circle cx="${X(P.x)}" cy="${Y(P.y)}" r="10" fill="${pc}" stroke="#0E1626" stroke-width="3"/></g>`;
 const rt=P.x>(x0+x1)/2;g+=TX(X(P.x)+(rt?-14:14),Y(P.y)+(P.y>y1-1?18:-16),`P(${P.x}, ${P.y})`,pc,14,rt?'end':'start');
 svg.innerHTML=g;showInfo(ok)}
function showInfo(ok){const S=SC[si];
 const rows=S.cs.map((h,i)=>{const v=h.A*P.x+h.B*P.y,o=holds(h,P.x,P.y);return`<div class="ln"><span style="color:${COL[i]}">${h.t||lhs(h.A,h.B)+' '+OPH[h.op]+' '+h.C} <span class="d">${S.cs[i].s}</span></span><span class="${o?'ok':'no'}">${v} ${o?'✓':'✗'}</span></div>`}).join('');
 let g=`<div class="goal">🎯 ${S.goal}`;
 if(res!==null)g+=res?`<br><span class="ok">Tepat! ${S.why}</span>`:`<br><span class="no">${ok?'P memenuhi semua syarat, tetapi belum optimum. Cuba lagi.':'P tidak memenuhi semua syarat (lihat ✗).'}</span>`;
 else if(hint)g+=`<br><span style="color:var(--mu);font-weight:600">${S.hint}</span>`;
 info.innerHTML=`<div class="story">${S.story}</div>${rows}<div class="stat"><span>${S.stat(P.x,P.y)}</span><span class="${ok?'ok':'no'}">${ok?'✓ dalam rantau':'✗ di luar rantau'}</span></div>${g}</div>`}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());return{x:(r.x-G.L)/G.ux,y:(G.hh-G.Bt-r.y)/G.uy}}
function move(q){const S=SC[si],x=Math.max(0,Math.min(S.bx[1],Math.round(q.x))),y=Math.max(0,Math.min(S.by[1],Math.round(q.y)));if(x!==P.x||y!==P.y){P={x,y};res=null;snd('langkah');draw()}}
svg.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;svg.setPointerCapture(e.pointerId);move(pt(e))});
svg.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();move(pt(e))});
const end=()=>{drag=false};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));si=+b.dataset.s;P={...SC[si].P};res=null;hint=false;draw()});
$('semak').onclick=()=>{const S=SC[si],ok=S.cs.every(h=>holds(h,P.x,P.y));res=ok&&S.key(P.x,P.y)===S.opt;if(res){snd('betul');if(window.FX)FX.stars(stage,14)}else snd('salah');draw()};
$('reg').onclick=()=>{showR=!showR;$('reg').textContent=showR?'Sorok rantau':'Tunjuk rantau';draw()};
$('hint').onclick=()=>{hint=true;res=null;draw()};
new ResizeObserver(()=>draw()).observe(stage);draw();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
