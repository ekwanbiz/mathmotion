<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>Bank Soalan telah ditutup | TerokaMath</title>
<link rel="icon" href="../icons/logo.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0C18;color:#F1F0FF;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
@media(prefers-color-scheme:light){body{background:#fff;color:#3C3C3C}.b{border-color:#E5E5E5!important}p{color:#6B6B6B!important}}
main{max-width:520px;padding:28px 22px;text-align:center}
h1{font-size:26px;margin:0 0 8px}
p{color:#A9A8CF;margin:0 0 14px}
a{color:#8B8BFF;font-weight:700}
.b{display:none;margin:22px 0 0;padding:16px;border:2px solid #2B2C4A;border-radius:16px}
button{font:inherit;font-weight:800;padding:10px 16px;border-radius:12px;border:0;background:#1CB0F6;color:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Bank Soalan telah ditutup</h1>
<p>Bank Soalan tidak lagi tersedia dalam TerokaMath.</p>
<p><a href="../">Ke TerokaMath</a></p>
<div class="b" id="b">
<p>Komputer ini ada <b id="n"></b> kertas yang cikgu susun sebelum ini. Muat turun fail di bawah untuk simpanan.</p>
<button type="button" id="dl">Muat turun kertas saya</button>
</div>
</main>
<script>
(function(){
  var raw=null,d=null;try{raw=localStorage.getItem('terokamath-bank');d=JSON.parse(raw)}catch(e){}
  if(!d||!d.papers)return;
  var k=d.papers.filter(function(p){return p.items&&p.items.length});
  if(!k.length)return;
  document.getElementById('n').textContent=k.length;
  document.getElementById('b').style.display='block';
  document.getElementById('dl').onclick=function(){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));
    a.download='kertas-bank-soalan.json';document.body.appendChild(a);a.click();a.remove();
  };
})();
</script>
</body>
</html>
