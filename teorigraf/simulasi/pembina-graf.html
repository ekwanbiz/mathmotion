<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pembina Graf · Bab 5</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0A0F1E;--sf:#121A2E;--sf2:#18223A;--sf3:#0D1426;--bd:#24324F;--bd2:#2F4166;--tx:#EAF0FF;--mu:#A9B6D3;--mu2:#7686A8;--c1:#38BDF8;--c2:#34D399;--c3:#A78BFA;--gold:#FBBF24;--pink:#F472B6;--ok:#3DDC84;--bad:#FF6B7A;
 --surface:#121A2E;--border:#2F4166;--text:#EAF0FF;--muted:#A9B6D3;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:11px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:#03202e}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:11px 14px;line-height:1.5;font-size:15px}
.info b.t{display:block;font-size:18px;color:var(--c1);margin-bottom:2px}
.info .tip{color:var(--mu);font-size:13px;margin-top:4px}
.info .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700}
.info .row b{color:var(--c2)}
.info .degs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.info .degs span{background:var(--sf2);border:1px solid var(--bd2);border-radius:9px;padding:2px 8px;font-weight:800;font-size:14px}
.info .degs span b{color:var(--pink)}
.info .eq{margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:700}
.info .ok{color:var(--ok);font-weight:800}.info .no{color:var(--bad);font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;border:1.5px solid}
.tags .y{color:var(--ok);border-color:var(--ok)}.tags .n{color:var(--bad);border-color:var(--bad)}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:11px 3px;font-weight:800;font-size:14.5px}
.chip.on{background:var(--c1);border-color:var(--c1);color:#03202e}
.chip.tog.on{background:var(--c3);border-color:var(--c3);color:#1a0f3a}
.big{background:var(--c2);border:0;color:#052a1c;border-radius:13px;padding:12px 4px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
.span2{grid-column:span 2}
.nextb{margin-top:8px;background:var(--c1);border:0;color:#03202e;border-radius:11px;padding:9px 16px;font-weight:900}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.4fr) minmax(330px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:16px}.ctrl{grid-area:c;align-self:end}
 .info b.t{font-size:22px}
}
@media(max-width:899px),(max-aspect-ratio:4/3){.stage{min-height:38vh;min-height:38dvh}.info{max-height:25vh;max-height:25dvh;overflow-y:auto}}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.modes button{padding:8px 4px;font-size:14px}.chip{padding:8px 2px;font-size:13.5px}.info{padding:8px 11px;font-size:14px}.info b.t{font-size:16px}.big{padding:9px 4px}}
@media(max-width:420px){.chip,.big{font-size:13px}.modes button{font-size:13.5px;padding:10px 3px}.info{font-size:14px}.info .degs span{font-size:13px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#38BDF8;color:#03202e;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #38bdf844">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Mod">
   <button data-m="bina" class="on" role="tab">✏️ Bina Graf</button>
   <button data-m="cabaran" role="tab">🎯 Cabaran Darjah</button>
  </div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 400 320" aria-label="Kanvas graf"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl"></div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),info=document.getElementById('info'),ctrl=document.getElementById('ctrl');
const W=400,H=320,VR=17,NAMES='ABCDEFGH';
const C1='#38BDF8',C2='#34D399',C3='#A78BFA',GOLD='#FBBF24',PINK='#F472B6',OK='#3DDC84',BAD='#FF6B7A',TX='#EAF0FF',MU='#A9B6D3',BG='#0D1426';
const snd=n=>{if(window.FX)FX.play(n)};
let S={m:'bina',tool:'tepi',dir:false,V:[],E:[],tgt:null,done:false,score:0};
let drag=null,tmp=null;
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function nextName(){const used=new Set(S.V.map(v=>v.n));for(const c of NAMES)if(!used.has(c))return c;return null}
function deg(){const d={};S.V.forEach(v=>d[v.n]=0);S.E.forEach(e=>{if(e.a===e.b)d[e.a]+=2;else{d[e.a]++;d[e.b]++}});return d}
function outd(n){return S.E.filter(e=>e.a===n).length}
function ind(n){return S.E.filter(e=>e.b===n).length}
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function simple(){const s=new Set();for(const e of S.E){if(e.a===e.b)return'gelung';const k=key(e.a,e.b);if(s.has(k))return'berbilang';s.add(k)}return''}
function connected(){if(!S.V.length)return false;const seen=new Set([S.V[0].n]),st=[S.V[0].n];while(st.length){const u=st.pop();S.E.forEach(e=>{[[e.a,e.b],[e.b,e.a]].forEach(([x,y])=>{if(x===u&&!seen.has(y)){seen.add(y);st.push(y)}})})}return seen.size===S.V.length}
const vByN=n=>S.V.find(v=>v.n===n);
function lbl(x,y,t,c=TX,s=17){return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${c}" font-size="${s}" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="${BG}" stroke-width="5" stroke-linejoin="round" pointer-events="none">${t}</text>`}
function head(tx,ty,ux,uy,c){const k=12,nx=-uy,ny=ux;return `<polygon points="${tx},${ty} ${tx-ux*k+nx*k*.55},${ty-uy*k+ny*k*.55} ${tx-ux*k-nx*k*.55},${ty-uy*k-ny*k*.55}" fill="${c}" pointer-events="none"/>`}
/* ---------- lukis ---------- */
function drawEdges(dir,col){
 const cnt={},idx={};let g='';
 S.E.forEach(e=>{if(e.a!==e.b){const k=key(e.a,e.b);cnt[k]=(cnt[k]||0)+1}});
 const cx=W/2,cy=H/2;
 S.E.forEach((e,i)=>{
  const p=vByN(e.a),q=vByN(e.b);
  if(e.a===e.b){let ux=p.x-cx,uy=p.y-cy;const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;if(L<5){ux=0;uy=-1}const R=13,lx=p.x+ux*(VR+R-3),ly=p.y+uy*(VR+R-3);
   g+=`<circle cx="${lx}" cy="${ly}" r="${R}" fill="none" stroke="${col}" stroke-width="4"/><circle data-e="${i}" cx="${lx}" cy="${ly}" r="${R}" fill="none" stroke="transparent" stroke-width="16"/>`;return}
  const k=key(e.a,e.b),n=cnt[k],j=idx[k]=(idx[k]??-1)+1;
  // arah lengkung tetap mengikut susunan nama supaya tepi berganda tidak bertindih
  const s=e.a<e.b?1:-1;
  const dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy*s,ny=ux*s;
  const bend=n>1?(j-(n-1)/2)*32:0,kx=(p.x+q.x)/2+nx*bend*2,ky=(p.y+q.y)/2+ny*bend*2;
  const d=bend?`M${p.x} ${p.y} Q${kx} ${ky} ${q.x} ${q.y}`:`M${p.x} ${p.y} L${q.x} ${q.y}`;
  g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round"/><path data-e="${i}" d="${d}" fill="none" stroke="transparent" stroke-width="18"/>`;
  if(dir){let tx=ux,ty=uy;if(bend){tx=q.x-kx;ty=q.y-ky;const tl=Math.hypot(tx,ty);tx/=tl;ty/=tl}g+=head(q.x-tx*(VR+2),q.y-ty*(VR+2),tx,ty,col)}
 });
 return g}
function drawVerts(badge){
 let g='';const d=deg();
 S.V.forEach(v=>{
  g+=`<g data-v="${v.n}" style="cursor:pointer"><circle cx="${v.x}" cy="${v.y}" r="26" fill="transparent"/><circle cx="${v.x}" cy="${v.y}" r="${VR}" fill="#18223A" stroke="${GOLD}" stroke-width="4"/></g>`+lbl(v.x,v.y+1,v.n,TX,17);
  if(badge){const b=badge(v,d[v.n]);if(b)g+=b}
 });
 return g}
function badgeAt(v,t,c){const bx=Math.min(W-14,v.x+22),by=Math.max(14,v.y-22);return `<circle cx="${bx}" cy="${by}" r="12" fill="${c}" pointer-events="none"/>`+`<text x="${bx}" y="${by+1}" fill="#0A0F1E" font-size="${String(t).length>2?10:14}" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="Inter,Arial,sans-serif" pointer-events="none">${t}</text>`}
function render(){
 let g='';
 if(S.m==='bina'){
  if(!S.V.length)g+=lbl(W/2,H/2,'Ketik ruang kosong untuk tambah bucu',MU,15);
  g+=drawEdges(S.dir,C1);
  if(tmp)g+=`<line x1="${tmp.x1}" y1="${tmp.y1}" x2="${tmp.x2}" y2="${tmp.y2}" stroke="${C3}" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round" pointer-events="none"/>`;
  g+=drawVerts((v,d)=>S.dir?badgeAt(v,outd(v.n)+'/'+ind(v.n),PINK):badgeAt(v,d,PINK));
  svg.innerHTML=g;binaInfo();
 }else{
  g+=drawEdges(false,C1);
  if(tmp)g+=`<line x1="${tmp.x1}" y1="${tmp.y1}" x2="${tmp.x2}" y2="${tmp.y2}" stroke="${C3}" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round" pointer-events="none"/>`;
  g+=drawVerts((v,d)=>{const t=S.tgt[v.n],c=d===t?OK:d>t?BAD:MU;return badgeAt(v,d+'/'+t,c)});
  svg.innerHTML=g;cabInfo();
 }
}
function binaInfo(){
 const d=deg(),nV=S.V.length,nE=S.E.length,sum=Object.values(d).reduce((a,b)=>a+b,0);
 let h=`<b class="t">${S.dir?'Graf terarah':'Graf tidak terarah'}</b><div class="row"><span>n(V) = <b>${nV}</b> bucu</span><span>n(E) = <b>${nE}</b> tepi</span></div>`;
 if(nV){
  if(S.dir)h+=`<div class="degs">${S.V.map(v=>`<span>${v.n}: keluar <b>${outd(v.n)}</b>, masuk <b>${ind(v.n)}</b></span>`).join('')}</div><div class="eq">Jumlah keluar = jumlah masuk = ${nE} = bilangan tepi</div>`;
  else h+=`<div class="degs">${S.V.map(v=>`<span>d(${v.n}) = <b>${d[v.n]}</b></span>`).join('')}</div><div class="eq">Σ darjah = ${S.V.map(v=>d[v.n]).join(' + ')} = ${sum} = 2 × ${nE} <span class="ok">✓</span></div>`;
  const sp=simple(),cn=connected(),tree=!sp&&cn&&nE===nV-1&&!S.dir;
  h+=`<div class="tags">${S.dir?'':sp?`<span class="n">Bukan graf mudah: ada ${sp==='gelung'?'gelung':'berbilang tepi'}</span>`:`<span class="y">Graf mudah</span>`}${cn?'<span class="y">Terkait</span>':'<span class="n">Tidak terkait</span>'}${tree?'<span class="y">🌳 Pokok</span>':''}</div>`;
 }
 const tips={bucu:'Ketik ruang kosong untuk tambah bucu (maksimum 8). Seret bucu untuk alih.',tepi:'Seret dari satu bucu ke bucu lain untuk lukis tepi. Ketik satu bucu untuk tambah gelung.',padam:'Ketik bucu atau tepi untuk memadamnya.'};
 h+=`<div class="tip">${tips[S.tool]}${S.dir?' Nombor merah jambu = keluar/masuk.':' Nombor merah jambu = darjah.'}</div>`;
 info.innerHTML=h}
/* ---------- cabaran ---------- */
const LAY={4:[[100,80],[300,80],[300,240],[100,240]],5:[[200,50],[330,140],[280,270],[120,270],[70,140]],6:[[110,60],[290,60],[350,160],[290,265],[110,265],[50,160]]};
function newCab(){
 const n=4+rnd(3),pos=LAY[n],nm=NAMES.slice(0,n).split('');
 const all=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)all.push([i,j]);
 const m=n-1+rnd(3),pick=shuf(all).slice(0,m),t={};nm.forEach(x=>t[x]=0);pick.forEach(([a,b])=>{t[nm[a]]++;t[nm[b]]++});
 if(Object.values(t).some(x=>x===0))return newCab();
 S.V=nm.map((x,i)=>({n:x,x:pos[i][0],y:pos[i][1]}));S.E=[];S.tgt=t;S.done=false;S.m='cabaran';S.tool='tepi';
 setCtrl();render()}
function cabInfo(){
 const d=deg(),sum=Object.values(S.tgt).reduce((a,b)=>a+b,0),ok=S.V.every(v=>d[v.n]===S.tgt[v.n]);
 let h=`<b class="t">Bina graf mudah dengan darjah sasaran</b><div class="degs">${S.V.map(v=>`<span>d(${v.n}) = <b>${d[v.n]}</b> / ${S.tgt[v.n]}${d[v.n]===S.tgt[v.n]?' ✓':''}</span>`).join('')}</div>`;
 h+=`<div class="eq">Jumlah darjah sasaran = ${sum}, jadi graf perlu ${sum} ÷ 2 = <b>${sum/2}</b> tepi. Sekarang: ${S.E.length} tepi.</div>`;
 if(ok&&!S.done){S.done=true;S.score++;snd('menang');if(window.FX)FX.stars(document.getElementById('stage'),14)}
 if(ok)h+=`<div class="ok" style="margin-top:6px">✓ Hebat! Semua darjah tepat. Skor: ${S.score}</div><button class="nextb" id="nx">Cabaran seterusnya ▶</button>`;
 else h+=`<div class="tip">Seret antara dua bucu untuk lukis tepi; ketik tepi untuk padam. Tiada gelung dan tiada berbilang tepi. Lencana: sekarang/sasaran.</div>`;
 info.innerHTML=h;const nx=document.getElementById('nx');if(nx)nx.onclick=newCab}
/* ---------- kawalan ---------- */
function setCtrl(){
 if(S.m==='bina'){
  ctrl.innerHTML=`<button class="chip ${S.tool==='bucu'?'on':''}" data-t="bucu">● Bucu</button><button class="chip ${S.tool==='tepi'?'on':''}" data-t="tepi">╱ Tepi</button><button class="chip ${S.tool==='padam'?'on':''}" data-t="padam">✕ Padam</button><button class="chip tog ${S.dir?'on':''}" id="dir">➜ Terarah</button><button class="big span2" id="rw">Graf rawak</button><button class="big alt span2" id="kos">Kosongkan</button>`;
  ctrl.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;setCtrl();render()});
  document.getElementById('dir').onclick=()=>{S.dir=!S.dir;setCtrl();render()};
  document.getElementById('rw').onclick=rawak;
  document.getElementById('kos').onclick=()=>{S.V=[];S.E=[];S.tool='bucu';setCtrl();render()};
 }else{
  ctrl.innerHTML=`<button class="big alt span2" id="ul">Padam semua tepi</button><button class="big span2" id="nb">Cabaran baharu</button>`;
  document.getElementById('ul').onclick=()=>{S.E=[];S.done=false;render()};
  document.getElementById('nb').onclick=newCab;
 }}
function rawak(){
 const n=4+rnd(3),pos=LAY[n];S.V=pos.map((p,i)=>({n:NAMES[i],x:p[0],y:p[1]}));S.E=[];
 const all=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)all.push([NAMES[i],NAMES[j]]);
 shuf(all).slice(0,n+rnd(2)).forEach(([a,b])=>S.E.push(Math.random()<.5||!S.dir?{a,b}:{a:b,b:a}));
 if(Math.random()<.5){const v=NAMES[rnd(n)];S.E.push({a:v,b:v})}
 if(Math.random()<.4){const e=S.E[rnd(S.E.length)];if(e.a!==e.b)S.E.push({a:e.a,b:e.b})}
 S.tool='tepi';setCtrl();render()}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));
 if(b.dataset.m==='cabaran')newCab();else{S.m='bina';S.V=[];S.E=[];S.tool='bucu';rawak()}});
/* ---------- tetikus + sentuh ---------- */
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function vAt(p){let best=null,bd=28;S.V.forEach(v=>{const d=Math.hypot(v.x-p.x,v.y-p.y);if(d<bd){bd=d;best=v}});return best}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
svg.addEventListener('pointerdown',e=>{
 e.preventDefault();const p=pt(e),v=vAt(p),eg=e.target.closest('[data-e]');
 if(S.tool==='padam'||(S.m==='cabaran'&&eg&&!v)){
  if(v&&S.m==='bina'){S.E=S.E.filter(x=>x.a!==v.n&&x.b!==v.n);S.V=S.V.filter(x=>x!==v);snd('ketik');render();return}
  if(eg){S.E.splice(+eg.dataset.e,1);S.done=false;snd('ketik');render()}return}
 if(S.tool==='bucu'&&S.m==='bina'){
  if(v){drag={mode:'move',v,id:e.pointerId};svg.setPointerCapture(e.pointerId);return}
  const n=nextName();if(!n){info.querySelector('.tip').innerHTML='<span class="no">Maksimum 8 bucu.</span>';return}
  S.V.push({n,x:clamp(p.x,VR+6,W-VR-6),y:clamp(p.y,VR+6,H-VR-6)});snd('ketik');render();return}
 if(v){drag={mode:'edge',v,x0:p.x,y0:p.y,moved:false,id:e.pointerId};tmp={x1:v.x,y1:v.y,x2:p.x,y2:p.y};svg.setPointerCapture(e.pointerId);render()}
});
svg.addEventListener('pointermove',e=>{
 if(!drag)return;e.preventDefault();const p=pt(e);
 if(drag.mode==='move'){drag.v.x=clamp(p.x,VR+6,W-VR-6);drag.v.y=clamp(p.y,VR+6,H-VR-6);render();return}
 if(Math.hypot(p.x-drag.x0,p.y-drag.y0)>8)drag.moved=true;
 tmp.x2=p.x;tmp.y2=p.y;render()});
function endDrag(e){
 if(!drag)return;const d=drag;drag=null;tmp=null;
 if(d.mode==='edge'){
  const p=pt(e),w=vAt(p);
  if(w&&w!==d.v){
   if(S.m==='cabaran'){if(S.E.some(x=>key(x.a,x.b)===key(d.v.n,w.n))){render();info.querySelector('.tip')&&(info.querySelector('.tip').innerHTML='<span class="no">Graf mudah: tiada berbilang tepi.</span>');return}}
