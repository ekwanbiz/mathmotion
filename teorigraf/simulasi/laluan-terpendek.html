<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Laluan Terpendek · Bab 5</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0A0F1E;--sf:#121A2E;--sf2:#18223A;--sf3:#0D1426;--bd:#24324F;--bd2:#2F4166;--tx:#EAF0FF;--mu:#A9B6D3;--mu2:#7686A8;--c1:#38BDF8;--c2:#34D399;--c3:#A78BFA;--gold:#FBBF24;--pink:#F472B6;--ok:#3DDC84;--bad:#FF6B7A;
 --surface:#121A2E;--border:#2F4166;--text:#EAF0FF;--muted:#A9B6D3;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:11px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:#03202e}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:11px 14px;line-height:1.5;font-size:15px}
.info b.t{display:block;font-size:18px;color:var(--c1);margin-bottom:2px}
.info .tip{color:var(--mu);font-size:13px;margin-top:4px}
.info .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700}
.info .row b{color:var(--c2)}
.info .degs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.info .degs span{background:var(--sf2);border:1px solid var(--bd2);border-radius:9px;padding:2px 8px;font-weight:800;font-size:14px}
.info .degs span b{color:var(--pink)}
.info .eq{margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:700}
.info .ok{color:var(--ok);font-weight:800}.info .no{color:var(--bad);font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;border:1.5px solid}
.tags .y{color:var(--ok);border-color:var(--ok)}.tags .n{color:var(--bad);border-color:var(--bad)}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:11px 3px;font-weight:800;font-size:14.5px}
.chip.on{background:var(--c1);border-color:var(--c1);color:#03202e}
.chip.tog.on{background:var(--c3);border-color:var(--c3);color:#1a0f3a}
.big{background:var(--c2);border:0;color:#052a1c;border-radius:13px;padding:12px 4px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
.span2{grid-column:span 2}
.nextb{margin-top:8px;background:var(--c1);border:0;color:#03202e;border-radius:11px;padding:9px 16px;font-weight:900}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.4fr) minmax(330px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:16px}.ctrl{grid-area:c;align-self:end}
 .info b.t{font-size:22px}
}
@media(max-width:899px),(max-aspect-ratio:4/3){.stage{min-height:38vh;min-height:38dvh}.info{max-height:25vh;max-height:25dvh;overflow-y:auto}}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.modes button{padding:8px 4px;font-size:14px}.chip{padding:8px 2px;font-size:13.5px}.info{padding:8px 11px;font-size:14px}.info b.t{font-size:16px}.big{padding:9px 4px}}
@media(max-width:420px){.chip,.big{font-size:13px}.modes button{font-size:13.5px;padding:10px 3px}.info{font-size:14px}.info .degs span{font-size:13px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#A78BFA;color:#1a0f3a;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #a78bfa44">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Mod">
   <button data-m="cari" class="on" role="tab">🧭 Cari Laluan</button>
   <button data-m="ubah" role="tab">⚖️ Ubah Pemberat</button>
   <button data-m="sehala" role="tab">➡️ Sehala</button>
  </div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 400 320" aria-label="Peta rangkaian berpemberat"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl"></div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),info=document.getElementById('info'),ctrl=document.getElementById('ctrl');
const W=400,H=320,VR=18,NM='ABCDEFG';
const C1='#38BDF8',C2='#34D399',C3='#A78BFA',GOLD='#FBBF24',PINK='#F472B6',OK='#3DDC84',BAD='#FF6B7A',TX='#EAF0FF',MU='#A9B6D3',DIMC='#3A4A6B',BG='#0D1426';
const snd=n=>{if(window.FX)FX.play(n)};
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const POS=[[40,160],[128,56],[128,264],[210,160],[292,56],[292,264],[366,160]];
const CAND=[[0,1],[0,2],[1,3],[2,3],[1,4],[2,5],[3,4],[3,5],[4,6],[5,6],[0,3],[3,6],[1,2],[4,5]];
const PLACE=['Rumah','Kedai','Klinik','Taman','Masjid','Pasar','Sekolah'];
let S={m:'cari',E:[],dir:false,path:[0],done:false,sel:-1,score:0,show:false};
function lbl(x,y,t,c=TX,s=17){return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${c}" font-size="${s}" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="${BG}" stroke-width="5" stroke-linejoin="round" pointer-events="none">${t}</text>`}
function paths(){const out=[],adj=NM.split('').map(()=>[]);S.E.forEach((e,i)=>{adj[e.a].push([e.b,i]);if(!S.dir)adj[e.b].push([e.a,i])});
 const go=(u,p,es)=>{if(u===6){out.push({v:p.slice(),e:es.slice(),w:es.reduce((s,i)=>s+S.E[i].w,0)});return}for(const [v,i] of adj[u])if(!p.includes(v)){p.push(v);es.push(i);go(v,p,es);p.pop();es.pop()}};go(0,[0],[]);return out}
function best(){const P=paths();if(!P.length)return null;const mn=Math.min(...P.map(p=>p.w));return{P,mn,b:P.filter(p=>p.w===mn)}}
function newMap(){
 for(let t=0;t<500;t++){
  const pick=CAND.slice(0,10).filter(()=>Math.random()<.85).concat(shuf(CAND.slice(10)).slice(0,1+rnd(2)));
  S.E=pick.map(([a,b])=>({a,b,w:1+rnd(9)}));
  if(S.dir)S.E.forEach(e=>{if(POS[e.a][0]===POS[e.b][0]&&Math.random()<.5)[e.a,e.b]=[e.b,e.a]});
  const B=best();if(!B||B.P.length<4||B.b.length!==1)continue;
  const minE=Math.min(...B.P.map(p=>p.e.length));if(B.b[0].e.length===minE&&Math.random()<.75)continue;
  break}
 S.path=[0];S.done=false;S.sel=-1;S.show=false;setCtrl();render()}
function edgeBetween(a,b){return S.E.findIndex(e=>(e.a===a&&e.b===b)||(!S.dir&&e.a===b&&e.b===a))}
function render(){
 const B=best(),hl=new Set();
 if(S.m==='ubah'&&B)B.b.forEach(p=>p.e.forEach(i=>hl.add(i)));
 if(S.show&&B)B.b[0].e.forEach(i=>hl.add(i));
 const mine=new Set();for(let k=1;k<S.path.length;k++)mine.add(edgeBetween(S.path[k-1],S.path[k]));
 let g='';
 S.E.forEach((e,i)=>{const [x1,y1]=POS[e.a],[x2,y2]=POS[e.b],on=mine.has(i)&&S.m!=='ubah',h=hl.has(i),sel=S.sel===i;
  const c=sel?PINK:on?C1:h?C2:'#5B6B8E';
  g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${on||h||sel?7:4}" stroke-linecap="round"/>`;
  if(S.dir){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,mx=x1+dx*.5+ux*28,my=y1+dy*.5+uy*28,k=11,nx=-uy,ny=ux;g+=`<polygon points="${mx+ux*k},${my+uy*k} ${mx-ux*k*.6+nx*k*.75},${my-uy*k*.6+ny*k*.75} ${mx-ux*k*.6-nx*k*.75},${my-uy*k*.6-ny*k*.75}" fill="${c}" pointer-events="none"/>`}
  g+=`<line data-e="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="22" style="cursor:pointer"/>`});
 S.E.forEach((e,i)=>{const [x1,y1]=POS[e.a],[x2,y2]=POS[e.b],mx=(x1+x2)/2,my=(y1+y2)/2,sel=S.sel===i;
  g+=`<g data-e="${i}" style="cursor:pointer"><rect x="${mx-15}" y="${my-13}" width="30" height="26" rx="8" fill="${BG}" stroke="${sel?PINK:GOLD}" stroke-width="${sel?3:2}"/></g>`+lbl(mx,my+1,e.w,sel?PINK:GOLD,15)});
 const last=S.path[S.path.length-1];
 for(let i=0;i<7;i++){const [x,y]=POS[i],inP=S.path.includes(i)&&S.m!=='ubah',end=i===0||i===6;
  const nb=S.m!=='ubah'&&!S.done&&edgeBetween(last,i)>=0&&!S.path.includes(i);
  g+=`<g data-v="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="27" fill="transparent"/>${nb?`<circle cx="${x}" cy="${y}" r="${VR+7}" fill="none" stroke="${C1}" stroke-width="2" stroke-dasharray="4 4"/>`:''}<circle cx="${x}" cy="${y}" r="${VR}" fill="${inP?C1:'#18223A'}" stroke="${end?PINK:GOLD}" stroke-width="4"/></g>`+lbl(x,y+1,NM[i],inP?'#03202e':TX,17).replace('stroke="#0D1426"',inP?'stroke="none"':'stroke="#0D1426"');
  g+=lbl(x,y+(y>160||i===0||i===6?(i===0||i===6?-34:34):-34),PLACE[i],MU,12)}
 svg.innerHTML=g;
 S.m==='ubah'?ubahInfo(B):cariInfo(B)}
function cariInfo(B){
 const P=S.path,w=P.slice(1).reduce((s,v,k)=>s+S.E[edgeBetween(P[k],v)].w,0);
 let h=`<b class="t">Cari laluan terpendek dari A (${PLACE[0]}) ke G (${PLACE[6]})</b>`;
 h+=`<div class="eq">Laluan: ${P.map(i=>NM[i]).join(' → ')}<br>Jumlah = ${P.length>1?P.slice(1).map((v,k)=>S.E[edgeBetween(P[k],v)].w).join(' + ')+' = ':''}<b>${w} km</b></div>`;
 if(P[P.length-1]===6){
  if(w===B.mn){if(!S.done){S.done=true;S.score++;snd('menang');if(window.FX)FX.stars(document.getElementById('stage'),14)}h+=`<div class="ok" style="margin-top:6px">✓ Laluan terpendek! ${w} km. Skor: ${S.score}</div>`}
  else{h+=`<div class="no" style="margin-top:6px">Sampai di G, tetapi ada laluan ${w-B.mn} km lebih pendek. Ketik bucu sebelumnya untuk undur.</div>`;if(!S.done){S.done=true;snd('salah')}}
 }else h+=`<div class="tip">Ketik bucu berjiran (bulatan putus-putus) untuk bergerak${S.dir?' mengikut arah anak panah':''}. Ketik bucu dalam laluan untuk undur ke situ.${S.show?` Terpendek: ${B.b[0].v.map(i=>NM[i]).join(' → ')} = ${B.mn} km.`:''}</div>`;
 info.innerHTML=h}
function ubahInfo(B){
 let h=`<b class="t">Ubah pemberat, lihat laluan terpendek berubah</b>`;
 if(!B){info.innerHTML=h+'<div class="no">Tiada laluan.</div>';return}
 const sorted=B.P.slice().sort((a,b)=>a.w-b.w).slice(0,3);
 h+=`<div class="eq">${sorted.map((p,k)=>`${k===0?'<b style="color:#34D399">':''}${p.v.map(i=>NM[i]).join(' → ')} = ${p.e.map(i=>S.E[i].w).join(' + ')} = ${p.w} km${k===0?'</b>':''}`).join('<br>')}</div>`;
 h+=B.b.length>1?`<div class="no" style="margin-top:4px">${B.b.length} laluan sama pendek (${B.mn} km).</div>`:`<div class="tip">Hijau: laluan terpendek (${B.mn} km) daripada ${B.P.length} laluan. Ketik satu tepi, kemudian guna − / + untuk ubah pemberatnya.</div>`;
 if(S.sel>=0){const e=S.E[S.sel];h+=`<div class="row" style="margin-top:4px"><span>Tepi dipilih: <b>${NM[e.a]}${NM[e.b]}</b> = ${e.w} km</span></div>`}
 info.innerHTML=h}
function setCtrl(){
 if(S.m==='ubah'){ctrl.innerHTML=`<button class="big alt" id="mn">− 1</button><button class="big alt" id="pl">+ 1</button><button class="big span2" id="nb">Peta baharu</button>`;
  const ch=d=>{if(S.sel<0){info.querySelector('.tip')&&(info.querySelector('.tip').innerHTML='<span class="no">Ketik satu tepi dahulu.</span>');return}const e=S.E[S.sel];e.w=Math.max(1,Math.min(20,e.w+d));snd('ketik');render()};
  document.getElementById('mn').onclick=()=>ch(-1);document.getElementById('pl').onclick=()=>ch(1);document.getElementById('nb').onclick=newMap;return}
 ctrl.innerHTML=`<button class="big alt" id="ul">Ulang</button><button class="big alt" id="tj">Tunjuk</button><button class="big span2" id="nb">Peta baharu</button>`;
 document.getElementById('ul').onclick=()=>{S.path=[0];S.done=false;S.show=false;render()};
 document.getElementById('tj').onclick=()=>{S.show=!S.show;render()};
 document.getElementById('nb').onclick=newMap}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));
 S.m=b.dataset.m;S.dir=S.m==='sehala';newMap()});
svg.addEventListener('pointerdown',e=>{
 e.preventDefault();const v=e.target.closest('[data-v]'),ed=e.target.closest('[data-e]');
 if(S.m==='ubah'){if(ed){S.sel=+ed.dataset.e;snd('ketik');render()}return}
 if(!v)return;const i=+v.dataset.v,k=S.path.indexOf(i);
 if(k>=0){if(k<S.path.length-1){S.path=S.path.slice(0,k+1);S.done=false;snd('ketik');render()}return}
 if(S.done)return;
 if(edgeBetween(S.path[S.path.length-1],i)<0){snd('salah');return}
 S.path.push(i);snd('langkah');render()});
svg.addEventListener('dragstart',e=>e.preventDefault());
newMap();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
