:root{--bg:#0B1220;--surface:#131C2E;--border:#22304A;--text:#E6EDF7;--muted:#94A3B8;--accent:#A78BFA;--green:#34D399;--orange:#FB923C;--pink:#F472B6;--amber:#FBBF24;--head:'Space Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px))}

.a-controls{grid-area:controls}.a-canvas{grid-area:canvas}.a-player{grid-area:player}
.panel{border:1px solid var(--border);background:var(--surface);padding:16px;border-radius:20px}

label,.muted{font-size:12px;color:var(--muted)}

.bl{border-right:0;border-radius:8px 0 0 8px}.br{border-left:0;border-radius:0 8px 8px 0}

.legend i{width:10px;height:10px;border-radius:999px;display:inline-block}
.canvasbox{position:relative}.warning{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:max-content;max-width:calc(100% - 24px);padding:10px 16px;border-radius:14px;background:#FBBF24;color:#0B1220;font-size:14px;font-weight:700;line-height:1.35;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;animation:pop .25s ease-out}.warning:empty{display:none}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}@media(min-width:900px){.warning{font-size:15px;top:16px}}@media(prefers-reduced-motion:reduce){.warning{animation:none}}
.barbg{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin:12px 0}

input[type=range]{accent-color:var(--accent)}
@media(max-width:440px){.wrap{padding:14px 10px 24px}.panel{padding:12px}.row{gap:6px}.set{margin-left:0}button{padding:9px 8px}.top h1{font-size:24px}}
@media(min-width:900px){

}
label{display:block;margin-bottom:6px}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.cols select{margin-top:0}.coord{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.coord input{width:70px}.coord .set{margin-left:0}.note{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);padding:12px 14px;margin-top:12px;border-radius:12px;font-size:13px;line-height:1.6;color:var(--text)}.note strong{color:#C4B5FD}.statusline{font-size:13px;margin-top:12px;line-height:1.7;color:var(--text)}.statusline strong{color:var(--muted);font-weight:600}.sub{font-size:12px;color:var(--muted);margin:-4px 0 8px}@media(max-width:420px){.cols{grid-template-columns:minmax(0,1fr)}}@media(max-width:380px){.coord input{width:56px}}

/* Butang kembali mudah ditekan di iPhone: elak kawasan jam/notch, header melekat di atas */
.wrap{padding-top:0}
.top{position:sticky;top:0;z-index:20;margin:0 -16px 16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(11,18,32,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}

.top-snd{margin-left:auto;flex:none}
/* Amaran: satu baris kecil di luar grid, kiri atas (ganti teks petunjuk) */

.a-canvas .warning:empty{display:none}

/* ===== Kawalan padat + satu skrin di telefon ===== */
.back svg{width:22px;height:22px;flex:none}
.back:active{transform:scale(.94);background:var(--border)}
.crow{display:flex;align-items:center;gap:8px}
.crow+.crow{margin-top:10px}
.cl{flex:none;width:60px;margin:0;font-size:12px;font-weight:700;color:var(--muted)}
.crow select{flex:1;min-width:0;margin-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rnd{width:100%;margin-top:8px}
.vec{display:flex;align-items:stretch;gap:6px}
.vec .bracket{height:auto}
.vcol{display:flex;flex-direction:column;gap:6px}
.vcol .row{gap:6px}.vcol .muted{width:10px}
.crow .set{margin-left:4px;white-space:nowrap}
.crow .coord{flex:1;flex-wrap:nowrap;gap:6px}
.crow .axisvalue{flex:none}
.cl{width:48px}.crow .coord input,.crow .axisvalue input{width:52px}.crow .set{padding-left:10px;padding-right:10px}
#angle{flex:0 0 84px}
.pbtns #prev,.pbtns #next{flex:none;width:48px;padding:0;font-size:18px}
.pbtns button{white-space:nowrap}.pbtns .primary{min-width:0}
.pspeed{margin-top:12px}
.a-controls .note{margin-top:10px}
@media(max-width:699px){
 .wrap{height:100svh;display:flex;flex-direction:column;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
 .top{margin-bottom:8px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;gap:10px}
 .top .eyebrow{display:none}
 .top h1{font-size:20px;margin:0}

 .panel{padding:10px 12px;border-radius:16px}
 select,input[type=number]{min-height:38px;padding:5px 8px;font-size:16px}
 input[type=number]{width:54px}
 .coord input,.axisvalue input{width:52px}
 button{min-height:40px;padding:6px 10px}
 .crow+.crow{margin-top:8px}
 .cl{width:52px;font-size:11.5px}
 .vcol{gap:4px}
 .a-controls .note{margin-top:8px;padding:6px 10px;font-size:12px;line-height:1.4}
 .valuestatus{font-size:11px;margin-top:4px}

 .hint,.sub{display:none}
 .a-canvas .warning{margin:0 0 4px}
 .canvasbox{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:none;overflow:visible}
 .canvasbox>canvas,.canvasbox>svg{width:min(100cqw,calc(100cqh * 600 / 440));height:auto;aspect-ratio:600/440;border:1px solid var(--border);border-radius:14px}
 .barbg{margin:8px 0}
 .pspeed{margin-top:8px}
 .primary{font-size:15px}
}

<body>
<main class="wrap">
<header class="top">
<a class="back" id="backbtn" href="../#/teroka" aria-label="Kembali ke Simulasi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg><span>Kembali</span></a>
<div><span class="eyebrow">Bab 11 · Simulasi</span><h1>Putaran</h1><p>Putarkan objek pada satu pusat putaran</p></div>
<span class="top-snd" id="sndslot"></span></header>
<div class="grid">
<section class="panel a-controls">
<div class="crow"><label class="cl" for="shape">Bentuk</label><select id="shape"><option value="triangle">Segi tiga</option><option value="quad">Segi empat</option><option value="pentagon">Pentagon</option><option value="hexagon">Heksagon</option><option value="trapezium">Trapezium</option><option value="random">Random</option></select></div>
<button id="randomize" class="rnd" style="display:none">⚄ Jana Bentuk Baharu</button>
<div class="crow"><label class="cl" for="angle">Sudut</label><select id="angle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option><option value="360">360°</option></select><label class="sr" for="direction">Arah putaran</label><select id="direction"><option value="ccw">Lawan arah jam ↺</option><option value="cw">Arah jam ↻</option></select></div>
<div class="crow"><span class="cl">Pusat P</span><div class="coord"><span class="muted">x</span><input id="cx" type="number" value="0" min="-8" max="8" step="1" aria-label="Koordinat x pusat putaran"><span class="muted">y</span><input id="cy" type="number" value="0" min="-6" max="6" step="1" aria-label="Koordinat y pusat putaran"><button id="apply" class="set">✓ Tetapkan</button></div></div>
<div id="explain" class="note" hidden>Putar <strong>90° lawan arah jam</strong> pada pusat <strong>P(0, 0)</strong>.</div>
</section>
<div class="a-canvas">
<p class="hint">Seret bentuk biru atau pusat putaran P pada grid</p>
<p class="sub">Klik ruang kosong untuk memindahkan bentuk. Semua bucu kekal pada titik persilangan grid.</p>
<div id="warning" class="warning" role="alert" aria-live="assertive"></div><div class="canvasbox"><canvas id="canvas" width="600" height="440" aria-label="Grid Cartes interaktif untuk putaran"></canvas></div>
</div>
<section class="panel a-player">
<div class="row" style="justify-content:space-between"><span id="stage" class="muted">Langkah 0 / 2</span><span id="status" class="muted">Sedia</span></div>
<div class="barbg"><div id="progress" class="bar"></div></div>
<div class="row pbtns"><button id="prev" aria-label="Langkah sebelum">←</button><button id="play" class="primary">▶ Mainkan</button><button id="next" aria-label="Langkah seterusnya">→</button><button id="reset">↺ Reset</button></div>
<div class="row pspeed"><label for="speed" style="margin:0">Kelajuan</label><input id="speed" type="range" min=".2" max="1" step=".1" value=".6" style="flex:1;min-width:0"><span id="speedlabel" class="muted">0.6×</span></div>
<div id="coordinates" class="statusline" hidden></div>
</section>
</div>
</main>
<script>(function(){
const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d'),S=30,OX=300,OY=220,ABC='ABCDEF';
const presets={triangle:[[0,0],[2,0],[1,2]],quad:[[0,0],[3,0],[3,2],[0,2]],pentagon:[[0,0],[2,0],[3,1],[1,3],[-1,1]],hexagon:[[0,0],[2,0],[3,1],[2,3],[0,3],[-1,1]],trapezium:[[0,0],[4,0],[3,2],[1,2]]};
let shape=presets.triangle,anchor=[-4,-1],center=[0,0],angle=90,direction=1,step=0,t=0,playing=false,raf=0,last=0,dragMode='',offset=[0,0],valid=true;
const xy=p=>[OX+p[0]*S,OY-p[1]*S],toGrid=p=>[(p[0]-OX)/S,(OY-p[1])/S],pts=a=>shape.map(p=>[p[0]+a[0],p[1]+a[1]]),rad=Math.PI/180;
function rotate(p,portion=1){let a=angle*rad*direction*portion,x=p[0]-center[0],y=p[1]-center[1];return[center[0]+x*Math.cos(a)-y*Math.sin(a),center[1]+x*Math.sin(a)+y*Math.cos(a)]}
function nearInt(x){let v=Math.round(x);return Math.abs(x-v)<1e-8?v:x}
function fits(a,c=center){let old=center;center=c;let q=pts(a),out=q.map(p=>rotate(p));center=old;return q.concat(out).every(p=>p[0]>=-9.01&&p[0]<=9.01&&p[1]>=-6.01&&p[1]<=6.01)}
function line(a,b,color,width=2,dash=[]){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function dot(p,r,color){ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function txt(p,s,color,dx=9,dy=-10){ctx.fillStyle=color;ctx.font='700 13px Inter, sans-serif';ctx.textAlign='left';ctx.fillText(s,p[0]+dx,p[1]+dy)}
function poly(ps,color,fill,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ps.forEach((p,i)=>{let q=xy(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function grid(){ctx.fillStyle='#0B1220';ctx.fillRect(0,0,600,440);ctx.font='600 10px Inter, sans-serif';ctx.textAlign='center';for(let x=-10;x<=10;x++){line([OX+x*S,0],[OX+x*S,440],x?'#1C2A42':'#64748B',x?1:1.6);if(x%2===0&&Math.abs(x)<=8){ctx.fillStyle='#94A3B8';ctx.fillText(x,OX+x*S,OY+16)}}ctx.textAlign='left';for(let y=-7;y<=7;y++){line([0,OY-y*S],[600,OY-y*S],y?'#1C2A42':'#64748B',y?1:1.6);if(y!==0&&y%2===0&&Math.abs(y)<=6){ctx.fillStyle='#94A3B8';ctx.fillText(y,OX+7,OY-y*S-5)}}}
function draw(){grid();let original=pts(anchor),target=original.map(p=>rotate(p)),C=xy(center);let nearest=original.reduce((best,p,i)=>{let d=(p[0]-center[0])**2+(p[1]-center[1])**2;return d<best.d?{i,d}:best},{i:0,d:Infinity}).i;let vertex=original[nearest],letter=ABC[nearest],A=xy(vertex),end=xy(target[nearest]);
// Laluan oren hanya dilukis secara berperingkat selepas animasi bermula.
poly(original,'#38bdf8','rgba(2,132,199,.20)');original.forEach((p,i)=>{let q=xy(p);dot(q,4,'#7dd3fc');txt(q,ABC[i],'#e0f2fe')});
// Empat fasa pengajaran: jejari asal, lengkok, jejari akhir, sudut diserlahkan, kemudian putaran.
const prep=.17,arcEnd=.43,joinEnd=.56,highlightEnd=.70;
if(step===0&&t>0){
 const radialProgress=Math.min(1,t/prep);
 const R=[C[0]+(A[0]-C[0])*radialProgress,C[1]+(A[1]-C[1])*radialProgress];
 line(C,R,'#facc15',2.8);
 if(t>=prep){
  const f=Math.min(1,(t-prep)/(arcEnd-prep));
  const segments=Math.max(2,Math.ceil(f*130));ctx.beginPath();
  for(let i=0;i<=segments;i++){let q=xy(rotate(vertex,f*i/segments));i?ctx.lineTo(...q):ctx.moveTo(...q)}
  ctx.strokeStyle='#fb923c';ctx.lineWidth=3;ctx.lineCap='round';ctx.setLineDash([4,7]);ctx.stroke();ctx.setLineDash([]);
 }
 if(t>=arcEnd){
  // Sambung pusat P kepada bucu imej selepas lengkok siap; bentuk masih pegun.
  const f=Math.min(1,(t-arcEnd)/(joinEnd-arcEnd));
  const R2=[C[0]+(end[0]-C[0])*f,C[1]+(end[1]-C[1])*f];
  line(C,R2,'#facc15',2.8);
 }
 if(t>=joinEnd){
  // Serlahkan sudut di pusat P, di antara kedua-dua garis jejari.
  const pulse=t<highlightEnd?0.5+0.5*Math.sin((t-joinEnd)/(highlightEnd-joinEnd)*Math.PI*5):1;
  const radius=35;
  const startAng=Math.atan2(A[1]-C[1],A[0]-C[0]);
  const sweep=-direction*angle*Math.PI/180;
  ctx.save();ctx.beginPath();ctx.moveTo(...C);
  for(let i=0;i<=100;i++){const theta=startAng+sweep*i/100;ctx.lineTo(C[0]+radius*Math.cos(theta),C[1]+radius*Math.sin(theta))}
  ctx.closePath();ctx.fillStyle='rgba(251,191,36,'+(0.13+0.17*pulse)+')';ctx.fill();
  ctx.beginPath();for(let i=0;i<=100;i++){const theta=startAng+sweep*i/100;const x=C[0]+radius*Math.cos(theta),y=C[1]+radius*Math.sin(theta);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.strokeStyle='#facc15';ctx.lineWidth=3.5+1.5*pulse;ctx.stroke();
  const mid=startAng+sweep/2;let lx=C[0]+Math.cos(mid)*65,ly=C[1]+Math.sin(mid)*65;
  lx=Math.max(28,Math.min(572,lx));ly=Math.max(28,Math.min(415,ly));
  ctx.font='700 19px "Space Grotesk", sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#0B1220';ctx.strokeText(angle+'°',lx,ly);ctx.fillStyle='#fde68a';ctx.fillText(angle+'°',lx,ly);ctx.restore();
 }
 if(t>=highlightEnd){
  const move=Math.max(0,Math.min(1,(t-highlightEnd)/(1-highlightEnd)));
  const moving=original.map(p=>rotate(p,move));poly(moving,'#f472b6','rgba(236,72,153,.17)');
  moving.forEach((p,i)=>{let q=xy(p);dot(q,4,'#f472b6');txt(q,ABC[i]+'′','#fbcfe8')});
  const q=xy(rotate(vertex,move));dot(q,7,'#facc15');
  line(C,q,'rgba(250,204,21,.7)',2);
 }
}

if(step>=1){
 let f=step===2?1:t;let q=target;
 ctx.save();ctx.globalAlpha=Math.max(.15,f);poly(q,'#f472b6','rgba(236,72,153,.17)');q.forEach((p,i)=>{let v=xy(p);dot(v,4,'#f472b6');txt(v,ABC[i]+'′','#fbcfe8')});ctx.restore();
 // Laluan yang sudah dilalui kekal kelihatan selepas putaran selesai.
 if(step===1){ctx.save();ctx.globalAlpha=Math.max(0,1-f);ctx.beginPath();for(let i=0;i<=110;i++){let v=xy(rotate(vertex,i/110));i?ctx.lineTo(...v):ctx.moveTo(...v)}ctx.strokeStyle='#fb923c';ctx.lineWidth=3;ctx.setLineDash([4,7]);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
}
dot(C,8,'#a78bfa');ctx.beginPath();ctx.arc(...C,12,0,Math.PI*2);ctx.strokeStyle='#ddd6fe';ctx.lineWidth=2;ctx.stroke();txt(C,'P','#e9d5ff',13,-14);
$('stage').textContent='Langkah '+step+' / 2';$('status').textContent=step===2?'Selesai':step===1?'Imej selepas putaran':step===0&&t===0?'Sedia':step===0&&t>0&&t<.17?'Sambung P ke '+letter:step===0&&t<.43?'Lukis lengkok oren':step===0&&t<.56?'Sambung P ke '+letter+'′':step===0&&t<.70?'Sudut '+angle+'°':step===0&&t>=.70?'Putaran bentuk':'Sedia';$('progress').style.width=((step+t)/2*100)+'%';$('play').textContent=playing?'⏸ Pause':step===2?'↻ Ulang':'▶ Mainkan';$('prev').disabled=step===0&&t===0;$('next').disabled=step===2;
let p=vertex,q=target[nearest];$('coordinates').innerHTML='<strong>Bucu terdekat dengan P:</strong> '+letter+'<br><strong>Koordinat:</strong> '+letter+'('+p.map(nearInt).join(', ')+') → '+letter+'′('+q.map(nearInt).join(', ')+')<br><strong>Pusat:</strong> P('+center.join(', ')+') · <strong>Sudut:</strong> '+angle+'° · <strong>Arah:</strong> '+(direction===1?'lawan arah jam':'arah jam');
}
function stop(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;last=0}
function resetAnim(){stop();step=0;t=0;draw()}
function warn(s){$('warning').textContent=s}
function validPosition(){if(fits(anchor))return true;for(let y=-5;y<=5;y++)for(let x=-8;x<=8;x++)if(fits([x,y])){anchor=[x,y];return true}return false}
function refresh(){angle=Number($('angle').value);direction=$('direction').value==='ccw'?1:-1;valid=validPosition();resetAnim();$('randomize').style.display=$('shape').value==='random'?'block':'none';$('explain').innerHTML='Putar <strong>'+angle+'° '+(direction===1?'lawan arah jam':'arah jam')+'</strong> pada pusat <strong>P('+center.join(', ')+')</strong>.<br>Laluan oren menunjukkan pergerakan bucu yang paling dekat dengan P.';$('play').disabled=!valid;warn(valid?'':'⚠ Imej tidak muat dalam grid')}
function tick(now){if(!playing)return;if(!last)last=now;let dt=Math.min(60,now-last)*Number($('speed').value);last=now;t+=dt/(step===0?Math.max(1500,angle*14):1500);if(t>=1){step++;t=0;if(step>=2)stop()}draw();if(playing)raf=requestAnimationFrame(tick)}
$('play').onclick=()=>{if(!valid)return;if(playing){stop();draw();return}if(step===2){step=0;t=0}playing=true;last=0;draw();raf=requestAnimationFrame(tick)};
function jump(d){stop();step=Math.max(0,Math.min(2,step+d));t=0;draw()}
$('prev').onclick=()=>jump(-1);$('next').onclick=()=>jump(1);$('reset').onclick=()=>{anchor=[-4,-1];center=[0,0];$('cx').value=0;$('cy').value=0;refresh()};$('speed').oninput=()=>{$('speedlabel').textContent=Number($('speed').value).toFixed(1)+'×'};
$('angle').onchange=refresh;$('direction').onchange=refresh;
function randomShape(){let n=3+Math.floor(Math.random()*4),arr=[];for(let i=0;i<n;i++){let a=i*2*Math.PI/n-Math.PI/2,r=2+Math.random()*.5;arr.push([Math.round(Math.cos(a)*r),Math.round(Math.sin(a)*r)])}return arr}
$('shape').onchange=()=>{shape=$('shape').value==='random'?randomShape():presets[$('shape').value];refresh()};$('randomize').onclick=()=>{shape=randomShape();refresh()};
function applyCenter(){let x=$('cx').value.trim(),y=$('cy').value.trim(),a=Number(x),b=Number(y);if(!x||!y||!Number.isInteger(a)||!Number.isInteger(b)||Math.abs(a)>8||Math.abs(b)>6){warn('⚠ Nombor bulat sahaja: x −8 hingga 8, y −6 hingga 6');return}if(!fits(anchor,[a,b])){warn('⚠ Imej keluar grid – alihkan bentuk');return}center=[a,b];refresh()}
$('apply').onclick=applyCenter;['cx','cy'].forEach(id=>{$(id).onkeydown=e=>{if(e.key==='Enter')applyCenter()}});
function pointer(e){let r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*600,(e.clientY-r.top)/r.height*440]}
function inside(p){let a=pts(anchor).map(xy),hit=false;for(let i=0,j=a.length-1;i<a.length;j=i++){let v=a[i],w=a[j];if((v[1]>p[1])!==(w[1]>p[1])&&p[0]<(w[0]-v[0])*(p[1]-v[1])/(w[1]-v[1])+v[0])hit=!hit}return hit}
function centroid(){let a=shape.reduce((acc,p)=>[acc[0]+p[0],acc[1]+p[1]],[0,0]);return[a[0]/shape.length,a[1]/shape.length]}
function place(a){let q=a.map(Math.round);if(fits(q)){if(q[0]!==anchor[0]||q[1]!==anchor[1]){anchor=q;resetAnim()}warn('')}else warn('⚠ Di luar grid')}
cv.addEventListener('pointerdown',e=>{let p=pointer(e),v=toGrid(p),c=xy(center);if(Math.hypot(p[0]-c[0],p[1]-c[1])<18){dragMode='center';offset=[0,0]}else if(inside(p)){dragMode='shape';offset=[anchor[0]-v[0],anchor[1]-v[1]]}else{dragMode='shape';let m=centroid();offset=[-m[0],-m[1]];place([v[0]+offset[0],v[1]+offset[1]])}try{cv.setPointerCapture(e.pointerId)}catch(err){}});
cv.addEventListener('pointermove',e=>{if(!dragMode)return;let v=toGrid(pointer(e));if(dragMode==='shape')place([v[0]+offset[0],v[1]+offset[1]]);else{let q=v.map(Math.round);if(q[0]===center[0]&&q[1]===center[1])return;if(Math.abs(q[0])<=8&&Math.abs(q[1])<=6&&fits(anchor,q)){center=q;$('cx').value=q[0];$('cy').value=q[1];refresh();warn('')}else warn('⚠ Pusat atau imej di luar grid')}});
cv.addEventListener('pointerup',()=>dragMode='');cv.addEventListener('pointercancel',()=>dragMode='');refresh();
})();</script>
