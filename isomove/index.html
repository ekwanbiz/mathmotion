<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B1220">
<meta name="description" content="ISOMOVE – Transformasi Isometri, Matematik Tingkatan 2 Bab 11. Nota slaid, simulasi, latihan dan permainan.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MATHMOTION">
<title>ISOMOVE – Transformasi Isometri</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<script>
(function(){try{var m=localStorage.getItem('mathmotion-mode');if(m==='cerah'||(!m&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.classList.add('light')}catch(e){}})();
</script>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url('fonts/inter-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700 900;font-display:swap;src:url('fonts/inter-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:500;font-display:swap;src:url('fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;font-display:swap;src:url('fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--nav:#0E1626;--surf:#131C2E;--surf2:#0B1220;--diag:#0E1626;--bd:#22304A;--tx:#E6EDF7;--mu:#94A3B8;--grid:#1E2A40;--dim:#334155;
 --tr:#38BDF8;--pa:#FB923C;--pu:#A78BFA;--am:#FBBF24;--gr:#34D399;--pk:#F472B6;--rd:#F87171;--on:#0B1220;--head:'Space Grotesk',system-ui,sans-serif;
 --hh:64px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html.light{--bg:#F4F6FB;--nav:#FFFFFF;--surf:#FFFFFF;--surf2:#F4F6FB;--diag:#FAFBFE;--bd:#D5DCE8;--tx:#14152B;--mu:#55607A;--grid:#E3E8F1;--dim:#C3CBDA;
 --tr:#0284C7;--pa:#EA580C;--pu:#7C3AED;--am:#B45309;--gr:#059669;--pk:#DB2777;--rd:#DC2626;--on:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--tr)}
:focus-visible{outline:3px solid var(--tr);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#print{display:none}

/* ---------- Kerangka ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.hdr{flex:none;height:calc(var(--hh) + var(--sat));padding:var(--sat) 18px 0;display:flex;align-items:center;gap:12px;background:var(--nav);border-bottom:1px solid var(--bd)}
.ib{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--surf);color:var(--tx);display:flex;align-items:center;justify-content:center;text-decoration:none}
.ib:hover{border-color:var(--mu)}
.wm{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.03em;color:var(--tx);text-decoration:none;white-space:nowrap}
.wm span{color:var(--tr)}
.tabs{display:flex;gap:4px;margin:0 auto}
.tabs a{height:44px;padding:0 18px;display:flex;align-items:center;gap:8px;border-radius:12px;color:var(--mu);text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.04em}
.tabs a:hover{color:var(--tx)}
.tabs a[aria-current="page"]{background:var(--tr);color:var(--on);font-weight:800}
.tabs svg{width:20px;height:20px}
.hdr .end{display:flex;gap:8px}
.main{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:26px 32px 30px;flex:1;display:flex;flex-direction:column;gap:20px;min-height:0}
.eyebrow{margin:0;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--tr)}
.h1{margin:4px 0 0;font-family:var(--head);font-size:clamp(28px,3.2vw,42px);font-weight:700;line-height:1.15}
.lead{margin:6px 0 0;font-size:17px;color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:15px;border:0;font-weight:800;font-size:17px;text-decoration:none}
.btn.pri{background:var(--tr);color:var(--on)}
.btn.sec{background:var(--surf);border:1px solid var(--bd);color:var(--tx);font-weight:700}
.btn.big{min-height:62px;font-size:20px;padding:0 28px;border-radius:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;font-weight:800;font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%) translateY(16px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- Muka depan ---------- */
.splash{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));text-align:center;background-image:linear-gradient(#8080800f 1px,transparent 1px),linear-gradient(90deg,#8080800f 1px,transparent 1px);background-size:28px 28px}
.splash img{width:150px;height:150px;border-radius:38px;box-shadow:0 18px 50px #38BDF833}
.splash h1{margin:6px 0 0;font-family:var(--head);font-size:clamp(44px,7vw,72px);line-height:1;letter-spacing:.03em}
.splash h1 span{color:var(--tr)}
.slogan{margin:0;font-family:var(--head);font-size:clamp(20px,2.6vw,28px);font-weight:700}
.splash .sub{margin:0;color:var(--mu);font-size:16px}
.splash .btn{width:100%;max-width:440px;margin-top:10px}

/* ---------- NOTA: senarai subtopik ---------- */
.subgrid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(150px,1fr);gap:16px}
.subcard{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:22px;background:var(--surf);border:1.5px solid var(--bd);color:var(--tx);text-decoration:none;transition:border-color .15s,transform .15s}
.subcard:hover{border-color:var(--c);transform:translateY(-2px)}
.subcard .top{display:flex;align-items:center;justify-content:space-between}
.subcard .no{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:21px;color:var(--on);background:var(--c)}
.subcard .cnt{font-size:15px;font-weight:700;color:var(--mu)}
.subcard h2{margin:0;font-family:var(--head);font-size:clamp(20px,2vw,26px);color:var(--c);line-height:1.2}
.subcard p{margin:0;font-size:15px;line-height:1.45;color:var(--mu)}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* ---------- NOTA: slaid ---------- */
.slbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--nav)}
.slbar .nm{font-family:var(--head);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.slbar .pg{margin-left:auto;font-weight:700;color:var(--mu);white-space:nowrap}
.stage{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;display:flex}
.slide{width:100%;min-width:0;max-width:1320px;margin:0 auto;padding:clamp(16px,2.6vh,30px) clamp(18px,3.4vw,48px);display:flex;gap:clamp(20px,3vw,40px);align-items:flex-start;--fs:clamp(18px,calc(1.05vw + .9vh),27px)}
.slide.full{flex-direction:column}
.sl-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px)}
.sl-kick{margin:0;font-size:14px;font-weight:800;letter-spacing:.12em;color:var(--c)}
.sl-title{margin:0;font-family:var(--head);font-size:calc(var(--fs) * 1.6);line-height:1.15;font-weight:700}
.sl-fig{flex:0 0 min(42%,560px);display:flex;justify-content:center}
.sl-svg{width:100%;height:auto;max-height:calc(100dvh - 250px);background:var(--diag);border:1px solid var(--bd);border-radius:22px}
.sl-p{margin:0;font-size:var(--fs);line-height:1.5}
.sl-p.sm{font-size:calc(var(--fs) * .85)}
.sl-def{padding:clamp(12px,1.8vh,18px) 22px;border-radius:18px;background:color-mix(in srgb,var(--c) 10%,transparent);border:2px solid var(--c)}
.sl-def p{margin:0;font-size:calc(var(--fs) * 1.04);line-height:1.5}
.sl-bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:calc(var(--fs) * .96);line-height:1.45}
.sl-bul li{display:flex;gap:14px}
.sl-bul li::before{content:"";flex:none;width:12px;height:12px;margin-top:.55em;border-radius:6px;background:var(--c)}
.sl-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.sl-steps li{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-radius:16px;background:var(--surf);border:1px solid var(--bd);font-size:calc(var(--fs) * .88);line-height:1.45}
.sl-steps .n{flex:none;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--c);color:var(--on);font-weight:800;font-size:18px}
.sl-ans{padding:12px 18px;border-radius:14px;background:color-mix(in srgb,var(--gr) 12%,transparent);border:2px solid var(--gr);font-size:calc(var(--fs) * .92);font-weight:700}
.sl-ans>span:first-child{color:var(--gr);letter-spacing:.08em;font-size:14px;margin-right:8px}
.sl-note{padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--am) 9%,transparent);border:1px solid color-mix(in srgb,var(--am) 45%,transparent);font-size:calc(var(--fs) * .8);line-height:1.45}
.sl-note b{color:var(--am)}
.sl-table{overflow-x:auto;border-radius:20px;border:1px solid var(--bd)}
.vec{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;padding:0 10px;line-height:1.05;border-left:3px solid var(--c,var(--tr));border-right:3px solid var(--c,var(--tr));border-radius:12px;font-weight:700;color:var(--c,var(--tr));font-size:.95em}
.rv.hid{visibility:hidden}
.lsh{display:none}
g.rv.hid{visibility:hidden}
.slfoot{flex:none;display:flex;align-items:center;gap:12px;padding:12px 24px calc(12px + var(--sab));border-top:1px solid var(--bd);background:var(--nav)}
.dots{display:flex;align-items:center;gap:7px;margin:0 auto}
.dots i{display:block;width:11px;height:11px;border-radius:6px;background:var(--dim)}
.dots i.on{width:30px;background:var(--c)}
.hint{font-size:13px;color:var(--mu);white-space:nowrap}

/* ---------- TEROKA ---------- */
.sim{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:18px 22px 22px;max-width:1400px;width:100%;margin:0 auto}
.simbox{min-height:0;display:flex;align-items:center;justify-content:center;background:var(--diag);border:1px solid var(--bd);border-radius:22px;overflow:hidden;position:relative}
.simbox svg{width:100%;height:100%;max-height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.simbox .drag{cursor:grab}
.panel{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pbox{padding:16px;border-radius:18px;background:var(--surf);border:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.pbox h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--mu)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surf);border:1px solid var(--bd)}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--c,var(--tr));color:var(--on);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:46px;border-radius:12px;border:1.5px solid var(--bd);background:var(--surf2);color:var(--tx);font-weight:700;font-size:16px}
.opt[aria-pressed="true"]{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:800}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:54px;text-align:center;font-family:var(--head);font-size:24px}
.step span{flex:1;font-weight:700}
.step button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--bd);background:var(--surf2);color:var(--tx);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tg{display:flex;align-items:center;justify-content:space-between;min-height:42px;font-size:17px;font-weight:600;cursor:pointer}
.tg input{width:24px;height:24px;accent-color:var(--c,var(--tr))}
.rule{font-family:var(--head);font-size:22px;font-weight:700;text-align:center;padding:10px;border-radius:12px;background:var(--surf2)}
.ctab{width:100%;border-collapse:collapse;font-size:15px}
.ctab td,.ctab th{padding:5px 6px;text-align:center}
.ctab th{color:var(--mu);font-size:13px}
.tip{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--am) 10%,transparent);border:1px solid color-mix(in srgb,var(--am) 40%,transparent);font-size:15px;line-height:1.45}
.tip b{color:var(--am)}
.prow{display:flex;gap:10px}

/* ---------- TEROKA (simulasi asal) ---------- */
.tero{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px 18px 18px;width:100%;max-width:1440px;margin:0 auto}
.terseg{flex:none;max-width:560px;width:100%;align-self:center}
.terseg a{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--mu);font-weight:700;font-size:16px;text-decoration:none}
.terseg a:hover{color:var(--tx)}
.terseg a[aria-current="page"]{background:var(--c);color:var(--on);font-weight:800}
.simframe{flex:1;min-height:0;width:100%;border:1px solid var(--bd);border-radius:20px;background:#0B1220;display:block}

/* ---------- LATIHAN ---------- */
.lgrid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;min-height:0}
.topicl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(64px,1fr);gap:12px}
.tcheck{display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:18px;background:var(--surf);border:2px solid var(--bd);cursor:pointer;font-family:var(--head);font-size:clamp(17px,1.7vw,21px);font-weight:700;color:var(--mu)}
.tcheck.on{border-color:var(--tr);background:color-mix(in srgb,var(--tr) 8%,transparent);color:var(--tx)}
.tcheck input{flex:none;width:26px;height:26px;accent-color:var(--tr)}
.tcheck .no{flex:none;padding:5px 10px;border-radius:10px;background:var(--c);color:var(--on);font-family:Inter,sans-serif;font-size:15px;font-weight:800}
.mixbar{display:flex;height:16px;border-radius:8px;overflow:hidden}
.mixrow{display:flex;align-items:center;gap:10px;font-size:17px}
.mixrow i{width:13px;height:13px;border-radius:7px}
.mixrow b{margin-left:auto}
.qhead{flex:none;display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--nav);flex-wrap:wrap}
.qprog{display:flex;gap:5px;flex-wrap:wrap}
.qprog i{display:block;width:22px;height:9px;border-radius:5px;background:var(--dim)}
.qbody{flex:1;min-height:0;overflow:auto}
.qwrap{max-width:1320px;margin:0 auto;padding:26px clamp(18px,3.4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:32px;align-items:start}
.qwrap.nofig{grid-template-columns:minmax(0,1fr)}
.qtext{margin:0;font-family:var(--head);font-size:clamp(24px,2.6vw,36px);line-height:1.3;font-weight:700}
.ansbox{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:20px;background:color-mix(in srgb,var(--gr) 10%,transparent);border:2px solid var(--gr)}
.ansbox .ok{flex:none;width:46px;height:46px;border-radius:23px;background:var(--gr);color:var(--on);display:flex;align-items:center;justify-content:center}
.ansbox small{display:block;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--gr)}
.ansbox b{display:block;font-family:var(--head);font-size:clamp(24px,2.6vw,36px)}
.work{padding:16px 20px;border-radius:20px;background:var(--surf);border:1px solid var(--bd)}
.work h3{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--mu)}
.work ol{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:6px;font-size:clamp(17px,1.6vw,21px);line-height:1.45}
.qfig{max-width:480px}.qfig svg{width:100%;height:auto;max-height:calc(100dvh - 300px);background:var(--diag);border:1px solid var(--bd);border-radius:20px}
.qfoot{flex:none;display:flex;align-items:center;gap:12px;padding:12px 24px calc(12px + var(--sab));border-top:1px solid var(--bd);background:var(--nav)}
.lvl-m{--lc:var(--gr)}.lvl-s{--lc:var(--am)}.lvl-k{--lc:var(--rd)}

/* ---------- LEMBARAN KERJA ---------- */
.latseg{flex:none;max-width:440px;width:100%}
.latseg a,.terseg a{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--mu);font-weight:700;font-size:16px;text-decoration:none}
.latseg a[aria-current="page"]{background:var(--tr);color:var(--on);font-weight:800}
.wsgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.wsubs{grid-template-columns:repeat(6,minmax(0,1fr))}
.wlvls{grid-template-columns:repeat(5,minmax(0,1fr))}
.wlvls .opt{font-size:14px}
.wcnt{display:inline-flex;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--c);color:var(--on);font-size:12px;align-items:center;justify-content:center;margin-left:4px}
.wsname{margin:12px 0 8px;font-family:var(--head);font-weight:700;font-size:20px}
.wqs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.wq{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--surf);border:2px solid var(--bd);cursor:pointer}
.wq.on{border-color:var(--tr);background:color-mix(in srgb,var(--tr) 7%,var(--surf))}
.wq input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--tr)}
.wqb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wqh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.wqt{font-size:17px;line-height:1.45}
.wqf{flex:none;width:150px}
.wqf svg{display:block;width:100%;height:auto;background:var(--diag);border:1px solid var(--bd);border-radius:12px}
.wqf svg.shp{width:90px;margin-left:auto}
.wsside{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.wsel{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.wsel li{display:flex;align-items:center;gap:6px;font-size:15px}
.wsel .n{width:26px;height:26px;border-radius:13px;background:var(--tr);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.wsel .t{flex:1;min-width:0}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);font-weight:800;font-size:16px;flex:none}
.mini:disabled{opacity:.35;cursor:default}

/* ---------- GAMES ---------- */
.ghud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hearts{display:flex;gap:4px}
.hearts svg{width:30px;height:30px}
.tbar{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
.tbar .bar{flex:1;height:14px;border-radius:7px;background:var(--dim);overflow:hidden}
.tbar .bar i{display:block;height:100%;border-radius:7px;background:var(--gr);transition:width .25s linear}
.tbar b{font-family:var(--head);font-size:22px;min-width:48px;text-align:right}
.gq{flex:1;min-height:0;display:grid;grid-template-columns:min(460px,44%) minmax(0,1fr);gap:24px;align-items:start}
.gfig{width:100%}
.gfig svg{display:block;max-height:calc(100dvh - 230px);margin:0 auto}
.gq.nofig{grid-template-columns:minmax(0,1fr)}
.gfig svg{width:100%;height:auto;background:var(--diag);border:1px solid var(--bd);border-radius:22px}
.gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gopt{min-height:76px;border-radius:18px;border:2px solid var(--bd);background:var(--surf);color:var(--tx);font-weight:800;font-size:clamp(18px,1.9vw,23px);display:flex;align-items:center;gap:12px;padding:0 18px;text-align:left}
.gopt .k{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:16px}
.gopt.right{border:3px solid var(--gr);background:color-mix(in srgb,var(--gr) 14%,transparent)}
.gopt.wrong{border:3px solid var(--rd);background:color-mix(in srgb,var(--rd) 12%,transparent)}
.gfb{min-height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:14px;font-weight:800;font-size:19px}
.gfb.ok{background:color-mix(in srgb,var(--gr) 12%,transparent);color:var(--gr)}
.gfb.no{background:color-mix(in srgb,var(--rd) 12%,transparent);color:var(--rd)}
.gend{max-width:560px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 24px}
.gend .score{font-family:var(--head);font-size:84px;font-weight:700;line-height:1;color:var(--tr)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.45}
.rules svg{flex:none;width:26px;height:26px;margin-top:1px}.rules li>svg{color:var(--tr)}

.gfig.tap svg{cursor:crosshair;touch-action:none}
.spark{position:fixed;width:12px;height:12px;pointer-events:none;z-index:60;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.combo.hot{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--pa) 35%,transparent),0 0 22px color-mix(in srgb,var(--pa) 60%,transparent)}}
@media (prefers-reduced-motion:reduce){.combo.hot{animation:none}}

/* ---------- Telefon / skrin kecil ---------- */
@media (max-width:900px){
 :root{--hh:58px}
 .hdr{padding:var(--sat) 12px 0;gap:8px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;justify-content:space-around;padding:6px 6px calc(6px + var(--sab));background:var(--nav);border-top:1px solid var(--bd)}
 .tabs a{flex:1;flex-direction:column;gap:3px;height:56px;padding:0;justify-content:center;font-size:11px;letter-spacing:.02em}
 .tabs a[aria-current="page"]{background:color-mix(in srgb,var(--tr) 16%,transparent);color:var(--tr)}
 .hdr .end{margin-left:auto}
 .app.tabbed{padding-bottom:calc(68px + var(--sab))}
 .app.tabbed .slfoot,.app.tabbed .qfoot{padding-bottom:10px}
 .fsbtn{display:none!important}
 .wrap{padding:18px 16px 22px;gap:16px}
 .subgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}
 .subcard{padding:16px;gap:8px}
 .subcard .no{width:46px;height:46px;font-size:17px;border-radius:13px}
 .slide{flex-direction:column;align-items:stretch;--fs:clamp(16px,4.3vw,19px)}
 .sl-fig{flex:none;width:100%;max-width:520px;align-self:center}
 .sl-svg{max-height:none}
 .slbar{padding:10px 14px}
 .slfoot{padding:10px 14px}
 .hint{display:none}
 .tero{padding:10px 10px 12px;gap:8px}
 .simframe{border-radius:14px}
 .lgrid{grid-template-columns:minmax(0,1fr)}
 .wsgrid{grid-template-columns:minmax(0,1fr)}
 .wsside{position:static;order:-1}
 .wsubs{grid-template-columns:repeat(3,minmax(0,1fr))}
 .wlvls{grid-template-columns:repeat(3,minmax(0,1fr))}
 .wqf{width:104px}
 .wqt{font-size:16px}
 .topicl{grid-template-columns:minmax(0,1fr)}
 .qwrap{grid-template-columns:minmax(0,1fr);gap:18px}
 .qhead{padding:10px 14px}
 .qfoot{padding:10px 14px}
 .gq{grid-template-columns:minmax(0,1fr);gap:14px}
 .gfig{max-width:min(420px,48dvh);width:100%;align-self:center;margin:0 auto}
 .gopt{min-height:62px}
}
@media (max-width:520px){
 .slbar .bk span,.slfoot .tk span{display:none}
 .slbar .bk,.slfoot .tk{padding:0 12px!important}
 .slfoot .dots{display:none}
 .slfoot{justify-content:space-between}
 .slfoot #nextBtn{flex:1;margin-left:4px}
 .qfoot .btn.big{min-height:52px;font-size:17px;padding:0 16px}
 .qfoot .btn.sec{padding:0 14px}
 .qfoot .lpv{display:none}
 .qfoot .lsh{display:inline}
 .qfoot{gap:8px}
 .qfoot .btn.big{flex:1;padding:0 12px}
 .wm{font-size:18px}
 .subgrid{grid-template-columns:minmax(0,1fr)}
 .gopts{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
 .gopt{padding:0 12px;font-size:17px}
 .gopt .k{display:none}
 .btn.big{min-height:56px;font-size:18px}
}
@media (max-height:620px) and (min-width:901px){.sl-svg{max-height:calc(100dvh - 200px)}}

/* ---------- Cetak ---------- */
@media print{
 .wsdoc{--tx:#14152B;--mu:#55607A;--surf:#FFFFFF;--surf2:#F4F6FB;--diag:#FFFFFF;--bd:#D5DCE8;--grid:#C9D2E0;--dim:#C3CBDA;--tr:#0284C7;--pa:#EA580C;--pu:#7C3AED;--am:#B45309;--gr:#059669;--pk:#DB2777;--rd:#DC2626;--on:#FFFFFF;color:#14152B;font-family:Inter,sans-serif;font-size:11.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .wsdoc+.wsdoc{break-before:page;page-break-before:always}
 .wshead h1{margin:0 0 4mm;font-family:'Space Grotesk',sans-serif;font-size:15pt}
 .wshead p{margin:-2mm 0 5mm;color:#55607A;font-size:10pt}
 .wsfields{display:flex;gap:6mm;font-size:11pt;margin-bottom:7mm}
 .wsfields span{display:flex;gap:2mm;align-items:flex-end;flex:1}
 .wsfields span:first-child{flex:2.2}
 .wsfields i,.wsans i{flex:1;display:block;border-bottom:1px solid #14152B;height:5mm}
 .wsq{break-inside:avoid;page-break-inside:avoid;margin-bottom:7mm}
 .wsqh{display:flex;gap:2.5mm;align-items:baseline}
 .wsqt{flex:1;line-height:1.5}
 .wslv{font-size:8.5pt;color:#55607A;white-space:nowrap}
 .wsfig{max-width:82mm;margin:3mm 0 2mm 7mm}
 .wsfig.big{max-width:112mm}
 .wsfig.small{max-width:62mm;margin-left:0}
 .wsfig svg{display:block;width:100%;height:auto;border:.3mm solid #D5DCE8;border-radius:2mm}
 .wsfig svg.shp{width:38mm;border:0}
 .wspace{margin:2mm 0 0 7mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 7.6mm,#C9D2E0 7.6mm,#C9D2E0 7.9mm)}
 .sp-m{height:24mm}.sp-s{height:40mm}.sp-k{height:56mm}
 .wsans{margin:3mm 0 0 7mm;display:flex;gap:2mm;align-items:flex-end;width:95mm;font-weight:700}
 .wskq{display:flex;gap:3mm;break-inside:avoid;page-break-inside:avoid;margin-bottom:4mm;font-size:10.5pt}
 .wskq .ka{font-weight:700}
 .wskq .kw{color:#55607A;font-size:9.5pt;margin-top:1mm}
 .wsdoc .vec{border-width:.5mm;padding:0 2mm;border-radius:2mm}
 @page{size:A4 landscape;margin:10mm}
 html,body{height:auto!important;background:#fff!important}
 .app,.toast{display:none!important}
 #print{display:block}
 .ps{--tx:#14152B;--mu:#55607A;--surf:#FFFFFF;--surf2:#F4F6FB;--diag:#FAFBFE;--bd:#D5DCE8;--grid:#E3E8F1;--dim:#C3CBDA;--tr:#0284C7;--pa:#EA580C;--pu:#7C3AED;--am:#B45309;--gr:#059669;--pk:#DB2777;--rd:#DC2626;--on:#FFFFFF;display:block;break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always;color:#14152B;font-family:Inter,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ps:last-child{break-after:auto;page-break-after:auto}
 .ps .pshead{display:flex;justify-content:space-between;font-size:9pt;color:#55607A;border-bottom:1px solid #D5DCE8;padding-bottom:2mm;margin-bottom:4mm}
 .ps .slide{display:grid;grid-template-columns:minmax(0,1fr) 42%;gap:8mm;align-items:start;padding:0;margin:0;max-width:none;width:auto;--fs:13pt}
 .ps .slide.full{display:block}
 .ps .slide.full>div:first-child{margin-bottom:4mm}
 .ps .sl-text{gap:3mm}
 .ps .sl-title{font-size:20pt}
 .ps .sl-fig{display:block;flex:none;width:auto}
 .ps .sl-svg{display:block;width:100%;height:auto;max-height:120mm}
 .ps .sl-table{overflow:visible}
 .ps .sl-table table{min-width:0!important}
 .ps .sl-steps li,.ps .sl-def,.ps .sl-ans,.ps .sl-note{break-inside:avoid}
 .ps .rv.hid{visibility:visible}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="slides.js"></script>
<script src="qv.js"></script>
<script src="ws.js"></script>
<script src="app.js"></script>
</body>
</html>
