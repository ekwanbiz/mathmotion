*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--link)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logoM path{stroke-linecap:round}
/* ---------- Muka depan ---------- */
.splash{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));background-image:linear-gradient(#80808010 1px,transparent 1px),linear-gradient(90deg,#80808010 1px,transparent 1px);background-size:32px 32px;text-align:center}
.biglogo{width:132px;height:132px;border-radius:34px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;box-shadow:0 0 70px #7C7CFF33}
.splash h1{margin:0;font-size:42px;font-weight:900;letter-spacing:-1px}
.splash h1 span{color:var(--accTx)}
.tag{margin:6px 0 0;font-size:19px;font-weight:800}
.sub{margin:6px 0 0;font-size:14px;color:var(--mu)}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:6px;display:block}
.btns{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;font-size:18px;font-weight:900;text-decoration:none;border:0;cursor:pointer}
.btn.pri{background:var(--acc);color:#0B0C18;box-shadow:0 10px 30px #7C7CFF44}
.btn.sec{background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:17px;font-weight:800}
.off{margin:0;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
/* ---------- Utama ---------- */
.home{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);margin-right:auto;min-width:0}
.brand b{font-size:19px;font-weight:900;letter-spacing:-.4px;white-space:nowrap}.brand b span{color:var(--accTx)}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:20px;background:var(--starBg);border:1px solid var(--starBd);font-weight:900;color:var(--star)}
.ib{width:42px;height:42px;flex:none;border-radius:21px;border:1px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);text-decoration:none}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font-weight:600;font-size:16px;outline:none}
.search input::placeholder{color:var(--mu)}
.clear{border:0;background:none;color:var(--mu);font-size:20px;width:34px;height:34px;cursor:pointer}
.cont{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;text-decoration:none;color:var(--tx);border:1.5px solid}
.cont .g{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex:none;color:#0B0C18}
.cont .t{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}.cont .t small{font-size:11px;font-weight:800;letter-spacing:1px}.cont .t b{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn{display:none}
@media(max-width:620px){.tabs .tw{display:none}.tabs .tn{display:inline}}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow)}
.tabs button{height:40px;border:0;border-radius:12px;background:none;color:var(--mu);font-weight:800;font-size:15px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:#0B0C18;font-weight:900}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.card{position:relative;display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:16px;text-decoration:none;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);box-shadow:var(--shadow);min-height:0;overflow:hidden;text-align:left;cursor:pointer;font:inherit}
.card:active{transform:scale(.97)}

.card .bb{font-size:10.5px;font-weight:800;color:var(--mu);letter-spacing:.5px}
.card .nm{font-size:12.5px;font-weight:900;line-height:1.15}
.card .tp{font-size:12px;color:var(--mu);line-height:1.35;display:none}
.card .lrow{display:flex;align-items:center;gap:10px}
.card .lcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.card .lname{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em;line-height:1;color:var(--tx)}
.card .lname span{color:var(--m1)}

.card .lbab{font-size:11px;font-weight:800;line-height:1.25;color:var(--tx)}

.card.soon .gl{background:var(--card2);color:var(--ghost)}

.empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--mu);font-weight:700;text-align:center;padding:20px}

.toast.on{opacity:1;transform:translateX(-50%)}

.pg{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}

.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.how section{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--shadow)}

.how ol{margin:0;padding-left:20px;line-height:1.7}
.note{color:var(--mu);font-size:14px;line-height:1.5;margin:0}

function chapters(t){return BAB[t].map((nm,i)=>{const bab=i+1,app=APPS.find(a=>a.where.some(([tt,b])=>tt===t&&b===bab));return{t,bab,nm,app}})}
function cardHTML(c){
 if(!c.app)return`<div class="card soon" aria-disabled="true" data-soon="${c.bab}"><span class="gl">${c.bab}</span><span class="bb">BAB ${c.bab}</span><span class="nm">${esc(c.nm)}</span><span class="tp">Akan datang</span></div>`;
 const a=c.app,s=starsOf(a);
 if(a.logo)return`<a class="card lg" href="${a.path}" data-app="${a.id}" aria-label="${esc(a.name)}, Tingkatan ${c.t} Bab ${c.bab}, ${esc(c.nm)}"><span class="lrow"><span class="lcol"><img class="lgimg" src="${a.logo}" alt="" width="46" height="46"></span><span class="lbab">Bab ${c.bab} : ${esc(c.nm)}</span></span>${s?`<span class="st">★ ${s}</span>`:''}</a>`;
 return`<a class="card" href="${a.path}" data-app="${a.id}" aria-label="${esc(a.name)}, Tingkatan ${c.t} Bab ${c.bab}, ${esc(c.nm)}"><span class="gl" style="background:${a.col}">${a.glyph}</span><span class="bb">BAB ${c.bab}</span><span class="nm">${a.name}</span><span class="tp">${esc(c.nm)}</span>${s?`<span class="st">★ ${s}</span>`:''}</a>`}
function gridHTML(){
 const q=query.trim().toLowerCase();
 if(q){const res=[];[1,2,3,4,5].forEach(t=>chapters(t).forEach(c=>{const hay=(c.nm+' '+(c.app?c.app.name+' '+c.app.topic+' '+c.app.kw:'')).toLowerCase();if(q.split(/\s+/).every(w=>hay.includes(w)))res.push(c)}));
  return res.length?res.map(cardHTML).join(''):`<div class="empty">Tiada bab ditemui untuk “${esc(query)}”.</div>`}
 return chapters(tab).map(cardHTML).join('')}

function home(){const light=document.documentElement.classList.contains('light');
 return`<main class="home">

  <span class="pill" title="Jumlah bintang daripada semua app">${I.star}<span id="tot">${totalStars()}</span><span class="sr"> bintang</span></span>
  <a class="ib" href="#/pasang" aria-label="Cara pasang di telefon">${I.phone}</a>
  <button class="ib" id="mode" aria-label="${light?'Tukar ke mod gelap':'Tukar ke mod cerah'}">${light?I.moon:I.sun}</button></header>

 <p class="note">Pasang sekali sahaja. Semua app (ALGEBRALAB, CIRCMOTION, GRAPHX dan lain-lain) boleh dibuka dari dalam TerokaMath, termasuk tanpa internet.</p>

function bindHome(){
 document.getElementById('mode').onclick=()=>{const h=document.documentElement,l=!h.classList.contains('light');h.classList.toggle('light',l);LS.set('mathmotion-mode',l?'cerah':'gelap');setTheme();render()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;LS.set('mathmotion-tab',String(tab));render()});
 const q=document.getElementById('q');q.oninput=()=>{const pos=q.selectionStart;query=q.value;render();const n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
 const c=document.getElementById('clr');if(c)c.onclick=()=>{query='';render()};
 document.querySelectorAll('[data-app]').forEach(a=>a.addEventListener('click',()=>LS.set('mathmotion-last',a.dataset.app)));
 document.querySelectorAll('[data-soon]').forEach(d=>d.onclick=()=>toast('Bab '+d.dataset.soon+' akan datang. Nantikan!'))}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function setTheme(){const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=document.documentElement.classList.contains('light')?'#F4F5FB':'#0B0C18'}
function render(){const h=location.hash.replace(/^#/,'')||'/';
 if(h.startsWith('/utama')){app.innerHTML=home();bindHome();document.title='Utama · TerokaMath'}
 else if(h.startsWith('/pasang')){app.innerHTML=pasang();document.title='Cara Pasang · TerokaMath'}
 else{app.innerHTML=splash();document.title='TerokaMath – Simulasi Matematik'}}

setTheme();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
