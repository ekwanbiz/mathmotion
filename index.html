button,input{font:inherit;color:inherit}

/* ---------- Utama (gaya B) ---------- */
.home{max-width:1240px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--h);margin-right:auto;min-width:0}
.brand b{font-size:24px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}.brand b span{color:var(--brandM)}
.ck{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;min-width:46px;padding:0 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--p);font:inherit;font-weight:900;font-size:15px;letter-spacing:.06em;text-decoration:none;cursor:pointer;flex:none}
.ck.sq{padding:0}
.ck:active{transform:translateY(3px);border-bottom-width:2px}
.ck.gm{background:#FFC800;border-color:#D9A600;color:#4A2F00}
@media(max-width:480px){.ck.gm .tx{display:none}.ck.gm{padding:0}.top{gap:6px;padding-left:12px;padding-right:12px}.brand{gap:7px}.brand svg{width:30px;height:30px}.brand b{font-size:19px}.ck{height:40px;min-width:40px;border-radius:12px;border-bottom-width:4px;font-size:13px}.ck svg{width:18px;height:18px}}
@media(max-width:360px){.brand b{font-size:17px}.brand svg{display:none}.ck{height:38px;min-width:38px}}
.hero{text-align:center;padding:22px 16px 6px}
.hero h1{margin:0;font-size:28px;font-weight:900;color:var(--h);line-height:1.15}
.hero p{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--p)}
.tabs{display:flex;justify-content:center;gap:6px;padding:14px 12px}
.tabs button{flex:1 1 0;min-width:0;padding:0;max-width:120px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:16px;border:2px solid var(--line);border-bottom-width:6px;background:var(--card);color:var(--h);font:inherit;cursor:pointer}
.tabs button b{font-size:22px;font-weight:900;line-height:1}.tabs button small{font-size:8.5px;font-weight:800;letter-spacing:.02em}
@media(min-width:420px){.tabs button small{font-size:10px;letter-spacing:.08em}}
.tabs button[aria-selected="true"]{color:#FFFFFF;border-color:rgba(0,0,0,.22)}
.tabs button:active{transform:translateY(4px);border-bottom-width:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:4px 16px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:20px;background:var(--card);border:2px solid var(--line);border-bottom-width:6px;text-decoration:none;text-align:center;color:var(--h);cursor:pointer;font:inherit}
.card:active{transform:translateY(4px);border-bottom-width:2px}
.card .lgimg{width:64px;height:64px;border-radius:18px}
.card .bb{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--bab)}
.card .nm{font-size:14px;font-weight:800;line-height:1.25}
.card .gl{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#0B0C18}
.card .st{position:absolute;top:8px;right:10px;font-size:12px;font-weight:900;color:var(--star)}
.card.soon{border-style:dashed;color:var(--ghost);cursor:default}.card.soon .gl{background:var(--card2);color:var(--ghost)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:8px 24px}.top{padding-left:24px;padding-right:24px}}

 .top{padding:18px 40px}.brand b{font-size:28px}

/* ---------- Cara Pasang ---------- */
.pg{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;background:var(--acc);color:#0B0C18;font-weight:900;text-decoration:none}

.how h2{margin:0 0 8px;font-size:18px}
.how ol{margin:0;padding-left:20px;line-height:1.7}
.note{color:var(--mu);font-size:14px;line-height:1.5;margin:0}

function bindHome(){

 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;LS.set('mathmotion-tab',String(tab));render()});
 document.querySelectorAll('[data-app]').forEach(a=>a.addEventListener('click',()=>LS.set('mathmotion-last',a.dataset.app)));
 document.querySelectorAll('[data-soon]').forEach(d=>d.onclick=()=>toast('Bab '+d.dataset.soon+' akan datang. Nantikan!'))}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function setTheme(){const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=document.documentElement.classList.contains('light')?'#FFFFFF':'#0B0C18'}
function render(){const h=location.hash.replace(/^#/,'')||'/';
 if(h.startsWith('/pasang')){app.innerHTML=pasang();document.title='Cara Pasang · TerokaMath'}
 else{app.innerHTML=home();bindHome();document.title='TerokaMath – Simulasi Matematik'}}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});

setTheme();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
