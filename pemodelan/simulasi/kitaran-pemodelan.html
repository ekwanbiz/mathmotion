<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kitaran Pemodelan · Bab 8</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--sf:#131C2E;--sf3:#0E1626;--bd:#22304A;--tx:#E6EDF7;--mu:#94A3B8;--grid:#1E2A40;--c1:#38BDF8;--c2:#F472B6;--c3:#FBBF24;--ok:#34D399;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:19px;color:var(--c1)}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:10px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.side{min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.5}
.card b.t{display:block;font-size:17px;color:var(--c1);margin-bottom:4px}
.big{font-size:24px;font-weight:800;letter-spacing:.3px}
label{display:block;font-weight:700;font-size:15px;margin:6px 0 2px}
input[type=range]{width:100%;height:34px;accent-color:var(--c1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--bd);background:var(--sf3);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;min-height:40px}
.chips button.on{background:var(--c1);color:#0B1220;border-color:var(--c1)}
@media (max-width:760px){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.card{padding:9px 12px;font-size:14px}.big{font-size:19px}.top h1{font-size:16px}label{margin:2px 0 0}input[type=range]{height:28px}}
</style>
</head>
<body>
<div id="backAL" style="padding:calc(12px + env(safe-area-inset-top)) 12px 0;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#38BDF8;color:#0B1220;border-radius:14px;padding:10px 20px;font:900 16px Inter,system-ui,sans-serif;text-decoration:none">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
<div class="top"><h1>Kitaran Pemodelan</h1><span id="sndslot" style="display:flex"></span></div>
<div class="main">
<div class="stage"><svg id="sv" viewBox="0 0 600 420" aria-label="Kitaran enam langkah pemodelan matematik"></svg></div>
<div class="side">
<div class="card"><b class="t">Pilih masalah</b><div class="chips" id="ex"></div>
<label for="p"><span id="pl"></span> = <span id="pv"></span></label><input id="p" type="range"></div>
<div class="card" style="flex:1;min-height:0;overflow:auto"><div class="big" id="st"></div><div id="tx"></div>
<div class="chips" style="margin-top:8px"><button id="prev">◀ Sebelum</button><button id="next" class="on">Seterusnya ▶</button></div></div>
</div></div></div>
<script>const $=id=>document.getElementById(id);const snd=n=>{if(window.FX)FX.play&&FX.play(n)};
const nf=v=>{const r=Math.round(v*100)/100;const s=(Object.is(r,-0)?0:r).toString();return s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const T=(x,y,t,c,s=16,a='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="700" text-anchor="${a}" dominant-baseline="middle" font-family="Inter,sans-serif">${t}</text>`;
const L=(x1,y1,x2,y2,c,w=2,d='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${d?`stroke-dasharray="${d}"`:''} stroke-linecap="round"/>`;

const LS=['Kenal pasti masalah','Andaian & pemboleh ubah','Aplikasi matematik','Tentusahkan & tafsir','Perhalusi model','Laporkan dapatan'];
const LC=['#38BDF8','#A78BFA','#FB923C','#34D399','#F472B6','#FBBF24'];
const EX=[
 {n:'Sewa basikal',pl:'Wang Aina (RM)',min:8,max:50,st:1,v:26,f:B=>{const t=Math.floor((B-5)/3),r=B-(3*t+5);return[
  `Aina ada RM${B}. Sewa basikal: caj asas RM5 + RM3 sejam. Berapa jam maksimum dia boleh menyewa?`,
  `Andaian: kadar tetap, tiada caj lain, sewa ikut jam penuh.<br>Pemboleh ubah: <b>t</b> = masa (jam), <b>C</b> = kos (RM).`,
  `Model linear: <b>C = 3t + 5</b><br>3t + 5 ≤ ${B} → t ≤ ${nf((B-5)/3)}`,
  `t mesti nombor bulat → t = ${t}.<br>Semak: 3(${t}) + 5 = RM${3*t+5} ≤ RM${B} ✓ ${r?`(baki RM${r})`:''}`,
  `Jika ada caj insurans RM2, model diperhalusi: C = 3t + 7 → t = ${Math.max(0,Math.floor((B-7)/3))} jam.`,
  `Laporan: Aina boleh menyewa basikal selama <b>${t} jam</b>.`]}},
 {n:'Lawatan bas',pl:'Bilangan peserta',min:50,max:400,st:5,v:210,f:n=>{const b=Math.ceil(n/44);return[
  `${n} orang akan menyertai lawatan. Setiap bas memuatkan 44 orang. Berapa bas perlu disewa?`,
  `Andaian: semua bas sama saiz; setiap tempat duduk digunakan.<br>Pemboleh ubah: <b>b</b> = bilangan bas.`,
  `Model: <b>44b ≥ ${n}</b> → b ≥ ${nf(n/44)}`,
  `Bilangan bas mesti nombor bulat → b = ${b}. Semak: 44 × ${b} = ${44*b} ≥ ${n} ✓`,
  `Jika 2 guru pengiring setiap bas: 44b ≥ ${n} + 2b → b = ${Math.ceil(n/42)}.`,
  `Laporan: sewa <b>${b} buah bas</b>.`]}},
 {n:'Bakteria',pl:'Masa t (jam)',min:0,max:8,st:1,v:5,f:t=>{const N=200*2**t;return[
  `Terdapat 200 bakteria. Bilangannya berganda dua setiap jam. Berapakah bilangan bakteria selepas ${t} jam?`,
  `Andaian: makanan & ruang mencukupi; tiada bakteria mati.<br>Pemboleh ubah: <b>t</b> = masa (jam), <b>N</b> = bilangan bakteria.`,
  `Model eksponen: <b>N = 200(2ᵗ)</b><br>N = 200 × 2^${t} = ${nf(N)}`,
  `Nisbah berturutan tetap = 2 ✓. Nilai positif dan bertambah – munasabah.`,
  `Ruang terhad: untuk t besar, pertumbuhan perlahan. Model perlu diperhalusi (contoh: had maksimum).`,
  `Laporan: selepas ${t} jam terdapat <b>${nf(N)}</b> bakteria.`]}}];
const S={e:0,s:0,v:26};
$('ex').innerHTML=EX.map((e,i)=>`<button data-i="${i}">${e.n}</button>`).join('');
$('ex').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.e=+b.dataset.i;const x=EX[S.e];S.v=x.v;S.s=0;setR();snd('ketik');draw()};
function setR(){const x=EX[S.e],p=$('p');p.min=x.min;p.max=x.max;p.step=x.st;p.value=S.v;$('pl').textContent=x.pl}
$('p').oninput=e=>{S.v=+e.target.value;draw()};
$('next').onclick=()=>{S.s=(S.s+1)%6;snd('ketik');draw()};$('prev').onclick=()=>{S.s=(S.s+5)%6;snd('ketik');draw()};
const sv=$('sv');const CX=300,CY=215,R=140;
const LS2=[['Kenal pasti','masalah'],['Andaian &','pemboleh ubah'],['Aplikasi','matematik'],['Tentusahkan','& tafsir'],['Perhalusi','model'],['Laporkan','dapatan']];
sv.addEventListener('pointerdown',e=>{const n=e.target.closest('[data-s]');if(n){S.s=+n.dataset.s;snd('ketik');draw()}});
function draw(){const x=EX[S.e],txt=x.f(S.v);
 document.querySelectorAll('#ex button').forEach(b=>b.classList.toggle('on',+b.dataset.i===S.e));$('pv').textContent=nf(S.v);
 let s=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 7"/>`;
 for(let i=0;i<6;i++){const a=(i+.5)*Math.PI/3,ax=CX+R*Math.sin(a),ay=CY-R*Math.cos(a),d=a+Math.PI/2;
  s+=`<path d="M${ax+10*Math.sin(d)} ${ay-10*Math.cos(d)} L${ax-10*Math.sin(d)+8*Math.sin(a)} ${ay+10*Math.cos(d)-8*Math.cos(a)} L${ax-10*Math.sin(d)-8*Math.sin(a)} ${ay+10*Math.cos(d)+8*Math.cos(a)}Z" fill="#94A3B8"/>`}
 if(S.s===4){s+=`<path d="M${CX+R*Math.sin(4*Math.PI/3)*.62} ${CY-R*Math.cos(4*Math.PI/3)*.62} Q${CX} ${CY+30} ${CX+R*Math.sin(2*Math.PI/3)*.62} ${CY-R*Math.cos(2*Math.PI/3)*.62}" fill="none" stroke="#F472B6" stroke-width="4" stroke-dasharray="7 6"/>`}
 for(let i=0;i<6;i++){const a=i*Math.PI/3,x0=CX+R*Math.sin(a),y0=CY-R*Math.cos(a),on=i===S.s,done=i<S.s;
  s+=`<g data-s="${i}" style="cursor:pointer"><circle cx="${x0}" cy="${y0}" r="${on?40:32}" fill="${on||done?LC[i]:'#0E1626'}" stroke="${LC[i]}" stroke-width="4"/>`+T(x0,y0,i+1,on||done?'#0B1220':LC[i],26)+`</g>`;
  const lx=x0+(Math.sin(a)>.1?48:Math.sin(a)<-.1?-48:0),ly=y0+(Math.abs(Math.sin(a))<.1?(Math.cos(a)>0?0:0):0);
  if(Math.abs(Math.sin(a))>.1){const c=on?LC[i]:'#94A3B8',an=Math.sin(a)>0?'start':'end';s+=T(lx,y0-9,LS2[i][0],c,14,an)+T(lx,y0+9,LS2[i][1],c,14,an)}}
 s+=T(CX,CY-34,x.n,'#E6EDF7',20)+T(CX,CY-8,'Langkah '+(S.s+1)+' / 6',LC[S.s],16)+T(CX,16,LS[0],S.s===0?LC[0]:'#94A3B8',14)+T(CX,408,LS[3],S.s===3?LC[3]:'#94A3B8',14);
 sv.innerHTML=s;
 $('st').innerHTML=`<span style="color:${LC[S.s]}">${S.s+1}. ${LS[S.s]}</span>`;$('tx').innerHTML=txt[S.s];}
setR();draw();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
</body></html>
