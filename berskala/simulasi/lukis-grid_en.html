<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Draw on Grid · Chapter 4</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0B1220;--sf:#131C2E;--sf2:#1A2540;--sf3:#0E1626;--bd:#22304A;--bd2:#2E3F5E;--tx:#E6EDF7;--mu:#94A3B8;--mu2:#64748B;--c1:#34D399;--c1t:#05281c;--c2:#FBBF24;--c3:#F472B6;--ok:#34D399;--bad:#F87171;
 --surface:#131C2E;--border:#2E3F5E;--text:#E6EDF7;--muted:#94A3B8;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:11px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:var(--c1t)}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.stage svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-height:74px;line-height:1.5;font-size:15px}
.info b.t{display:block;font-size:19px;color:var(--c1);margin-bottom:2px}
.info .tip{color:var(--mu);font-size:13px;margin-top:4px}
.info .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700}
.info .row span b{color:var(--c2)}
.info .row span b.o{color:var(--c1)}
.info .row span b.p{color:var(--c3)}
.info .ok{color:var(--ok);font-weight:800}.info .no{color:var(--bad);font-weight:800}
.info .eq{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);font-weight:700}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctrl.two{grid-template-columns:1fr 1fr}
.ctrl.three{grid-template-columns:1fr 1fr 1fr}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:12px 4px;font-weight:800;font-size:15px}
.chip.on{background:var(--c1);border-color:var(--c1);color:var(--c1t)}
.chip.ok{border-color:var(--ok);background:#34d39922}.chip.no{border-color:var(--bad);background:#f8717122}
.big{background:var(--c1);border:0;color:var(--c1t);border-radius:13px;padding:13px 6px;font-weight:900;font-size:15px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
.big:disabled{opacity:.45;cursor:not-allowed}
.nextb{margin-top:8px;background:var(--c1);border:0;color:var(--c1t);border-radius:11px;padding:9px 16px;font-weight:900}
.slider{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:8px 14px}
.slider label{font-weight:800;font-size:14px;color:var(--mu);white-space:nowrap}
.slider output{font-weight:900;font-size:18px;color:var(--c1);min-width:84px;text-align:right;white-space:nowrap}
.slider input{flex:1;accent-color:var(--c1);height:30px;touch-action:pan-x}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:18px}.ctrl{grid-area:c;align-self:end}
 .ctrl,.ctrl.three{grid-template-columns:1fr 1fr}
 .info b.t{font-size:24px}
 .info .eq{font-size:17px}
}
@media(max-height:620px){.wrap{gap:7px;padding-top:8px}.modes button{padding:8px 4px;font-size:14px}.chip{padding:9px 3px;font-size:14px}.info{padding:8px 11px;min-height:62px;font-size:14px}.info b.t{font-size:17px}.big{padding:10px 4px}}
@media(max-width:420px){.chip,.big{font-size:13.5px}.modes button{font-size:13px;padding:10px 3px}.info{font-size:14px;padding:10px 12px}.info b.t{font-size:17px}.ctrl{gap:6px}.chip{padding:10px 3px}}
</style>
<style id="infofix">@media(max-width:899px),(max-aspect-ratio:4/3){.info{height:150px;overflow:auto}}@media(max-height:620px){.info{height:110px}}</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(14px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#8F9BFF;color:#10133a;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #8f9bff44">&#8592; Back</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="group" aria-label="Choose a scale" id="skala"></div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" viewBox="0 0 600 400" aria-label="Object grid and drawing grid"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl">
  <button class="big alt" id="undo">↶ Undo</button>
  <button class="big alt" id="clr">Clear</button>
  <button class="big alt" id="baru">New shape</button>
  <button class="big" id="semak">Check ✓</button>
 </div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),info=document.getElementById('info'),stage=document.getElementById('stage');
const C=30,TC=12,TR=11;                              // 1 petak = 1 cm; grid lukisan 12 x 11 petak
const C1='#34D399',C2='#FBBF24',C3='#38BDF8',BAD='#F87171',MU='#94A3B8',TX='#E6EDF7',NAV='#0E1626';
const SHAPES=[[[0,0],[3,0],[3,2],[0,2]],[[0,0],[2,0],[2,1],[1,1],[1,2],[0,2]],[[0,0],[0,2],[3,2]],[[1,0],[2,1],[2,3],[0,3],[0,1]],
 [[0,0],[3,0],[3,1],[2,1],[2,2],[1,2],[1,1],[0,1]],[[1,0],[2,0],[3,2],[0,2]],[[0,0],[2,0],[3,1],[2,2],[0,2]],[[0,0],[1,0],[1,1],[3,1],[3,2],[0,2]],[[0,1],[1,0],[2,1],[1,2]]];
// skala: [teks, faktor objek, faktor lukisan, peraturan]
const SK=[['1 : 1/2',1,2,'Scale 1 : 1/2 → every side of the drawing = 2 × side of the object'],['1 : 1/3',1,3,'Scale 1 : 1/3 → every side of the drawing = 3 × side of the object'],['1 : 2',2,1,'Scale 1 : 2 → every side of the drawing = side of the object ÷ 2'],['1 : 1',2,2,'Scale 1 : 1 → the drawing is the same size as the object']];
let S={sk:0,sh:0,pts:[],closed:false,res:null,show:false,score:0,tot:0};
const snd=n=>{if(window.FX)FX.play(n)};
function T(x,y,t,c=TX,s=15,a='middle'){return `<text x="${x}" y="${y}" fill="${c}" font-size="${s}" font-weight="800" text-anchor="${a}" dominant-baseline="middle" font-family="Inter,Arial,sans-serif" paint-order="stroke" stroke="${NAV}" stroke-width="4" stroke-linejoin="round">${t}</text>`}
const obj=()=>SHAPES[S.sh].map(([i,j])=>[i*SK[S.sk][1],j*SK[S.sk][1]]);
const want=()=>SHAPES[S.sh].map(([i,j])=>[i*SK[S.sk][2]+1,j*SK[S.sk][2]+1]);
let L={};                                           // susun atur
function layout(){
 const o=obj(),ow=Math.max(...o.map(p=>p[0]))+2,oh=Math.max(...o.map(p=>p[1]))+2;
 const r=stage.getBoundingClientRect(),portrait=r.height>r.width*1.05;
 if(portrait){const W=TC*C+20,co=20;L={co,ox:(W-ow*co)/2,oy:28,ow,oh,tx:10,ty:28+oh*co+40,W,H:28+oh*co+40+TR*C+10}}
 else{L={co:C,ox:10,oy:(TR*C-oh*C)/2+28,ow,oh,tx:10+ow*C+44,ty:28,W:10+ow*C+44+TC*C+10,H:28+TR*C+10}}
 svg.setAttribute('viewBox',`0 0 ${L.W} ${L.H}`)}
function gridAt(x,y,cols,rows,c){let g=`<rect x="${x}" y="${y}" width="${cols*c}" height="${rows*c}" fill="#ffffff05" stroke="#64748B" stroke-width="2"/>`;
 for(let i=1;i<cols;i++)g+=`<line x1="${x+i*c}" y1="${y}" x2="${x+i*c}" y2="${y+rows*c}" stroke="#334155" stroke-width="1.2"/>`;
 for(let j=1;j<rows;j++)g+=`<line x1="${x}" y1="${y+j*c}" x2="${x+cols*c}" y2="${y+j*c}" stroke="#334155" stroke-width="1.2"/>`;return g}
const P=(bx,by,[i,j],c=C)=>[bx+i*c,by+j*c];
function sideLabels(pts,bx,by,col,c=C){
 let g='';const n=pts.length;
 pts.forEach((a,k)=>{const b=pts[(k+1)%n];if(a[0]!==b[0]&&a[1]!==b[1])return;const len=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
  let nx=(b[1]-a[1])/len,ny=-(b[0]-a[0])/len;const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];if(inside([m[0]+nx*.2,m[1]+ny*.2],pts)){nx=-nx;ny=-ny}
  const [x,y]=P(bx,by,m,c);g+=T(x+nx*15,y+ny*13,len,col,13,nx>0?'start':nx<0?'end':'middle')});return g}
function inside(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c}return c}
function render(){
 layout();const o=obj(),w=want();
 const co=L.co;let g=T(L.ox+L.ow*co/2,L.oy-14,'Object (1 square = 1 cm)',C3,14)+gridAt(L.ox,L.oy,L.ow,L.oh,co);
 g+=`<polygon points="${o.map(p=>P(L.ox+co,L.oy+co,p,co).join(',')).join(' ')}" fill="${C3}33" stroke="${C3}" stroke-width="3.5" stroke-linejoin="round"/>`+sideLabels(o,L.ox+co,L.oy+co,C3,co);
 g+=T(L.tx+TC*C/2,L.ty-14,`Draw here · scale ${SK[S.sk][0]}`,C1,14)+gridAt(L.tx,L.ty,TC,TR,C);
 if(S.show)g+=`<polygon points="${w.map(p=>P(L.tx,L.ty,p).join(',')).join(' ')}" fill="none" stroke="${C2}" stroke-width="3" stroke-dasharray="8 6"/>`;
 if(!S.pts.length){const [x,y]=P(L.tx,L.ty,w[0]);g+=`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${C2}" stroke-width="2.5" stroke-dasharray="4 3"/>`+T(x+8,y-16,'Mula',C2,13,'start')}
 const col=S.res===false?BAD:C1;
 if(S.pts.length){const pp=S.pts.map(p=>P(L.tx,L.ty,p).join(',')).join(' ');
  g+=S.closed?`<polygon points="${pp}" fill="${col}33" stroke="${col}" stroke-width="4" stroke-linejoin="round"/>`:`<polyline points="${pp}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  S.pts.forEach((p,k)=>{const [x,y]=P(L.tx,L.ty,p);g+=`<circle cx="${x}" cy="${y}" r="${k===0?8:6}" fill="${k===0?C2:col}" stroke="${NAV}" stroke-width="2"/>`});
  if(S.closed)g+=sideLabels(S.pts,L.tx,L.ty,col)}
 svg.innerHTML=g;showInfo()}
function showInfo(){
 const sk=SK[S.sk],n=S.pts.length;let h=`<b class="t">Draw the scale drawing with a scale of ${sk[0]}</b><div class="eq">${sk[3]}</div>`;
 if(S.res===true)h+=`<div class="ok" style="margin-top:6px">✓ Correct! The shape is the same and every side follows the scale ${sk[0]}.</div>`;
 else if(S.res===false)h+=`<div class="no" style="margin-top:6px">✗ ${S.why}</div><button class="nextb" id="tj">Show answer</button>`;
 else if(n===0)h+=`<div class="tip">Tap the grid intersections to place the vertices one by one. Tap the first vertex again to close the shape.</div>`;
 else{const a=S.pts[n-2],b=S.pts[n-1];h+=`<div class="tip">Vertices: ${n}${a?` · last side: ${+Math.hypot(b[0]-a[0],b[1]-a[1]).toFixed(2)} cm`:''}${S.closed?' · shape closed, press Check':' · tap the first vertex to close'}</div>`}
 h+=`<div class="tip">Score: ${S.score}/${S.tot}</div>`;
 info.innerHTML=h;const tj=document.getElementById('tj');if(tj)tj.onclick=()=>{S.show=true;render()}}
/* ---------- semak ---------- */
function simplify(p){let a=p.slice();let ch=true;while(ch&&a.length>3){ch=false;for(let i=0;i<a.length;i++){const q=a[(i+a.length-1)%a.length],r=a[i],s=a[(i+1)%a.length];if((r[0]-q[0])*(s[1]-q[1])-(r[1]-q[1])*(s[0]-q[0])===0){a.splice(i,1);ch=true;break}}}return a}
function norm(p){const mx=Math.min(...p.map(v=>v[0])),my=Math.min(...p.map(v=>v[1]));return p.map(([x,y])=>[x-mx,y-my])}
function same(a,b){if(a.length!==b.length)return false;const n=a.length,k=x=>x.join(',');
 for(const dir of [1,-1])for(let s=0;s<n;s++){let ok=true;for(let i=0;i<n;i++){if(k(a[i])!==k(b[(s+dir*i+n*2)%n])){ok=false;break}}if(ok)return true}return false}
function semak(){
 if(S.pts.length<3){info.querySelector('.tip').textContent='Place at least 3 vertices first.';return}
 S.closed=true;const u=norm(simplify(S.pts)),w=norm(simplify(want()));S.tot++;
 if(same(u,w)){S.res=true;S.score++;snd('menang');if(window.FX)FX.stars(stage,16)}
 else{S.res=false;snd('salah');const uw=Math.max(...u.map(p=>p[0])),uh=Math.max(...u.map(p=>p[1])),ww=Math.max(...w.map(p=>p[0])),wh=Math.max(...w.map(p=>p[1]));
  S.why=uw!==ww||uh!==wh?`The size is not right yet: width ${uw} cm × height ${uh} cm, it should be ${ww} cm × ${wh} cm.`:`The size is right but the shape is different. Check every side and vertex.`}
 render()}
/* ---------- input ---------- */
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('pointerdown',e=>{
 if(S.res!==null)return;const p=svgPt(e),i=Math.round((p.x-L.tx)/C),j=Math.round((p.y-L.ty)/C);
 if(i<0||j<0||i>TC||j>TR||Math.hypot(p.x-(L.tx+i*C),p.y-(L.ty+j*C))>C*0.48)return;e.preventDefault();
 if(S.closed)return;const n=S.pts.length;
 if(n&&S.pts[n-1][0]===i&&S.pts[n-1][1]===j)return;
 if(n>=3&&S.pts[0][0]===i&&S.pts[0][1]===j){S.closed=true;snd('langkah');render();return}
 if(S.pts.some(q=>q[0]===i&&q[1]===j))return;
 S.pts.push([i,j]);snd('ketik');render()});
svg.addEventListener('dragstart',e=>e.preventDefault());
document.getElementById('undo').onclick=()=>{if(S.res!==null){S.res=null;S.show=false}if(S.closed)S.closed=false;else S.pts.pop();render()};
document.getElementById('clr').onclick=()=>{S.pts=[];S.closed=false;S.res=null;S.show=false;render()};
document.getElementById('baru').onclick=()=>{let k;do k=Math.floor(Math.random()*SHAPES.length);while(k===S.sh);S.sh=k;S.pts=[];S.closed=false;S.res=null;S.show=false;render()};
document.getElementById('semak').onclick=semak;
const skb=document.getElementById('skala');
function setSk(){skb.innerHTML=SK.map((s,i)=>`<button class="${i===S.sk?'on':''}" data-s="${i}">${s[0]}</button>`).join('');
 skb.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.sk=+b.dataset.s;S.pts=[];S.closed=false;S.res=null;S.show=false;setSk();render()})}
setSk();render();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,80)});
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
