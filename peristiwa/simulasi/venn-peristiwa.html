<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Venn Peristiwa · Bab 9</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('../../teras/fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('../../teras/fonts/inter-latin-700-normal.woff2') format('woff2')}
:root{--bg:#0E0A1C;--sf:#181230;--sf2:#211941;--sf3:#120D24;--bd:#2E2652;--bd2:#3D3368;--tx:#F1EDFF;--mu:#B3A9DA;--mu2:#7F76A8;--c1:#B794FF;--c2:#FFB547;--a:#4FC3FF;--b:#FF7AB6;--ok:#3DDC84;--bad:#FF6B7A;
 font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px}
button,select,input{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-width:1200px;width:100%;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.modes{flex:1;display:flex;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px}
.modes button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:15px;padding:10px 6px;border-radius:12px}
.modes button.on{background:var(--c1);color:#1d0d45}
.top .snd-btn{height:auto;min-height:44px;border-radius:16px}
.stage{min-height:0;background:var(--sf3);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.info{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;line-height:1.45;font-size:15px;min-height:84px}
.info b.t{display:block;font-size:17px;color:var(--c1);margin-bottom:2px}
.info b.t.ok{color:var(--ok)}.info b.t.no{color:var(--c2)}
.info .f{font-weight:800;font-size:16px}.info .f b{color:var(--c2)}
.info .tip{color:var(--mu);font-size:13px;margin-top:3px}
.info .ex{font-weight:700;font-size:14px;color:var(--mu)}.info .ex b{color:var(--ok)}
.ctrl{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}
.chip{background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:10px 3px;font-weight:800;font-size:14px}
.chip.on{background:var(--c2);border-color:var(--c2);color:#2a1a03}
.sel{display:flex;align-items:center;gap:6px;background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:4px 4px 4px 10px;font-weight:900;min-width:0}
.sel select{flex:1;min-width:0;background:var(--sf2);border:0;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px}
.sl{display:flex;align-items:center;gap:8px;background:var(--sf);border:2px solid var(--bd2);border-radius:13px;padding:4px 10px;font-weight:800;font-size:14px;color:var(--mu)}
.sl input{flex:1;accent-color:var(--c1);height:28px}.sl b{color:var(--c1);min-width:24px;text-align:right}
.big{background:var(--c2);border:0;color:#2a1a03;border-radius:13px;padding:12px 6px;font-weight:900;font-size:15.5px}
.big.alt{background:var(--sf);border:2px solid var(--bd2);color:var(--tx)}
.hide{display:none!important}
@media(min-width:900px) and (min-aspect-ratio:4/3){
 .wrap{grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"m m" "s i" "s c"}
 .top{grid-area:m}.stage{grid-area:s}.info{grid-area:i;align-self:start;font-size:16px;padding:16px 18px}.ctrl{grid-area:c;align-self:end}
 .info b.t{font-size:21px}.info .f{font-size:18px}.info .ex{font-size:15px}
}
@media(max-height:700px){.wrap{gap:7px;padding-top:7px}.modes button{padding:8px 4px;font-size:14px}.info{padding:8px 11px;font-size:13.5px;min-height:70px}.info .f{font-size:14.5px}.info b.t{font-size:15px}.big{padding:9px 4px}.chip{padding:7px 3px}}
@media(max-width:420px){.chip,.big{font-size:13px}.modes button{font-size:13.5px;padding:9px 3px}.sel select{font-size:13px}}
</style>
<style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
</head>
<body>
<div id="backAL" style="padding:calc(12px + env(safe-area-inset-top)) 12px 0;position:relative;z-index:50;max-width:1200px;width:100%;margin:0 auto"><a href="../#/teroka" style="display:inline-flex;align-items:center;gap:10px;background:#B794FF;color:#1d0d45;border-radius:14px;padding:11px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #b794ff44">&#8592; Kembali</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script>
<div class="wrap">
 <div class="top">
  <div class="modes" role="tablist" aria-label="Mod">
   <button data-m="kad" class="on" role="tab">🃏 Kad nombor</button>
   <button data-m="cabar" role="tab">❓ Teka jenis</button>
  </div>
  <span id="sndslot" style="display:flex"></span>
 </div>
 <div class="stage" id="stage"><svg id="svg" aria-label="Gambar rajah Venn peristiwa A dan B"></svg></div>
 <div class="info" id="info" aria-live="polite"></div>
 <div class="ctrl" id="ctrl">
  <div class="row two" id="evs">
   <label class="sel" style="color:var(--a)">A<select id="sa" aria-label="Peristiwa A"></select></label>
   <label class="sel" style="color:var(--b)">B<select id="sb" aria-label="Peristiwa B"></select></label>
  </div>
  <div class="sl" id="slw"><span>Kad 1 hingga</span><input type="range" id="sn" min="6" max="20" value="12" aria-label="Bilangan kad"><b id="snv">12</b></div>
  <div class="row" id="reg">
   <button class="chip" data-r="A">A</button><button class="chip" data-r="B">B</button><button class="chip" data-r="I">A ∩ B</button><button class="chip on" data-r="U">A ∪ B</button>
  </div>
  <div class="row two" id="ans"><button class="big" id="cabut">🎴 Cabut kad</button><button class="big alt" id="c20">× 20</button></div>
 </div>
</div>
<script>
'use strict';
const svg=document.getElementById('svg'),stage=document.getElementById('stage'),info=document.getElementById('info');
const CA='#4FC3FF',CB='#FF7AB6',GOLD='#FFB547',MU='#B3A9DA',TX='#F1EDFF',OK='#3DDC84';
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d)=>{if(!n)return'0';const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d};
const snd=n=>{if(window.FX)FX.play(n)};
const prime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const EV=[['Nombor genap',n=>n%2===0],['Nombor ganjil',n=>n%2===1],['Nombor perdana',prime],['Gandaan 3',n=>n%3===0],['Gandaan 4',n=>n%4===0],['Gandaan 5',n=>n%5===0],['Gandaan 6',n=>n%6===0],['Gandaan 7',n=>n%7===0],['Faktor bagi 12',n=>12%n===0],['Faktor bagi 20',n=>20%n===0],['Kuasa dua sempurna',n=>Math.round(Math.sqrt(n))**2===n],['Lebih besar daripada 10',n=>n>10],['Kurang daripada 5',n=>n<5]];
let S={m:'kad',N:12,A:0,B:3,reg:'U',sep:0,draws:0,hits:0,last:null,q:null,score:0,tot:0};
const sets=()=>{const all=[];for(let i=1;i<=S.N;i++)all.push(i);const A=all.filter(EV[S.A][1]),B=all.filter(EV[S.B][1]);return{all,A,B,I:A.filter(x=>B.includes(x)),U:all.filter(x=>A.includes(x)||B.includes(x)),oA:A.filter(x=>!B.includes(x)),oB:B.filter(x=>!A.includes(x)),O:all.filter(x=>!A.includes(x)&&!B.includes(x))}};
const inReg=(x,s)=>({A:s.A,B:s.B,I:s.I,U:s.U}[S.reg]).includes(x);
const T=(x,y,s,c=TX,z=15,w=800,a='middle')=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${c}" font-size="${z.toFixed(1)}" font-weight="${w}" text-anchor="${a}" dominant-baseline="middle" font-family="Inter,Arial,sans-serif" pointer-events="none">${s}</text>`;
let anim=null,curSep=null;
function draw(){
 const w=stage.clientWidth||360,h=stage.clientHeight||360;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 const s=sets(),bx=8,by=8,bw=w-16,bh=h-16;
 const R=Math.min(bh*.33,bw*.25),cy=by+bh*.45,cx=bx+bw/2;
 const hid=S.m==='cabar'&&S.q&&!S.q.done,target=s.I.length||hid?R*.95:R*2.25;if(curSep===null)curSep=target;
 const d=curSep,xa=cx-d/2,xb=cx+d/2;
 let g=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="16" fill="none" stroke="${MU}" stroke-width="2"/>`+T(bx+16,by+18,'S',TX,18,900);
 const sh=hid?'':S.reg;
 g+=`<defs><clipPath id="ca"><circle cx="${xa}" cy="${cy}" r="${R}"/></clipPath></defs>`;
 if(sh==='A'||sh==='U')g+=`<circle cx="${xa}" cy="${cy}" r="${R}" fill="${sh==='U'?GOLD:CA}" fill-opacity=".28"/>`;
 if(sh==='B'||sh==='U')g+=`<circle cx="${xb}" cy="${cy}" r="${R}" fill="${sh==='U'?GOLD:CB}" fill-opacity=".28"/>`;
 if(sh==='I')g+=`<circle cx="${xb}" cy="${cy}" r="${R}" fill="${GOLD}" fill-opacity=".45" clip-path="url(#ca)"/>`;
 g+=`<circle cx="${xa}" cy="${cy}" r="${R}" fill="none" stroke="${CA}" stroke-width="3.5"/><circle cx="${xb}" cy="${cy}" r="${R}" fill="none" stroke="${CB}" stroke-width="3.5"/>`;
 g+=T(xa-R*.7,cy-R*1.02,'A',CA,20,900)+T(xb+R*.7,cy-R*1.02,'B',CB,20,900);
 const fz=Math.max(12,Math.min(19,R*.2));
 const place=(items,xc,yc,wd,hmax)=>{const n=items.length;if(!n)return'';const per=Math.max(1,Math.min(Math.floor(wd/(fz*1.9)),Math.ceil(Math.sqrt(n*1.3)))),rows=Math.ceil(n/per),lh=Math.min(fz*1.5,hmax/rows);let o='';
  items.forEach((x,k)=>{const r=Math.floor(k/per),c=k%per,inr=Math.min(per,n-r*per),X=xc+(c-(inr-1)/2)*fz*1.9,Y=yc+(r-(rows-1)/2)*lh,on=inReg(x,s),hl=S.last===x;
   if(hl)o+=`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${fz*.9}" fill="none" stroke="#fff" stroke-width="3"/>`;
   o+=T(X,Y+1,x,on?GOLD:TX,fz,on?900:700)});return o};
 const ov=Math.max(0,2*R-d);
 if(hid){g+=T(xa-R*.45,cy,'?',MU,R*.35,900)+T(cx,cy,'?',MU,R*.3,900)+T(xb+R*.45,cy,'?',MU,R*.35,900)+T(cx,by+bh-18,`S = {1, 2, 3, …, ${S.N}}`,TX,Math.max(13,fz*.9),800)}
 else if(ov>0){g+=place(s.oA,xa-ov/2-(R-ov/2)*.08- R*.05,cy,R*1.05-ov*.2,R*1.5)+place(s.oB,xb+ov/2+R*.13,cy,R*1.05-ov*.2,R*1.5)+place(s.I,cx,cy,Math.max(fz*2,ov*.8),R*1.4)}
 else{g+=place(s.oA,xa,cy,R*1.4,R*1.5)+place(s.oB,xb,cy,R*1.4,R*1.5)}
 // di luar A dan B
if(!hid){const oy=cy+R+(by+bh-cy-R)/2;g+=place(s.O,cx,Math.min(oy,by+bh-fz),bw-40,Math.max(fz,by+bh-cy-R-10))}
 if(Math.abs(curSep-target)>0.5){cancelAnimationFrame(anim);anim=requestAnimationFrame(()=>{curSep+=(target-curSep)*.18;draw()})}
 svg.innerHTML=g;
}
function showInfo(){
 const s=sets(),n=S.N,nA=s.A.length,nB=s.B.length,nI=s.I.length,nU=s.U.length,ex=nI===0;
 if(S.m==='cabar'&&S.q&&!S.q.done){info.innerHTML=`<b class="t">A dan B: saling eksklusif atau tidak?</b><div class="f">A = ${EV[S.A][0].toLowerCase()}, B = ${EV[S.B][0].toLowerCase()} (kad 1 hingga ${n})</div><div class="tip">Petua: cari unsur sepunya. Skor: ${S.score}/${S.tot}</div>`;return}
 const set=a=>a.length?'{'+a.join(', ')+'}':'∅';
 let t=`<b class="t ${ex?'ok':'no'}">${ex?'✓ Saling eksklusif: A ∩ B = ∅':'Tidak saling eksklusif: A ∩ B = '+set(s.I)}</b>`;
 if(S.m==='cabar'&&S.q&&S.q.done)t=`<b class="t ${S.q.ok?'ok':'no'}">${S.q.ok?'✓ Betul!':'✗ Belum tepat.'} ${ex?'Saling eksklusif (A ∩ B = ∅)':'Tidak saling eksklusif (A ∩ B = '+set(s.I)+')'}</b>`;
 t+=`<div class="tip" style="margin:0 0 3px;color:#DCD5FA">A = ${set(s.A)} · B = ${set(s.B)}</div>`;
 t+=`<div class="f">P(A ∪ B) = ${nA}/${n} + ${nB}/${n}${ex?'':` − ${nI}/${n}`} = ${nU}/${n}${fr(nU,n)!==nU+'/'+n?' = <b>'+fr(nU,n)+'</b>':''}</div>`;
 if(S.m==='kad')t+=S.draws?`<div class="ex">Cabutan: kad dalam ${({A:'A',B:'B',I:'A ∩ B',U:'A ∪ B'})[S.reg]} sebanyak <b>${S.hits}</b> kali daripada ${S.draws} → ${(S.hits/S.draws).toFixed(2)} (teori ${(({A:nA,B:nB,I:nI,U:nU})[S.reg]/n).toFixed(2)})</div>`:`<div class="tip">Tukar peristiwa A, B atau bilangan kad. Ketik A, B, A ∩ B atau A ∪ B untuk melorek kawasan.</div>`;
 else t+=`<div class="tip">Skor: ${S.score}/${S.tot}</div>`;
 info.innerHTML=t}
const sa=document.getElementById('sa'),sb=document.getElementById('sb'),sn=document.getElementById('sn');
sa.innerHTML=sb.innerHTML=EV.map((e,i)=>`<option value="${i}">${e[0]}</option>`).join('');sa.value=S.A;sb.value=S.B;
const reset=()=>{S.draws=0;S.hits=0;S.last=null};
sa.onchange=()=>{S.A=+sa.value;reset();snd('ketik');draw();showInfo()};sb.onchange=()=>{S.B=+sb.value;reset();snd('ketik');draw();showInfo()};
sn.oninput=()=>{S.N=+sn.value;document.getElementById('snv').textContent=S.N;reset();draw();showInfo()};
document.querySelectorAll('#reg .chip').forEach(b=>b.onclick=()=>{S.reg=b.dataset.r;document.querySelectorAll('#reg .chip').forEach(x=>x.classList.toggle('on',x===b));S.hits=0;S.draws=0;snd('ketik');draw();showInfo()});
function drawCard(){const x=1+Math.floor(Math.random()*S.N);S.draws++;S.last=x;if(inReg(x,sets()))S.hits++;return x}
function newQ(){let a,b,ex=Math.random()<.5,t=0;do{S.N=6+Math.floor(Math.random()*15);a=Math.floor(Math.random()*EV.length);b=Math.floor(Math.random()*EV.length);S.A=a;S.B=b;const s=sets();t++;if(a!==b&&s.A.length&&s.B.length&&s.A.length<S.N&&s.B.length<S.N&&(s.I.length===0)===ex)break}while(t<200);
 S.q={done:false};S.reg='U';curSep=null;reset();setUI();draw();showInfo()}
function setUI(){const c=S.m==='cabar',ctrl=document.getElementById('ctrl');
 sa.value=S.A;sb.value=S.B;sn.value=S.N;document.getElementById('snv').textContent=S.N;
 document.getElementById('evs').classList.toggle('hide',c);document.getElementById('slw').classList.toggle('hide',c);document.getElementById('reg').classList.toggle('hide',c);
 const ans=document.getElementById('ans');
 if(c){ans.innerHTML=S.q&&S.q.done?`<button class="big" id="nx" style="grid-column:1/-1">Soalan seterusnya ▶</button>`:`<button class="big" data-a="1">Saling eksklusif</button><button class="big alt" data-a="0">Tidak saling eksklusif</button>`;
  ans.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const ex=sets().I.length===0,ok=(b.dataset.a==='1')===ex;S.q.done=true;S.q.ok=ok;S.tot++;if(ok){S.score++;snd('betul');if(window.FX)FX.stars(b,10)}else{snd('salah')}setUI();draw();showInfo()});
  const nx=document.getElementById('nx');if(nx)nx.onclick=newQ}
 else{ans.innerHTML=`<button class="big" id="cabut">🎴 Cabut kad</button><button class="big alt" id="c20">× 20</button>`;
  document.getElementById('cabut').onclick=()=>{const x=drawCard();snd(inReg(x,sets())?'betul':'ketik');draw();showInfo()};
  document.getElementById('c20').onclick=()=>{for(let k=0;k<20;k++)drawCard();snd('ketik');draw();showInfo()}}
 document.querySelectorAll('#reg .chip').forEach(x=>x.classList.toggle('on',x.dataset.r===S.reg))}
// mod teka: nombor dalam Venn disembunyikan sehingga murid menjawab
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));S.m=b.dataset.m;snd('ketik');if(S.m==='cabar')newQ();else{S.q=null;reset();setUI();draw();showInfo()}});
new ResizeObserver(()=>draw()).observe(stage);setUI();draw();showInfo();
</script>
<script src="../../teras/fx.js"></script>
<script>if(window.FX){document.getElementById('sndslot').innerHTML=FX.button()}</script>
<script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script>
</body>
</html>
